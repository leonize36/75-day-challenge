const foodById = id => FOODS.find(f => f.id === id);

/* Allergies are hard exclusions, not preferences. */
function allowed(f, prefs, dislikes) {
  const p = prefs || {};
  if (dislikes && dislikes.includes(f.id)) return false;
  if (p.nutAllergy && f.t.includes('nut')) return false;
  if (p.vegan && !f.t.includes('vg')) return false;
  if (p.vegetarian && !f.t.includes('v')) return false;
  if (p.pescatarian && !f.t.includes('v') && !f.t.includes('fish')) return false;
  if (p.glutenFree && !f.t.includes('gf')) return false;
  if (p.dairyFree && !f.t.includes('df')) return false;
  if (p.halal && !f.t.includes('h')) return false;
  if (p.kosher && !f.t.includes('k')) return false;
  if (p.noPork && f.t.includes('pork')) return false;
  if (p.noRedMeat && f.t.includes('red')) return false;
  if (p.budget && f.cost > 2) return false;
  if (p.noCook && f.cook > 1) return false;
  return true;
}

/* ---------- targets ---------- */
function nutriTargets(n) {
  const p = P();
  if (!profileComplete()) return null;
  const s = p.sex === 'f' ? -161 : 5;
  const bmr = Math.round(10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + s);
  const tdee = Math.round(bmr * (p.activity || 1.375));
  const g = NGOALS[nutGoal()] || NGOALS.health;
  let kcal = Math.round(tdee * (1 + g.adj) / 10) * 10;

  // Floors. A deficit below these on two workouts a day stops
  // being a diet and starts being a hole.
  const floor = p.sex === 'f' ? 1400 : 1700;
  const capped = kcal < floor;
  if (capped) kcal = floor;

  const protein = Math.round(p.weightKg * g.protein);
  const fat = Math.round(kcal * 0.28 / 9);
  const carb = Math.max(50, Math.round((kcal - protein * 4 - fat * 9) / 4));

  return { bmr, tdee, kcal, protein, fat, carb, capped, floor,
    pattern: (n && n.pattern) || (n && n.prefs && n.prefs.vegan ? 'plant' : g.pattern) };
}

/* ---------- meal building ---------- */
function buildDay(t, prefs, dislikes, meals, seed, away) {
  const cfg = MEAL_SPLITS[meals] || MEAL_SPLITS[3];
  const awayList = away || [];
  const round = (x, step) => Math.round(x / step) * step;

  const BREAKFAST_P = ['yog', 'eggs', 'cottage', 'whey', 'maas', 'soyyog'];
  const BREAKFAST_C = ['oats', 'bread'];
  const BREAKFAST_V = ['berry', 'banana', 'apple', 'orange'];

  const usedToday = [];
  const poolFor = (c, mealName) => FOODS.filter(f => {
    if (f.c !== c || !allowed(f, prefs, dislikes)) return false;
    // A meal eaten away from a kitchen only uses things that travel.
    if (awayList.includes(mealName) && (!f.port || f.cook > 1)) return false;
    return true;
  });
  const pick = (c, i, mealName, prefer) => {
    let p = poolFor(c, mealName);
    if (!p.length) return null;
    if (prefer) { const m = p.filter(f => prefer.includes(f.id)); if (m.length) p = m; }
    const fresh = p.filter(f => !usedToday.includes(f.id));
    const from = fresh.length ? fresh : p;
    const f = from[(seed * 3 + i * 7) % from.length];
    usedToday.push(f.id);
    return f;
  };

  return cfg.split.map((share, i) => {
    const name = cfg.names[i];
    const kcalT = t.kcal * share, protT = t.protein * share;
    const first = i === 0, snack = /snack/i.test(name);
    const items = [];
    const kcalNow = () => items.reduce((a, x) => a + x.f.kcal * x.mult, 0);
    const protNow = () => items.reduce((a, x) => a + x.f.p * x.mult, 0);

    // 1. protein, capped at a sensible portion for that food
    const P = pick('protein', i + 1, name, first ? BREAKFAST_P : null);
    if (P) items.push({ f: P, mult: Math.max(0.5, Math.min(P.max, round(protT / P.p, 0.25))) });

    // 2. a second protein when one food cannot carry the meal
    if (protT - protNow() > 10) {
      const P2 = pick('protein', i + 11, name);
      if (P2) {
        const need = protT - protNow();
        items.push({ f: P2, mult: Math.max(0.5, Math.min(P2.max, round(need / P2.p, 0.25))) });
      }
    }

    // 3. vegetables. Two in main meals, because one serving is not enough fibre.
    if (!snack) {
      const V = pick('veg', i + 2, name, first ? BREAKFAST_V : null);
      if (V) items.push({ f: V, mult: 1 });
      if (!first && kcalT - kcalNow() > 150) {
        const V2 = pick('veg', i + 5, name);
        if (V2) items.push({ f: V2, mult: 1 });
      }
    }

    // 4. fat, a small fixed amount so it never disappears
    let room = kcalT - kcalNow();
    if (room > 120) {
      const F = pick('fat', i + 3, name);
      if (F) items.push({ f: F, mult: Math.max(0.5, Math.min(F.max, round(Math.min(room * 0.3, 170) / F.kcal, 0.5))) });
    }

    // 5. carbohydrate fills whatever is genuinely left, or nothing
    room = kcalT - kcalNow();
    if (room > 60) {
      const C = pick('carb', i + 4, name, first ? BREAKFAST_C : null);
      if (C) {
        const mult = round(room / C.kcal, 0.25);
        if (mult >= 0.25) items.push({ f: C, mult: Math.min(C.max, mult) });
      }
    }

    // 6. top up. Portion caps mean one round of picks cannot fill a
    //    large meal, which is what happens on two meals a day.
    for (let pass = 0; pass < 4; pass++) {
      room = kcalT - kcalNow();
      if (room < 120) break;
      const cat = pass % 2 === 0 ? 'carb' : 'fat';
      const X = pick(cat, i + 20 + pass * 3, name);
      if (!X) break;
      const mult = Math.max(0.5, Math.min(X.max, round(Math.min(room * 0.7, X.kcal * X.max) / X.kcal, 0.25)));
      items.push({ f: X, mult });
    }

    // 7. trim. Legumes and other protein sources carry calories with the
    //    protein, so hitting the protein share can overshoot energy badly.
    //    Shrink the non-protein items first, then the second protein.
    let overBy = kcalNow() - kcalT * 1.1;
    if (overBy > 0) {
      const shrinkOrder = items.filter(x => x.f.c !== 'protein')
        .sort((a, b) => (b.f.kcal * b.mult) - (a.f.kcal * a.mult));
      for (const x of shrinkOrder) {
        if (overBy <= 0) break;
        const canCut = (x.mult - 0.25) * x.f.kcal;
        const cut = Math.min(canCut, overBy);
        if (cut <= 0) continue;
        x.mult = Math.max(0.25, round(x.mult - cut / x.f.kcal, 0.25));
        overBy = kcalNow() - kcalT * 1.1;
      }
      // still over: the extra protein source is the next thing to give
      if (overBy > 0 && items.length > 1) {
        const extra = items.filter(x => x.f.c === 'protein').slice(1)
          .sort((a, b) => (b.f.kcal * b.mult) - (a.f.kcal * a.mult))[0];
        if (extra) {
          const cut = Math.min((extra.mult - 0.25) * extra.f.kcal, overBy);
          if (cut > 0) extra.mult = Math.max(0.25, round(extra.mult - cut / extra.f.kcal, 0.25));
        }
      }
      // drop anything the trim reduced to nothing meaningful
      for (let i = items.length - 1; i > 0; i--) {
        if (items[i].f.c !== 'protein' && items[i].mult <= 0.25 && kcalNow() > kcalT * 1.15) items.splice(i, 1);
      }
    }

    return { name, kcal: Math.round(kcalNow()), protein: Math.round(protNow()), items,
      away: awayList.includes(name) };
  });
}

function groceryList(t, prefs, dislikes, meals, away) {
  const tally = {};
  for (let d = 0; d < 7; d++) {
    buildDay(t, prefs, dislikes, meals, d, away).forEach(m =>
      m.items.forEach(x => { tally[x.f.id] = (tally[x.f.id] || 0) + x.mult; }));
  }
  const byCat = { protein: [], carb: [], veg: [], fat: [] };
  Object.keys(tally).forEach(id => {
    const f = foodById(id);
    byCat[f.c].push({ f, n: Math.round(tally[id] * 10) / 10 });
  });
  Object.keys(byCat).forEach(k => byCat[k].sort((a, b) => b.n - a.n));
  return byCat;
}

function swapsFor(f, prefs, dislikes) {
  return FOODS.filter(x => x.c === f.c && x.id !== f.id && allowed(x, prefs, dislikes)).slice(0, 6);
}

/* Build an ordered method for a meal. The longest item starts
   first, everything shorter runs alongside it, and the timing
   reflects that rather than adding every step end to end. */
function mealMethod(meal) {
  const parts = meal.items
    .map(x => ({ f: x.f, mult: x.mult, p: PREP[x.f.id] || [1, 1, 'Prepare the ' + x.f.n.toLowerCase()] }))
    .filter(x => x.p[1] > 0);
  if (!parts.length) return { steps: ['Assemble and serve.'], total: 2, active: 2 };

  const sorted = parts.slice().sort((a, b) => b.p[1] - a.p[1]);
  const longest = sorted[0];
  const activeSum = sorted.reduce((a, x) => a + x.p[0], 0);
  const total = Math.max(longest.p[1], activeSum);

  const steps = [];
  const say = x => x.p[2] + (x.mult !== 1 ? ` (${x.mult} × ${x.f.s})` : ` (${x.f.s})`) + '.';

  steps.push('Start with the longest thing. ' + say(longest));

  const rest = sorted.slice(1);
  const cooked = rest.filter(x => x.p[1] > 3);
  const cold = rest.filter(x => x.p[1] <= 3);

  cooked.forEach((x, i) => steps.push((i === 0 ? 'While that cooks, ' : 'Then ') + say(x).charAt(0).toLowerCase() + say(x).slice(1)));
  if (cold.length) {
    const lower = s => s.charAt(0).toLowerCase() + s.slice(1);
    const bits = cold.map(x => lower(say(x).replace(/\.$/, '')));
    steps.push('No cooking needed for the rest: ' + bits.join(', then ') + '.');
  }
  steps.push('Plate it together and season. Salt, pepper, lemon, or chilli, whichever suits.');

  return { steps, total: Math.round(total), active: Math.round(activeSum) };
}

/* Which proteins repeat across the week, so they can be cooked once. */
function batchHints(t, prefs, dislikes, meals, away) {
  const tally = {};
  for (let d = 0; d < 7; d++) {
    buildDay(t, prefs, dislikes, meals, d, away).forEach(m =>
      m.items.forEach(x => {
        if (x.f.c !== 'protein' && x.f.c !== 'carb') return;
        if ((PREP[x.f.id] || [0, 0])[1] < 10) return;
        tally[x.f.id] = (tally[x.f.id] || 0) + 1;
      }));
  }
  return Object.keys(tally)
    .filter(id => tally[id] >= 2)
    .map(id => ({ f: foodById(id), days: tally[id] }))
    .sort((a, b) => b.days - a.days)
    .slice(0, 4);
}

/* Warnings the plan itself should raise, computed from the plan. */
function planWarnings(t, n) {
  const w = [];
  const meals = n.meals || 3;
  const perMeal = Math.round(t.protein / meals);
  if (perMeal > 55) w.push(`${meals} meals means about ${perMeal} g of protein each. Past roughly 50 g in a sitting most people struggle, so a shake or an extra snack is usually easier than a bigger plate.`);
  if (meals === 2 && t.kcal > 2400) w.push(`${t.kcal} kcal across two meals is a lot of food at once. Three meals is easier to actually finish.`);
  const day = buildDay(t, n.prefs || {}, n.dislikes || [], meals, 0, n.away || []);
  const short = day.filter(m => m.kcal < t.kcal * 0.6 / meals);
  if (short.length) w.push(`Your exclusions leave ${short.map(m => m.name.toLowerCase()).join(' and ')} hard to fill. Allowing a few more foods would open the plan up.`);
  const total = day.reduce((a, m) => a + m.kcal, 0);
  const off = Math.round((total / t.kcal - 1) * 100);
  if (Math.abs(off) >= 12) {
    w.push(off > 0
      ? `The plan lands about ${off}% above your ${t.kcal} kcal target, at roughly ${total}. Your restrictions leave mostly calorie-dense protein sources, so either loosen one of them or treat the target as the thing to correct.`
      : `The plan lands about ${Math.abs(off)}% below your ${t.kcal} kcal target, at roughly ${total}. Add a serving somewhere rather than eating short.`);
  }
  if ((n.prefs || {}).vegan) w.push('On a plant-based plan, vitamin B12 needs a supplement or fortified foods. Iron and omega-3 are worth paying attention to as well.');
  return w;
}

/* ---------- safety gate ---------- */
const RED_FLAGS = [
  ['chestPain', 'Chest pain or pressure, at rest or during activity'],
  ['faint', 'Fainting or losing consciousness'],
  ['breath', 'Unexplained shortness of breath'],
  ['heart', 'Irregular or racing heartbeat'],
  ['dizzy', 'Severe or repeated dizziness'],
  ['neuro', 'New numbness, weakness, or loss of coordination'],
  ['surgery', 'Surgery in the last 3 months without clearance'],
  ['told', 'Been told by a doctor not to exercise without supervision']
];
const AMBER_FLAGS = [
  ['condition', 'A managed condition such as blood pressure, diabetes, or asthma'],
  ['meds', 'Medication that affects heart rate or blood pressure'],
  ['preg', 'Pregnant or within 6 months postpartum'],
  ['inactive', 'Not exercised at all in the last year']
];

function safetyStatus(tr) {
  const f = tr.flags || {};
  if (RED_FLAGS.some(([k]) => f[k])) return 'clearance';
  // Pain is asked once, at the pain step. Severe pain routes the same
  // way a red flag does, rather than producing a careful programme.
  if (f.painSevere) return 'clearance';
  if (AMBER_FLAGS.some(([k]) => f[k])) return 'restricted';
  if (f.painOngoing) return 'restricted';
  return 'cleared';
}

/* ---------- experience, from facts not opinion ---------- */
function experienceScore(h) {
  let s = 0;
  const m = h.monthsConsistent || 0;
  s += m === 0 ? 0 : m <= 3 ? 1 : m <= 8 ? 2 : 3;
  const w = h.sessionsPerWeek || 0;
  s += w === 0 ? 0 : w === 1 ? 1 : w <= 3 ? 2 : 3;
  s += (h.technique || 0);
  const b = h.breakWeeks || 0;
  s += b > 24 ? -2 : b >= 12 ? -1 : 0;
  return Math.max(0, s);
}
function trainingStatus(h) {
  const s = experienceScore(h);
  return s <= 2 ? 'novice' : s <= 6 ? 'developing' : 'experienced';
}

/* ---------- split by days ---------- */
function splitFor(days, status) {
  if (days <= 1) return ['full'];
  if (days === 2) return ['full', 'full'];
  if (days === 3) return status === 'experienced' ? ['upper', 'lower', 'full'] : ['full', 'full', 'full'];
  if (days === 4) return ['upper', 'lower', 'upper', 'lower'];
  if (days === 5) return ['upper', 'lower', 'full', 'upper', 'lower'];
  return ['upper', 'lower', 'full', 'upper', 'lower', 'full'].slice(0, days);
}
const SESSION_PATTERNS = {
  full:  ['squat', 'hpush', 'hpull', 'hinge', 'core', 'carry'],
  upper: ['hpush', 'hpull', 'vpush', 'vpull', 'core'],
  lower: ['squat', 'hinge', 'lunge', 'core', 'carry']
};

/* ---------- exercise selection ---------- */
/* Your own body is always available, so 'none' is always in the
   equipment set. Without this, buying dumbbells removed press-ups. */
const equipSet = tr => Array.from(new Set(['none'].concat(tr.equipment || [])));

function eligible(tr) {
  const eq = equipSet(tr);
  const hurt = tr.areas || [];
  const maxSkill = DOSE[trainingStatus(tr.history || {})].skill;
  const restricted = safetyStatus(tr) === 'restricted';
  return EX.filter(e => {
    if (!e.eq.some(x => eq.includes(x))) return false;
    if (e.skill > maxSkill) return false;
    if ((e.care || []).some(a => hurt.includes(a))) return false;
    if (restricted && e.impact > 0) return false;
    return true;
  });
}

function pickForPattern(pool, pat, used, seed) {
  const opts = pool.filter(e => e.pat === pat && !used.includes(e.id));
  if (!opts.length) return null;
  // Rank by how demanding the exercise is, then rotate only among the
  // top few. Rotating across the whole pool gives variety but hands a
  // gym user wall push-ups, which is worse than no variety at all.
  opts.sort((a, b) => b.skill - a.skill || a.id.localeCompare(b.id));
  const top = opts.slice(0, Math.min(3, opts.length));
  const e = top[seed % top.length];
  used.push(e.id);
  return e;
}

/* ---------- session time budget ---------- */
function timeBudget(mins) {
  if (mins <= 20) return { warm: 3, main: 14, cardio: 0, cool: 3 };
  if (mins <= 30) return { warm: 4, main: 20, cardio: 4, cool: 2 };
  if (mins <= 45) return { warm: 5, main: 30, cardio: 7, cool: 3 };
  if (mins <= 60) return { warm: 7, main: 40, cardio: 10, cool: 3 };
  return { warm: 8, main: 55, cardio: 15, cool: 4 };
}

/* ---------- generator ---------- */
function generateProgram(tr) {
  const status = trainingStatus(tr.history || {});
  const dose = DOSE[status];
  const goal = TGOALS[tr.goal] || TGOALS.health;
  const days = Math.max(1, Math.min(6, tr.days || 3));
  const mins = tr.minutes || 45;
  const budget = timeBudget(mins);
  const pool = eligible(tr);
  const split = splitFor(days, status);
  const restricted = safetyStatus(tr) === 'restricted';

  // High-impact cardio needs a base first. Prescribing a jog to
  // someone who has not trained in six months is how people get hurt
  // in week one and never come back.
  const noImpact = restricted || status === 'novice';
  const cardioPool = CARDIO.filter(c => {
    if (!c.eq.some(x => equipSet(tr).includes(x))) return false;
    if ((c.care || []).some(a => (tr.areas || []).includes(a))) return false;
    if (noImpact && c.impact > 1) return false;
    return true;
  }).sort((a, b) => {
    // Equipment you actually own comes first. Otherwise a treadmill,
    // a spin bike, and a rower sit unused while the plan says "walk".
    const owned = c => (c.eq.includes('none') ? 0 : 1);
    return owned(b) - owned(a);
  });

  const maxEx = Math.max(3, Math.min(dose.exercises[1], Math.floor(budget.main / (dose.sets * 2.2))));
  const warnings = [];

  const sessions = split.map((kind, di) => {
    const used = [];
    const wanted = SESSION_PATTERNS[kind].slice(0, maxEx);
    const items = [];
    wanted.forEach((pat, i) => {
      const e = pickForPattern(pool, pat, used, di * 2 + i);
      if (e) items.push({ e, sets: dose.sets, reps: e.reps || goal.reps, rir: dose.rir, rest: goal.rest });
      else if (!warnings.some(w => w.includes(PATTERNS_T[pat]))) {
        warnings.push(`${PATTERNS_T[pat]} left out. Nothing in your equipment and limits covers it.`);
      }
    });
    const c = cardioPool.length ? cardioPool[di % cardioPool.length] : null;
    return { day: di + 1, kind, items,
      cardio: budget.cardio && c ? { n: c.n, mins: budget.cardio, effort: 'Easy to moderate, able to talk' } : null,
      budget };
  });

  const weeklyCardio = sessions.reduce((a, s) => a + (s.cardio ? s.cardio.mins : 0), 0);

  // A session with one or two exercises is not a programme. Say so rather
  // than handing someone six days of wall push-ups and calling it a plan.
  const thin = sessions.filter(s => s.items.length < 3).length;
  const viable = !(pool.length < 6 || thin > sessions.length / 2);
  if (!viable) {
    warnings.unshift(`Your equipment and the areas that hurt leave only ${pool.length} suitable exercises, which is not enough to build a balanced week. What is below is what can be done safely, not a full programme. A resistance band opens up most of the missing patterns, and anything painful is worth having looked at.`);
  }
  if (!weeklyCardio && mins <= 20) {
    warnings.push('Sessions of 20 minutes leave no room for cardio inside them. Walking outside of these sessions is where that comes from.');
  }

  return { status, goalName: goal.name, days, mins, sessions, warnings, weeklyCardio, restricted,
    viable, poolSize: pool.length, generated: today() };
}

/* ---------- 75 Hard pairing ---------- */
function dailyPair(prog, weekday) {
  if (!prog) return null;
  const idx = prog.sessions.length ? (weekday % prog.sessions.length) : 0;
  const trainDay = prog.days >= 6 ? true : (weekday % 7) < prog.days;
  const s = trainDay ? prog.sessions[idx] : null;
  const easy = { n: 'Outdoor walk', mins: 45, effort: 'Easy. Conversation pace the whole way.' };
  return { hard: s, easy,
    note: s ? 'One programmed session and one easy outdoor session. Two 45 minute workouts is the rule. Two hard workouts is not.'
            : 'No programmed session today, so both workouts stay easy. Walk, cycle, or mobility.' };
}

/* ---------- progression ---------- */
function progressOf(id) { return (state.training && state.training.progress && state.training.progress[id]) || { hits: 0, level: 0 }; }

function logProgress(id) {
  state.training.progress = state.training.progress || {};
  const p = progressOf(id);
  p.hits = (p.hits || 0) + 1;
  if (p.hits >= 2) { p.hits = 0; p.level = (p.level || 0) + 1; }
  state.training.progress[id] = p;
  save();
}

function progressionAdvice(item) {
  const p = progressOf(item.e.id);
  if (p.level === 0 && p.hits === 0) return `Start at ${item.sets} sets of ${item.reps}, stopping with about ${item.rir} good repetitions left in you.`;
  if (p.hits === 1) return `Hit the top of the range once. Do it again with the same control and the load goes up.`;
  const steps = ['same load, more reps', 'small load increase', 'add a set', 'harder variation'];
  return `Level ${p.level}. Next step: ${steps[Math.min(p.level, steps.length - 1)]}. Only when the top of the range comes with ${item.rir} left in reserve and clean form.`;
}

/* ============================================================
   MEAL BUILDER — ingredient level
   Nutrition per food is stored against the gram weight of the
   listed serving, so any portion scales from it. Values are
   rounded reference figures for common foods, not label data.
   MACROS[id] = [carbohydrate g, fat g, fibre g, serving weight g, state]
   state: c cooked, r raw, n not applicable
   ============================================================ */
const MACROS = {
  chicken:[0,5.4,0,150,'c'],   beef:[0,17,0,150,'c'],     lamb:[0,22,0,150,'c'],
  pork:[0,10,0,150,'c'],       mince_t:[0,9,0,150,'c'],   fish:[0,3,0,170,'c'],
  salmon:[0,16,0,140,'c'],     tuna:[0,1,0,120,'c'],      sardine:[0,11,0,100,'c'],
  eggs:[1,10,0,100,'c'],       eggs_b:[1,10,0,100,'c'],   biltong:[1,4,0,50,'n'],
  yog:[7,0.5,0,200,'n'],         cottage:[5,5,0,150,'n'],   maas:[12,6,0,250,'n'],
  cheese:[1,13,0,40,'n'],      whey:[3,1,0,30,'n'],       tofu:[7,17,2,200,'r'],
  tempeh:[14,16,7,150,'r'],    lentil:[40,1,16,200,'c'],  beans:[47,1,17,200,'c'],
  chick:[55,5,15,200,'c'],     edam:[14,8,8,150,'c'],     soyyog:[13,4,1,200,'n'],
  rice:[57,1,1,200,'c'],       potato:[48,0,5,250,'c'],   sweetp:[50,0,8,250,'c'],
  butter:[28,0,5,250,'c'],     oats:[40,5,6,60,'r'],      pasta:[57,2,8,80,'r'],
  bread:[32,2,5,70,'n'],       wrap:[34,4,3,60,'n'],      quinoa:[42,4,5,200,'c'],
  couscous:[46,1,3,60,'r'],    samp:[42,2,7,200,'c'],     corn:[28,2,3,150,'c'],
  broc:[10,0,4,150,'c'],       spin:[2,0,2,100,'r'],      lettuce:[3,0,1,80,'r'],
  tomato:[8,0,2,200,'r'],      cuke:[5,0,1,150,'r'],      mush:[3,0,2,150,'r'],
  pepper:[9,0,3,150,'r'],      carrot:[14,0,4,150,'r'],   courg:[5,0,2,150,'r'],
  beansg:[10,0,5,150,'c'],     cabb:[9,0,4,150,'r'],      onion:[10,0,2,110,'r'],
  berry:[15,0,5,150,'r'],      banana:[27,0,3,120,'r'],   apple:[25,0,4,180,'r'],
  orange:[15,0,3,130,'r'],     oil:[0,13.5,0,14,'n'],     avo:[9,15,7,100,'r'],
  nuts:[6,15,4,30,'n'],        pb:[3,8,1,16,'n'],         seeds:[4,14,2,30,'n'],
  olives:[3,7,2,50,'n'],       hummus:[7,10,3,50,'n']
};
const STATE_LABEL = { c: 'cooked weight', r: 'raw weight', n: '' };

/* Grams for a unit. Volume units are approximated by weight, which
   is close enough for oil and yoghurt and wrong for nothing that
   matters at this level of precision. */
const UNITS = {
  g:       { n: 'grams',      g: 1 },
  ml:      { n: 'millilitres',g: 1 },
  serving: { n: 'servings',   g: null },
  tbsp:    { n: 'tablespoons',g: 15 },
  tsp:     { n: 'teaspoons',  g: 5 },
  piece:   { n: 'pieces',     g: null }
};

const myFoods = () => (state.nutrition && state.nutrition.myFoods) || [];
function anyFood(id) { return foodById(id) || myFoods().find(f => f.id === id) || null; }

/* Everything per 100 g, computed once from the serving figures. */
function per100(f) {
  if (f.custom) {
    const g = f.g || 100;
    return { kcal: f.kcal / g * 100, p: f.p / g * 100, carb: (f.carb || 0) / g * 100,
      fat: (f.fat || 0) / g * 100, fib: f.fib == null ? null : f.fib / g * 100 };
  }
  const m = MACROS[f.id] || [0, 0, 0, 100, 'n'];
  const g = m[3] || 100;
  return { kcal: f.kcal / g * 100, p: f.p / g * 100, carb: m[0] / g * 100,
    fat: m[1] / g * 100, fib: m[2] / g * 100 };
}
function servingGrams(f) { return f.custom ? (f.g || 100) : ((MACROS[f.id] || [])[3] || 100); }
function prepState(f) { return f.custom ? (f.state || 'n') : ((MACROS[f.id] || [])[4] || 'n'); }

/* One ingredient line, resolved to grams then to nutrients. */
function lineGrams(line) {
  const f = anyFood(line.fid);
  if (!f) return 0;
  const u = UNITS[line.unit] || UNITS.g;
  const g = u.g == null ? servingGrams(f) : u.g;
  return (line.qty || 0) * g;
}
function lineNutrition(line) {
  const f = anyFood(line.fid);
  if (!f) return { kcal: 0, p: 0, carb: 0, fat: 0, fib: 0, unknown: true };
  const per = per100(f), g = lineGrams(line) / 100;
  return { kcal: per.kcal * g, p: per.p * g, carb: per.carb * g, fat: per.fat * g,
    fib: per.fib == null ? null : per.fib * g, unknown: false };
}
function mealNutrition(lines) {
  const t = { kcal: 0, p: 0, carb: 0, fat: 0, fib: 0, fibKnown: true };
  lines.forEach(l => {
    const n = lineNutrition(l);
    t.kcal += n.kcal; t.p += n.p; t.carb += n.carb; t.fat += n.fat;
    if (n.fib == null) t.fibKnown = false; else t.fib += n.fib;
  });
  return t;
}

/* Meal share of the day. An app rule, editable, not a requirement. */
const MEAL_TYPES = {
  breakfast: { n: 'Breakfast', k: 0.28, p: 0.25 },
  lunch:     { n: 'Lunch',     k: 0.32, p: 0.30 },
  dinner:    { n: 'Dinner',    k: 0.32, p: 0.33 },
  snack:     { n: 'Snack',     k: 0.12, p: 0.12 },
  postwork:  { n: 'After training', k: 0.15, p: 0.20 }
};

function dailyTargets() {
  const n = nutri();
  const t = n ? nutriTargets(n) : null;
  if (t) return t;
  return { kcal: state.calorieTarget || 2000, protein: state.proteinTarget || 130,
    carb: null, fat: null, estimated: false };
}
function mealTarget(type) {
  const d = dailyTargets(), m = MEAL_TYPES[type] || MEAL_TYPES.lunch;
  return { kcal: Math.round(d.kcal * m.k), protein: Math.round(d.protein * m.p),
    fib: Math.round(30 * m.k) };
}

/* Ranges, not pass or fail. */
function fitLabel(actual, target) {
  if (!target) return { txt: 'No target', cls: '' };
  const r = actual / target;
  if (r >= 0.9 && r <= 1.1) return { txt: 'On target', cls: 'chip' };
  if (r > 1.1 && r <= 1.25) return { txt: 'Slightly over', cls: 'chip amber' };
  if (r < 0.9 && r >= 0.75) return { txt: 'Slightly under', cls: 'chip amber' };
  return { txt: r > 1 ? 'Well over' : 'Well under', cls: 'chip red' };
}

/* Balance indicator. Not a health score, and not clinically validated. */
function mealBalance(lines, type) {
  const n = mealNutrition(lines), t = mealTarget(type);
  const cats = lines.map(l => { const f = anyFood(l.fid); return f ? f.c : null; });
  let s = 0; const why = [];
  if (n.p >= t.protein * 0.9) { s += 30; } else why.push('protein is short');
  if (cats.includes('veg')) { s += 25; } else why.push('no vegetable or fruit');
  if (n.fibKnown && n.fib >= t.fib * 0.8) { s += 15; } else if (n.fibKnown) why.push('low fibre');
  const kr = n.kcal / t.kcal;
  if (kr >= 0.85 && kr <= 1.15) { s += 15; } else why.push(kr > 1 ? 'over the calorie share' : 'under the calorie share');
  if (cats.includes('carb') || type === 'snack') { s += 10; } else why.push('no carbohydrate');
  if (new Set(cats).size >= 3) { s += 5; } else why.push('little variety');
  const band = s >= 80 ? 'Well balanced' : s >= 60 ? 'Mostly balanced' : s >= 40 ? 'Could be improved' : 'Missing components';
  return { score: s, band, why };
}

/* Actionable suggestions, not "protein too low". */
function mealSuggestions(lines, type) {
  const n = mealNutrition(lines), t = mealTarget(type);
  const out = [];
  const prefs = (nutri() && nutri().prefs) || {};
  const dis = (nutri() && nutri().dislikes) || [];

  const gapP = t.protein - n.p;
  if (gapP > 6) {
    const cands = FOODS.filter(f => f.c === 'protein' && allowed(f, prefs, dis))
      .map(f => { const per = per100(f); return { f, per, ratio: per.p / Math.max(per.kcal, 1) }; })
      .sort((a, b) => b.ratio - a.ratio).slice(0, 3);
    const bits = cands.map(c => {
      const g = Math.round(gapP / c.per.p * 100 / 10) * 10;
      return `${g} g ${c.f.n.toLowerCase()} (about ${Math.round(c.per.kcal * g / 100)} kcal)`;
    });
    out.push(`Protein is ${Math.round(gapP)} g short of the ${t.protein} g share for this meal. Add ${bits.join(', or ')}.`);
  }

  if (!lines.some(l => { const f = anyFood(l.fid); return f && f.c === 'veg'; })) {
    out.push('No vegetable or fruit in this meal. One serving adds fibre and volume for very few calories.');
  }

  const over = n.kcal - t.kcal;
  if (over > t.kcal * 0.2 && gapP > 0) {
    const carbLine = lines.filter(l => { const f = anyFood(l.fid); return f && f.c === 'carb'; })
      .sort((a, b) => lineNutrition(b).kcal - lineNutrition(a).kcal)[0];
    if (carbLine) {
      const f = anyFood(carbLine.fid), cut = Math.round(lineGrams(carbLine) * 0.25);
      out.push(`The meal is ${Math.round(over)} kcal over its share while protein is short. Cutting ${cut} g of ${f.n.toLowerCase()} and adding the protein above lands closer to both numbers.`);
    }
  }

  if (n.kcal < t.kcal * 0.6 && lines.length) {
    out.push('This is well under the calorie share for the meal. Under-eating early usually shows up as a raid on the cupboard later, not as progress.');
  }
  return out;
}

/* Swaps by intent, within the same category. */
function swapByIntent(line, intent) {
  const f = anyFood(line.fid);
  if (!f || f.custom) return [];
  const prefs = (nutri() && nutri().prefs) || {};
  const dis = (nutri() && nutri().dislikes) || [];
  const base = per100(f), g = lineGrams(line);
  return FOODS.filter(x => x.c === f.c && x.id !== f.id && allowed(x, prefs, dis))
    .map(x => {
      const p = per100(x);
      const score = intent === 'protein' ? p.p - base.p
        : intent === 'fewer' ? base.kcal - p.kcal
        : intent === 'fibre' ? (p.fib || 0) - (base.fib || 0)
        : -Math.abs(p.kcal - base.kcal);
      return { f: x, score, kcal: Math.round(p.kcal * g / 100), p: Math.round(p.p * g / 100) };
    })
    .sort((a, b) => b.score - a.score).slice(0, 4);
}

/* Macro against calorie consistency, for user-created foods. */
function macroCheck(f) {
  const est = (f.p || 0) * 4 + (f.carb || 0) * 4 + (f.fat || 0) * 9;
  if (!f.kcal || !est) return null;
  const diff = Math.abs(f.kcal - est) / f.kcal * 100;
  return diff > 15 ? Math.round(diff) : null;
}

/* ============================================================
   render
   ============================================================ */
const el = h => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

let lastTab = null, fieldCache = {}, skipRestore = false;

/* The screen is rebuilt on every change, which wiped anything typed but
   not yet saved. Values are carried across a rebuild and put back into
   any field that comes up empty. A real save clears the cache, so forms
   still empty themselves after you add something. */
function snapshotFields() {
  const v = document.getElementById('view');
  if (!v) return;
  v.querySelectorAll('input[id], textarea[id], select[id]').forEach(f => {
    if (f.type === 'checkbox' || f.type === 'radio') return;
    if (f.value !== '' && f.value != null) fieldCache[f.id] = f.value;
  });
}
function restoreFields() {
  const v = document.getElementById('view');
  if (!v) return;
  v.querySelectorAll('input[id], textarea[id], select[id]').forEach(f => {
    if (f.type === 'checkbox' || f.type === 'radio') return;
    if ((f.value === '' || f.value == null) && fieldCache[f.id] != null) f.value = fieldCache[f.id];
  });
}

function render() {
  const keepY = window.scrollY;
  snapshotFields();
  if (skipRestore) { fieldCache = {}; skipRestore = false; }
  audit();
  const t = today(), n = dayOf(t);
  const fin = n !== null && n > TOTAL, cur = fin ? TOTAL : n;
  document.getElementById('topId').textContent = !state.runStart ? 'Evolve · ' + R().name
    : broken ? 'Run broken' : fin ? 'Complete' : `${R().name} · day ${cur} of ${TOTAL}`;
  document.getElementById('topFill').style.width = state.runStart ? `${Math.min(100, (cur/TOTAL)*100)}%` : '0%';

  const v = document.getElementById('view');
  v.innerHTML = '';

  if (!state.onboarded) {
    document.getElementById('tabs').style.display = 'none';
    document.querySelector('.topbar').style.display = 'none';
    v.append(...pgOnboard());
    if (lastTab !== 'onboard') { window.scrollTo({ top: 0 }); lastTab = 'onboard'; }
    else window.scrollTo({ top: keepY });
    return;
  }
  document.getElementById('tabs').style.display = '';
  document.querySelector('.topbar').style.display = '';

  if (tab === 'today') v.append(...pgToday(t, n, fin));
  if (tab === 'goals') v.append(...pgGoals());
  if (tab === 'plan') v.append(...pgPlan());
  if (tab === 'progress') v.append(...pgProgress(t, n, fin));
  if (tab === 'crew') v.append(...pgCrew());
  if (tab === 'inbox') v.append(...pgInbox());
  if (tab === 'member') v.append(...pgMember());
  if (tab === 'settings') v.append(...pgSettings());

  restoreFields();
  if (lastTab !== tab) { window.scrollTo({ top: 0 }); lastTab = tab; fieldCache = {}; }
  else window.scrollTo({ top: keepY });

  document.querySelectorAll('.tabs button').forEach(b => {
    b.setAttribute('aria-current', (b.dataset.tab === tab || (tab === 'member' && b.dataset.tab === 'crew')) ? 'true' : 'false');
    const o = b.querySelector('.badgeN'); if (o) o.remove();
    if (b.dataset.tab === 'inbox' && inboxUnread) b.appendChild(el(`<span class="badgeN">${inboxUnread}</span>`));
  });
}

/* ---------- shared pieces ---------- */
function ringEl(done, of, n) {
  const pct = of ? done / of : 0, C = 2 * Math.PI * 52;
  return el(`<div class="ring">
    <svg width="118" height="118" viewBox="0 0 118 118">
      <circle class="bgc" cx="59" cy="59" r="52" fill="none" stroke-width="9"/>
      <circle class="fgc" cx="59" cy="59" r="52" fill="none" stroke-width="9"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}"/>
    </svg>
    <div class="mid"><b>${n === null ? '—' : String(n).padStart(2,'0')}</b><span>${done} of ${of}</span></div></div>`);
}
/* Completion across the whole challenge, not just today. */
function challengeDone() {
  if (!state.runStart) return { days: 0, pct: 0, checks: 0, total: 0 };
  const upto = Math.min(dayOf(today()), TOTAL);
  let full = 0, checks = 0;
  for (let i = 0; i < upto; i++) {
    const d = addDays(state.runStart, i);
    if (complete(d)) full++;
    checks += countDone(d);
  }
  return { days: full, pct: Math.round(full / TOTAL * 100), checks, total: TOTAL * tasks().length, upto };
}

function motivate(n, done, of, streak) {
  if (!state.runStart) return { h: 'Nothing logged yet', p: 'Pick a mode in Settings, then start day 1.' };
  if (broken) return { h: 'The run ended', p: 'Acknowledge the break below and day 1 starts again today.' };
  if (n > TOTAL) return { h: `${TOTAL} for ${TOTAL}`, p: 'Every check, every day. Start another challenge whenever you want.' };
  if (done === of) return { h: `Day ${n} is closed`, p: streak > 1 ? `${streak} clean days in a row.` : 'First one down.' };
  const left = of - done;
  const pctThrough = Math.round((n / TOTAL) * 100);
  if (n <= 3) return { h: `Day ${n}, ${left} to go today`, p: 'The first week is the whole fight. Clear today and nothing else matters yet.' };
  if (left === 1) return { h: 'One check left', p: 'Finish it and the day is banked.' };
  return { h: `Day ${n}, ${left} left today`, p: `${pctThrough}% through the run. Streak at ${streak}.` };
}

/* ---------- Today ---------- */
/* ============================================================
   TODAY — everything for the day in one place.
   Rows expand in place. Nothing sends you to another tab.
   ============================================================ */
let panels = {}, editDate = null;
const togglePanel = k => { panels[k] = !panels[k]; render(); };

function chev(open) {
  return `<span class="mark" style="border:0;width:20px">
    <svg viewBox="0 0 24 24" style="opacity:1;transform:rotate(${open ? 180 : 0}deg);stroke:var(--muted);stroke-width:2.4;width:15px;height:15px;transition:transform 180ms ease">
    <path d="M5 9l7 7 7-7"/></svg></span>`;
}

function pgToday(t, n, fin) {
  const out = [];
  const ts = tasks(), done = state.runStart ? countDone(t) : 0;
  const m = motivate(n, done, ts.length, currentStreak());
  const dash = el(`<div class="dash"></div>`);
  dash.appendChild(ringEl(done, ts.length, state.runStart ? (fin ? TOTAL : n) : null));
  const cd = challengeDone();
  dash.appendChild(el(`<div class="say"><h1>${esc(m.h)}</h1><p>${esc(m.p)}</p>
    ${state.runStart ? `<p style="margin-top:6px"><b style="color:var(--brand)">${cd.pct}% of ${esc(R().name)} complete</b> · ${cd.days} of ${TOTAL} days banked</p>` : ''}</div>`));
  out.push(dash);

  if (!state.runStart) {
    const pick = el(`<div class="card"><div class="head"><h2>Choose a challenge</h2>
      <span class="meta">${esc(R().name)}</span></div>
      <div class="set"><div class="h">Pick the one you will finish. Each has its own length, its own checks, and its own rule about missed days.</div></div></div>`);
    Object.keys(CHALLENGES).forEach(k => {
      const c2 = CHALLENGES[k], on = challengeId() === k;
      const row = el(`<div class="set" style="${on ? 'background:var(--brand-soft)' : ''}">
        <div class="t">${esc(c2.name)}${on ? ' · selected' : ''}</div>
        <div class="h">${c2.days} days · ${esc(c2.tag)}<br>${esc(policyPreview(k))}</div>
        ${on ? '' : '<div class="btnrow"><button class="act sm ghost">Choose this</button></div>'}</div>`);
      const b = row.querySelector('button');
      if (b) b.onclick = () => { state.challenge = k; syncChallenge(); save(); render(); };
      pick.appendChild(row);
    });
    out.push(pick);

    const c = el(`<div class="card"><div class="head"><h2>${esc(R().name)}</h2><span class="meta">${ts.length} checks a day</span></div>
      <div class="notice"><h3>${ts.length} checks, ${TOTAL} days</h3>
      <p>${policyText()} A day stays editable for ${state.graceHours} hours past midnight.</p>
      <div class="btnrow"><button class="act" id="now">Start day 1 today</button>
      <button class="act ghost" id="earlier">I started earlier</button></div>
      <div id="bd" style="display:none">
        <div class="h" style="margin-top:12px">Pick the day you actually began. Everything from then until yesterday opens for logging, and the run counts from that date.</div>
        <div class="grid2"><label class="f"><span>Day 1 was</span>
          <input class="fld" id="sd" type="date" max="${today()}" min="${addDays(today(), -74)}" value="${addDays(today(), -7)}"></label></div>
        <div class="btnrow"><button class="act sm" id="godate">Start from that date</button></div>
      </div></div></div>`);
    c.querySelector('#now').onclick = () => startRun(today());
    c.querySelector('#earlier').onclick = () => { const b = c.querySelector('#bd'); b.style.display = b.style.display === 'none' ? '' : 'none'; };
    c.querySelector('#godate').onclick = () => {
      const v = c.querySelector('#sd').value;
      if (!v) return toast('Pick a date.', false);
      const n = between(v, today()) + 1;
      if (n < 1 || n > TOTAL) return toast('That date is outside a 75 day run.', false);
      startRun(v);
      toast(`Started on ${pretty(v)}. That makes today day ${n}.`, false);
    };
    out.push(c);
    out.push(helpCard());
    return out;
  }

  if (fin) {
    const c = el(`<div class="card"><div class="head"><h2>Run complete</h2><span class="meta">${pretty(t)}</span></div>
      <div class="notice"><h3>Finished</h3><p>Started ${pretty(state.runStart)}. ${statsAll().perfect} perfect days.</p>
      <button class="act">Run it again from today</button></div></div>`);
    c.querySelector('button').onclick = () => { endChallenge('completed'); render(); };
    out.push(c);
    out.push(badgeCard());
    return out;
  }

  if (myNudges.length) {
    const c = el(`<div class="card"><div class="head"><h2>From your crew</h2><button class="pill">Clear</button></div></div>`);
    myNudges.forEach(x => c.appendChild(el(`<div class="mrow"><span class="av">${esc(x.v.from.slice(0,1).toUpperCase())}</span>
      <span class="who"><span class="nm">${esc(x.v.from.split(' ')[0])} ${esc(x.v.text)}</span>
      <span class="amt">${ago(x.v.ts)}</span></span></div>`)));
    c.querySelector('.pill').onclick = markInboxRead;
    out.push(c);
  }

  if (editDate) {
    const back = el(`<div class="btnrow" style="margin:0 0 12px"><button class="act sm ghost">Back to today</button></div>`);
    back.querySelector('button').onclick = () => { editDate = null; render(); };
    out.push(back);
    out.push(el(`<div class="card warn"><div class="set"><div class="t">Filling in ${pretty(editDate)}</div>
      <div class="h">Day ${dayOf(editDate)} of the run. Log only what you actually did. The whole point of the restart rule is that the record is true, and nobody else can check it for you.</div></div></div>`));
    out.push(dayCard(editDate, dayOf(editDate), pretty(editDate), false, 'e'));
    return out;
  }

  const g = graceDate();
  if (g && !broken) out.push(dayCard(g, dayOf(g), `Yesterday, open until ${('0'+state.graceHours+':00').slice(-5)}`, true));

  const target = g && !broken ? g : t;
  out.push(dayCard(t, n, pretty(t), false));

  // Days still open behind you, so a late start can be caught up.
  const gaps = [];
  for (let i = 0; i < TOTAL; i++) {
    const d = addDays(state.runStart, i);
    if (between(d, cutoff()) <= 0) break;
    if (!complete(d)) gaps.push(d);
  }
  if (gaps.length) {
    const gc = el(`<div class="card warn"><div class="head"><h2>Earlier days to fill in</h2>
      <span class="meta">${gaps.length} open</span></div>
      <div class="set"><div class="h">These are inside your run and not complete. Fill them in if you did the work and simply were not using the app yet.</div></div></div>`);
    gaps.slice(0, 10).forEach(d => {
      const row = el(`<div class="hrow"><span class="n">${dayOf(d)}</span><span class="d">${shortD(d)}</span>
        <span class="dots">${tasks().map(x => `<i class="${isDone(d, x) ? 'on' : 'off'}"></i>`).join('')}</span>
        <button class="pill">Fill in</button></div>`);
      row.querySelector('button').onclick = () => { editDate = d; render(); };
      gc.appendChild(row);
    });
    out.push(gc);
  }

  if (!broken && R().restart !== 'restart') {
    const missed = missedDays();
    const cons = consistency();
    const passes = R().restart === 'passes' ? R().passes : null;
    const c = el(`<div class="card"><div class="head"><h2>How it is going</h2>
      <span class="meta">${cons}% of days complete</span></div>
      <div class="set"><div class="h">${esc(policyText())}
      ${missed.length ? ` You have missed ${missed.length} ${missed.length === 1 ? 'day' : 'days'} so far${passes !== null ? `, out of ${passes} forgiven` : ''}.` : ' Nothing missed yet.'}
      ${passes !== null && missed.length > passes ? ' Past the passes now, so the record carries it. That is information, not a verdict.' : ''}</div></div></div>`);
    out.push(c);
  }

  if (broken) {
    const lock = el(`<div class="lock"><div class="notice bad"><h3>Run broken on day ${broken.day}</h3>
      <p>${pretty(broken.date)} closed with ${broken.missed.length} unlogged: ${broken.missed.map(x => x.label.toLowerCase()).join(', ')}. Day 1 starts again today.</p>
      <button class="act">Start over at day 1</button></div></div>`);
    lock.querySelector('button').onclick = () => resetRun(broken.day);
    out[out.length-1].appendChild(lock);
  }

  const ta = todayActions();
  if (ta.length) {
    const ac = el(`<div class="card"><div class="head"><h2>From your goals</h2>
      <span class="meta">${ta.length} today</span></div></div>`);
    ta.forEach(x => ac.appendChild(actionRow(x.g, x.a)));
    out.push(ac);
  }

  out.push(fuelCard(target));
  out.push(bodyCard(target));
  out.push(coachCard());

  const startedEarlier = el(`<div class="card"><div class="set">
    <div class="t">Started before you found the app?</div>
    <div class="h">Move day 1 back to the date you actually began. Every day between then and yesterday opens for logging, and they appear above as days to fill in. Currently day 1 is ${pretty(state.runStart)}.</div>
    <div class="grid2"><label class="f"><span>Day 1 was</span>
      <input class="fld" id="sd" type="date" max="${today()}" min="${addDays(today(), -(TOTAL - 1))}" value="${state.runStart}"></label></div>
    <div class="btnrow"><button class="act sm ghost" id="mv">Move the start date</button></div></div></div>`);
  startedEarlier.querySelector('#mv').onclick = () => {
    const v = startedEarlier.querySelector('#sd').value;
    if (!v) return toast('Pick a date.', false);
    const dn = between(v, today()) + 1;
    if (dn < 1 || dn > TOTAL) return toast(`That would make today day ${dn}, which is outside a ${TOTAL} day run.`, false);
    if (v === state.runStart) return toast('That is already the start date.', false);
    state.runStart = v;
    save(); render();
    toast(`Day 1 moved to ${pretty(v)}. Today is day ${dn}.`, false);
  };
  out.push(startedEarlier);

  const endc = el(`<div class="card"><div class="set">
    <div class="t">End ${esc(R().name)}</div>
    <div class="h">Stops the run at day ${n} and files it under your past challenges with the days you completed. You can then start a different one. Switching is not a failure, and a challenge you will finish beats one you keep restarting.</div>
    <div class="btnrow"><button class="act sm ghost" id="end">End this challenge</button></div></div></div>`);
  endc.querySelector('#end').onclick = () => {
    if (!confirm(`End ${R().name} at day ${n}? It goes into your history and the current log is cleared.`)) return;
    endChallenge('quit');
    render();
    toast('Challenge ended. Pick another when you are ready.', false);
  };
  out.push(endc);
  return out;
}

function dayCard(date, n, metaText, isGrace, prefix) {
  const ts = tasks(), done = countDone(date), r = R();
  const card = el(`<div class="card ${isGrace ? 'warn' : ''}">
    <div class="head"><h2>${isGrace ? `Day ${n} carry-over` : `Day ${n}`}</h2><span class="meta">${esc(metaText)}</span></div></div>`);
  if (done === ts.length) {
    card.querySelector('.head').lastElementChild.outerHTML =
      `<span class="chip ${isGrace ? 'amber' : ''} ${wasComplete || isGrace ? '' : 'pop'}">Day cleared</span>`;
    if (!isGrace) wasComplete = true;
  } else if (!isGrace) wasComplete = false;

  const pfx = prefix || (isGrace ? 'y' : 'd');

  ts.forEach(task => {
    if (task.kind === 'water') { card.appendChild(waterRow(date)); return; }
    if (task.kind === 'learn') { card.appendChild(counterRow(date, 'learnMin', 'Read or learn',
      `${r.learnMinutes} minutes`, 5, r.learnMinutes, ' min')); return; }
    if (task.kind === 'steps') { card.appendChild(counterRow(date, 'steps', 'Steps',
      `${r.steps.toLocaleString()} steps`, 1000, r.steps, '')); return; }

    const on = isDone(date, task);
    const expandable = task.kind === 'sessions' || task.kind === 'outdoor' || task.kind === 'pages';
    const key = pfx + (task.kind === 'pages' ? 'read' : task.kind === 'bool' || task.kind === 'photo' ? task.id : 'work');
    const open = !!panels[key];

    const b = document.createElement('button');
    b.className = 'row' + (on ? ' on' : '');
    b.type = 'button';
    b.innerHTML = `<span class="txt"><span class="lab">${task.label}</span><span class="spec">${esc(subSpec(date, task))}</span></span>
      ${expandable ? chev(open) : ''}
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5"/></svg></span>`;
    b.onclick = () => {
      if (task.kind === 'bool') { put(date, { [task.id]: !D(date)[task.id] }); save(); render(); }
      else if (task.kind === 'photo' || task.kind === 'photoweek') pickPhoto(date);
      else if (task.kind === 'checkin') togglePanel('body');
      else togglePanel(key);
    };
    card.appendChild(b);

    if (expandable && open) {
      card.appendChild(task.kind === 'pages' ? readingPanel(date) : workoutPanel(date));
    }
  });
  return card;
}

      <span class="who"><span class="nm">${esc(s.name || (s.outdoor ? 'Outdoor session' : 'Gym session'))}

    row.querySelector('button').onclick = () => {
      const arr = sessions(date).slice(); arr.splice(i, 1);

  const f = el(`<div class="set">

/* ---------- fuel, collapsible ---------- */
function fuelCard(date) {
  const d = D(date), open = !!panels.fuel;
  const c = el(`<div class="card"><button class="row" style="border-top:0" id="hd">
    <span class="txt"><span class="lab">Fuel</span>
    <span class="spec">${d.protein||0} g protein · ${d.calories||0} kcal · targets ${state.proteinTarget} g and ${state.calorieTarget} kcal</span></span>
    ${chev(open)}</button></div>`);
  c.querySelector('#hd').onclick = () => togglePanel('fuel');
  if (!open) return c;

  const body = el(`<div class="set">

    <div class="prog">${Array.from({length:10},(_,i)=>`<span class="${i < Math.round(Math.min(1,(d.protein||0)/state.proteinTarget)*10)?'on':''}"></span>`).join('')}</div>
    <div class="grid2">
      <label class="f"><span>Protein g</span><input class="fld" id="pr" type="number" inputmode="numeric" value="${d.protein||''}" placeholder="0"></label>

function subSpec(date, task) {
  const r = R();
  if (task.kind === 'sessions') {
    const qual = sessions(date).filter(s => s.minutes >= r.minutes).length;
    return `${qual} of ${r.sessions} sessions of ${r.minutes} min or more. Tap to open.`;
  }
  if (task.kind === 'outdoor') {
    const has = sessions(date).some(s => s.outdoor && s.minutes >= r.minutes);
    return has ? 'Outdoor session logged.' : 'No outdoor session yet. Tap to open.';
  }
  if (task.kind === 'pages') return `${pagesRead(date)} of ${r.pages} pages. Tap to open.`;
  if (task.kind === 'photo') return hasPhoto(date) ? 'Photo saved.' : 'Tap to add a photo.';
  return task.spec;
}

/* A generic counter row, used for anything measured rather than ticked. */
function counterRow(date, field, label, spec, step, target, suffix) {
  const v = D(date)[field] || 0;
  const slots = Math.min(12, Math.ceil(target / step));
  const filled = Math.min(slots, Math.round(v / step));
  const row = el(`<div class="row" style="cursor:default">
    <div class="txt"><span class="lab">${esc(label)}</span>
      <div class="prog">${Array.from({length: slots}, (_,i) => `<span class="${i<filled?'on':''}"></span>`).join('')}</div>
      <span class="amt">${v.toLocaleString()}${suffix} of ${target.toLocaleString()}${suffix}</span></div>
    <div class="stepper"><button type="button" id="m">&minus;</button><button type="button" class="plus" id="p">+</button></div></div>`);
  const mb2 = row.querySelector('#m'), pb = row.querySelector('#p');
  mb2.disabled = v <= 0;
  mb2.onclick = () => { put(date, { [field]: Math.max(0, v - step) }); save(); render(); };
  pb.onclick = () => { put(date, { [field]: v + step }); save(); render(); };
  return row;
}

function waterRow(date) {
  const target = waterTarget(), ml = waterMl(date);
  const step = 250, slots = Math.ceil(target / step), filled = Math.round(ml / step);
  const row = el(`<div class="row" style="cursor:default">
    <div class="txt"><span class="lab">Water</span>
      <div class="prog">${Array.from({length: slots}, (_,i) => `<span class="${i<filled?'on':''}"></span>`).join('')}</div>
      <span class="amt">${(ml/1000).toFixed(2)} of ${(target/1000).toFixed(2)} L${state.waterMode==='weight'&&P().weightKg?` · 40 ml per kg at ${state.weightKg} kg`:''}</span></div>
    <div class="stepper"><button type="button" id="m">&minus;</button><button type="button" class="plus" id="p">+</button></div></div>`);
  const mb = row.querySelector('#m'), pb = row.querySelector('#p');
  mb.disabled = ml <= 0; pb.disabled = ml >= target;
  mb.onclick = () => { put(date, { waterMl: Math.max(0, ml - step) }); save(); render(); };
  pb.onclick = () => { put(date, { waterMl: Math.min(target, ml + step) }); save(); render(); };
  return row;
}

function coachCard() {
  const c = el(`<div class="card"><div class="head"><h2>Coach</h2>
    <span class="meta">${state.coach && state.coach.date === today() ? 'Today' : 'Not checked in'}</span></div>

  const body = c.querySelector('.coach');

/* ============================================================
   GOALS — a target, a deadline, and the rate needed to get there
   ============================================================ */
let goalForm = null;

const goals = () => state.goals || (state.goals = []);
const goalById = id => goals().find(g => g.id === id);
const entriesOf = g => (g.entries || []).slice().sort((a, b) => a.date.localeCompare(b.date));
const latestEntry = g => { const e = entriesOf(g); return e.length ? e[e.length - 1] : null; };

function daysLeft(g) { return g.deadline ? between(today(), g.deadline) : null; }

/* Progress as a 0..1 fraction, plus the sentence that says what to do next. */
function goalProgress(g) {
  if (g.type === 'number') return numberProgress(g);
  if (g.type === 'project') return projectProgress(g);
  if (g.type === 'habit') return habitProgress(g);
  if (g.type === 'range') return rangeProgress(g);
  const dl = daysLeft(g);
  const wksLeft = dl != null ? Math.max(dl / 7, 0.15) : null;

  if (g.type === 'weight') {
    const last = latestEntry(g);
    const start = g.start != null ? g.start : (last ? last.value : null);
    const now = last ? last.value : start;
    if (now == null || g.target == null) return { pct: 0, line: 'Log your first weigh-in to start tracking.', sub: '' };
    const total = start - g.target, moved = start - now;
    const pct = total === 0 ? 1 : Math.max(0, Math.min(1, moved / total));
    const remain = Math.round((now - g.target) * 10) / 10;
    const dir = total > 0 ? 'to lose' : 'to gain';
    const perWeek = wksLeft ? Math.abs(remain) / wksLeft : null;
    const line = Math.abs(remain) < 0.15
      ? `Target reached at ${now} kg.`
      : `${Math.abs(remain)} kg ${dir}, from ${now} kg to ${g.target} kg.`;
    const sub = perWeek && Math.abs(remain) >= 0.15
      ? `That is ${perWeek.toFixed(2)} kg a week for the ${dl} days left. Above 1 kg a week is aggressive and usually costs muscle.`
      : '';
    return { pct, line, sub, now };
  }

  if (g.type === 'book') {
    const b = g.bookIndex != null && state.books[g.bookIndex] ? state.books[g.bookIndex] : null;
    const total = b ? b.pages : (g.target || 0);
    const read = b ? b.read : (latestEntry(g) ? latestEntry(g).value : 0);
    const pct = total ? Math.max(0, Math.min(1, read / total)) : 0;
    const left = Math.max(0, total - read);
    const perDay = dl != null && dl > 0 ? Math.ceil(left / dl) : null;
    const line = left === 0 ? `Finished all ${total} pages.` : `${read} of ${total} pages, ${left} to go.`;
    const sub = perDay ? `${perDay} pages a day to finish by ${shortD(g.deadline)}. Your daily rule already covers ${R().pages}.` : '';
    return { pct, line, sub };
  }

  return fitnessProgress(g);
}

/* Fitness is a capability, not a quantity you accumulate. Going from
   5 km to 10 km is not 0.3 km a day. Distance builds by roughly 10% a
   week, and a race time improves by a small percentage per week, so
   both are expressed that way instead of divided by the days left. */
function fitnessProgress(g) {
  const last = latestEntry(g);
  const start = g.start != null ? g.start : (last ? last.value : null);
  const now = last ? last.value : start;
  const unit = g.unit || '';
  if (now == null || g.target == null) return { pct: 0, line: 'Log your first attempt to start tracking.', sub: '' };

  const lower = !!g.lowerIsBetter;
  const total = lower ? start - g.target : g.target - start;
  const moved = lower ? start - now : now - start;
  const pct = total === 0 ? 1 : Math.max(0, Math.min(1, moved / total));
  const done = lower ? now <= g.target : now >= g.target;
  const dl = daysLeft(g);
  const weeksLeft = dl != null && dl > 0 ? dl / 7 : null;
  const r2 = x => Math.round(x * 100) / 100;
  const r1 = x => Math.round(x * 10) / 10;

  if (done) return { pct: 1, line: `Target reached at ${r2(now)} ${unit}.`, sub: 'Set a new one, or hold this and make it repeatable.' };

  if (!lower) {
    // building distance or duration: about 10% a week is the usual ceiling
    const ratio = g.target / now;
    const weeksNeeded = Math.ceil(Math.log(ratio) / Math.log(1.10));
    const next = r1(now * 1.10);
    const line = `${r2(now)} ${unit} now, target ${r2(g.target)} ${unit}.`;
    let sub = `Building at about 10% a week, ${r2(now)} to ${r2(g.target)} ${unit} takes roughly ${weeksNeeded} ${weeksNeeded === 1 ? 'week' : 'weeks'}. Next week aim for ${next} ${unit}, then build from there.`;
    if (weeksLeft != null) {
      sub += weeksLeft >= weeksNeeded
        ? ` You have ${Math.floor(weeksLeft)} weeks, which is enough.`
        : ` You have ${Math.floor(weeksLeft)} weeks, so this deadline needs faster than 10% a week. Moving it out is the safer fix.`;
    }
    return { pct, line, sub };
  }

  // getting faster: percentage off the current time, not a fixed amount per day
  const needed = now - g.target;
  const pctFaster = needed / now * 100;
  const line = `${r2(now)} ${unit} now, target ${r2(g.target)} ${unit}, ${r2(needed)} ${unit} to find.`;
  let sub = `That is ${r1(pctFaster)}% faster.`;
  if (weeksLeft != null) {
    const perWeek = pctFaster / weeksLeft;
    sub += ` Across ${Math.floor(weeksLeft)} weeks that is ${perWeek.toFixed(2)}% a week.`;
    sub += perWeek <= 1
      ? ' That is a realistic rate.'
      : perWeek <= 2
        ? ' That is ambitious but possible if you are new to training.'
        : ' Above about 2% a week is not realistic for most people, so the deadline is the thing to move.';
  }
  sub += ` Test every two to three weeks rather than weekly, because testing eats the training that produces the improvement.`;
  return { pct, line, sub };
}

function goalStatus(g) {
  const dl = daysLeft(g), p = goalProgress(g);
  if (p.pct >= 1) return { txt: 'Reached', cls: 'chip' };
  if (dl == null) return { txt: 'No deadline', cls: 'chip amber' };
  if (dl < 0) return { txt: 'Deadline passed', cls: 'chip red' };
  const elapsed = g.created ? between(g.created, today()) : 0;
  const span = g.created && g.deadline ? Math.max(1, between(g.created, g.deadline)) : null;
  if (span && elapsed >= 7) {
    const expected = elapsed / span;
    if (p.pct + 0.1 < expected) return { txt: `${dl} days left`, cls: 'chip red' };
  }
  return { txt: `${dl} days left`, cls: 'chip' };
}

    <br><br>Stop any exercise that causes sharp or spreading pain. This app cannot tell you what that is, and neither can anyone who has not looked at you.</div></div></div>`));
  return out;

function trWizard() {
  const d = trDraft;
  const c = el(`<div class="card"><div class="head"><h2>Build your training</h2>
    <span class="meta">Step ${trStep + 1} of 6</span></div><div id="body"></div></div>`);
  const body = c.querySelector('#body');

  /* 0. safety first, always */
  if (trStep === 0) {
    body.innerHTML = `<div class="set"><div class="t">Before anything else</div>

      <div class="set"><div class="t">Also tap anything true</div>

      <div class="seg" id="af" style="flex-direction:column;align-items:stretch">

      <div class="btnrow"><button class="act" id="n">Nothing else applies, continue</button></div></div>`;
    ['#rf', '#af'].forEach(sel => body.querySelectorAll(sel + ' button').forEach(b => b.onclick = () => {
      d.flags[b.dataset.k] = !d.flags[b.dataset.k];
      b.setAttribute('aria-pressed', !!d.flags[b.dataset.k]);
    }));
    body.querySelector('#n').onclick = () => {
      if (safetyStatus(d) === 'clearance') {
        state.training = Object.assign(d, { program: { blocked: true } });
        trStep = null; save(); render();
        return;
      }
      trStep = 1; render();
    };
  }

  /* 1. goal, taken from the profile */
  if (trStep === 1) {
    const pg = PROFILE_GOALS[P().goal];
    body.innerHTML = `<div class="set"><div class="t">Training for: ${esc(pg ? pg.n.toLowerCase() : 'general health')}</div>

      <div class="seg" id="g">${Object.keys(PROFILE_GOALS).map(k => `<button type="button" data-k="${k}" aria-pressed="${P().goal===k}">${PROFILE_GOALS[k].n}</button>`).join('')}</div>
      <div class="btnrow"><button class="act" id="n">Continue</button></div></div>`;
    body.querySelectorAll('#g button').forEach(b => b.onclick = () => {
      P().goal = b.dataset.k; d.goal = trGoal(); save();
      body.querySelectorAll('#g button').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === P().goal));
    });
    body.querySelector('#n').onclick = () => { trStep = 2; render(); };
  }

  /* 2. equipment */
  if (trStep === 2) {
    body.innerHTML = `<div class="set"><div class="t">What do you have to train with</div>
      <div class="h">Tap everything you can reach on a normal day. Every exercise is filtered against this, so an honest answer gives a usable plan and an optimistic one gives a plan you cannot do.</div>
      <div class="seg" id="eq">${Object.keys(EQUIP).map(k => `<button type="button" data-k="${k}" aria-pressed="${(d.equipment||[]).includes(k)}">${EQUIP[k]}</button>`).join('')}</div>
      <div class="btnrow"><button class="act" id="n">Continue</button><button class="act ghost" id="b">Back</button></div></div>`;
    body.querySelectorAll('#eq button').forEach(b => b.onclick = () => {
      d.equipment = d.equipment || [];
      d.equipment = d.equipment.includes(b.dataset.k) ? d.equipment.filter(x => x !== b.dataset.k) : d.equipment.concat([b.dataset.k]);
      b.setAttribute('aria-pressed', d.equipment.includes(b.dataset.k));
    });
    body.querySelector('#n').onclick = () => { if (!d.equipment.length) d.equipment = ['none']; trStep = 3; render(); };
    body.querySelector('#b').onclick = () => { trStep = 1; render(); };
  }

  /* 3. schedule */
  if (trStep === 3) {
    body.innerHTML = `<div class="set"><div class="t">What can you actually sustain</div>
      <div class="h">Not what you should do. What you will still be doing in week six, on a bad week.</div>
      <div class="seg" id="dy">${[1,2,3,4,5,6].map(k => `<button type="button" data-k="${k}" aria-pressed="${d.days===k}">${k} day${k>1?'s':''}</button>`).join('')}</div>
      <div class="t" style="margin-top:16px">How long a session</div>
      <div class="seg" id="mn">${[20,30,45,60,90].map(k => `<button type="button" data-k="${k}" aria-pressed="${d.minutes===k}">${k} min</button>`).join('')}</div>

    body.querySelector('#b').onclick = () => { trStep = 2; render(); };
