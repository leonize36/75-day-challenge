  /* 4. history, asked as facts */
  if (trStep === 4) {
    const h = d.history;
    body.innerHTML = `<div class="set"><div class="t">Your last twelve months</div>
      <div class="h">Nobody knows whether they count as a beginner. Everyone knows how often they actually went.</div>
      <div class="t" style="margin-top:14px">Months you trained consistently</div>
      <div class="seg" id="mc">${[[0,'None'],[2,'1 to 3'],[6,'4 to 8'],[10,'9 to 12']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${h.monthsConsistent===v}">${l}</button>`).join('')}</div>
      <div class="t" style="margin-top:14px">Sessions in an average week</div>
      <div class="seg" id="sw">${[[0,'0'],[1,'1'],[2,'2 to 3'],[4,'4 or more']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${h.sessionsPerWeek===v}">${l}</button>`).join('')}</div>
      <div class="t" style="margin-top:14px">How comfortable are you with the movements</div>
      <div class="seg" id="tq" style="flex-direction:column;align-items:stretch">
        ${[[0,'I would need to be shown everything'],[1,'I know a few exercises'],[2,'Comfortable with the main lifts'],[3,'I have followed structured programmes']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${h.technique===v}" style="text-align:left">${l}</button>`).join('')}</div>
      <div class="t" style="margin-top:14px">Longest break in the last year</div>
      <div class="seg" id="bw">${[[0,'Under 3 months'],[16,'3 to 6 months'],[30,'Over 6 months']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${h.breakWeeks===v}">${l}</button>`).join('')}</div>
      <div class="btnrow"><button class="act" id="n">Continue</button><button class="act ghost" id="b">Back</button></div></div>`;
    const bind = (sel, key) => body.querySelectorAll(sel + ' button').forEach(b => b.onclick = () => {
      h[key] = +b.dataset.v;
      body.querySelectorAll(sel + ' button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.v === h[key]));
    });
    bind('#mc', 'monthsConsistent'); bind('#sw', 'sessionsPerWeek');
    bind('#tq', 'technique'); bind('#bw', 'breakWeeks');
    body.querySelector('#n').onclick = () => { trStep = 5; render(); };
    body.querySelector('#b').onclick = () => { trStep = 3; render(); };
  }

  /* 5. what hurts */
  if (trStep === 5) {
    const any = (d.areas || []).length > 0;
    body.innerHTML = `<div class="set"><div class="t">Anything that currently hurts</div>
      <div class="h">Asked once, here. Tap every region that applies and every exercise that commonly loads it is removed. This is filtering, not diagnosis. The app cannot tell you what is wrong or what would fix it.</div>
      <div class="seg" id="ar">${AREAS.map(a => `<button type="button" data-k="${a}" aria-pressed="${(d.areas||[]).includes(a)}">${a.charAt(0).toUpperCase()+a.slice(1)}</button>`).join('')}</div></div>
      ${any ? `<div class="set"><div class="t">What is it like</div>
        <div class="h">This changes what happens next, so answer it for the worst of them.</div>
        <div class="seg" id="sv" style="flex-direction:column;align-items:stretch">
          <button type="button" data-v="none" aria-pressed="${!d.flags.painOngoing && !d.flags.painSevere}" style="text-align:left">Mild, comes and goes, does not stop me moving normally</button>
          <button type="button" data-v="ongoing" aria-pressed="${!!d.flags.painOngoing && !d.flags.painSevere}" style="text-align:left">Ongoing or long-standing, but daily life is fine</button>
          <button type="button" data-v="severe" aria-pressed="${!!d.flags.painSevere}" style="text-align:left">Sharp, spreading down a limb, or stopping normal daily movement</button>
        </div></div>` : ''}
      <div class="set"><div class="btnrow"><button class="act" id="n">Build the plan</button><button class="act ghost" id="b">Back</button></div></div>`;
    body.querySelectorAll('#ar button').forEach(b => b.onclick = () => {
      d.areas = d.areas || [];
      d.areas = d.areas.includes(b.dataset.k) ? d.areas.filter(x => x !== b.dataset.k) : d.areas.concat([b.dataset.k]);
      if (!d.areas.length) { d.flags.painOngoing = false; d.flags.painSevere = false; }
      render();
    });
    body.querySelectorAll('#sv button').forEach(b => b.onclick = () => {
      d.flags.painOngoing = b.dataset.v === 'ongoing';
      d.flags.painSevere = b.dataset.v === 'severe';
      body.querySelectorAll('#sv button').forEach(x => x.setAttribute('aria-pressed',
        (x.dataset.v === 'severe') === !!d.flags.painSevere && (x.dataset.v === 'ongoing') === !!d.flags.painOngoing));
      render();
    });
    body.querySelector('#n').onclick = () => {
      if (safetyStatus(d) === 'clearance') {
        state.training = Object.assign(d, { program: { blocked: true } });
        trStep = null; trDraft = null; save(); render();
        return;
      }
      const p = P();
      p.equipment = d.equipment; p.areas = d.areas;
      d.goal = trGoal();
      d.program = generateProgram(d);
      state.training = d;
      trStep = null; trDraft = null; trDay = 0;
      save(); render(); toast('Training plan built.', false);
    };
    body.querySelector('#b').onclick = () => { trStep = 4; render(); };
  }

  const foot = el(`<div class="set"><div class="h">General training guidance for healthy adults, not medical advice or rehabilitation. Stop anything that causes sharp or spreading pain and get it looked at.</div>
    <div class="btnrow"><button class="act sm ghost" id="cx">Cancel</button></div></div>`);
  foot.querySelector('#cx').onclick = () => { trStep = null; trDraft = null; render(); };
  c.appendChild(foot);
  return c;
}

/* ---------- meal builder pages ---------- */
let mb = null, mbSearch = '', mbSwap = null, mbFoodForm = false, haveMode = false, haveSel = [];

function newMeal(type) {
  return { name: '', type: type || 'lunch', lines: [], yield: 'servings', servings: 1, cookedG: 0 };
}
const savedMeals = () => (state.nutrition && state.nutrition.savedMeals) || [];

function pgBuilder() {
  const out = [];
  if (!state.nutrition) state.nutrition = { goal: 'health', prefs: {}, dislikes: [], savedMeals: [], myFoods: [] };
  const n = state.nutrition;

  /* targets, without forcing the whole questionnaire */
  const d = dailyTargets();
  const hasProfile = profileComplete();
  const th = el(`<div class="card"><div class="head"><h2>Meal builder</h2>
    <span class="meta">${d.kcal} kcal · ${d.protein} g</span></div>
    <div class="set" style="border-top:0"><div class="h">Build a meal from ingredients and see how it lands against your targets. ${hasProfile ? 'Targets come from your profile.' : 'No profile needed. These targets are whatever you set, and you can work them out properly any time.'}</div>
    ${hasProfile ? '' : `<div class="grid2">
      <label class="f"><span>Daily calories</span><input class="fld" id="tk" type="number" inputmode="numeric" value="${state.calorieTarget}"></label>
      <label class="f"><span>Daily protein g</span><input class="fld" id="tp" type="number" inputmode="numeric" value="${state.proteinTarget}"></label>
    </div>
    <div class="btnrow"><button class="act sm" id="sv">Save targets</button>
    <button class="act sm ghost" id="wz">Work them out for me</button></div>`}</div></div>`);
  if (!hasProfile) {
    th.querySelector('#sv').onclick = () => {
      state.calorieTarget = +th.querySelector('#tk').value || 2000;
      state.proteinTarget = +th.querySelector('#tp').value || 130;
      save(); render(); toast('Targets saved.', false);
    };
    th.querySelector('#wz').onclick = () => { planTab = 'eat'; startNutri(); };
  }
  out.push(th);

  if (haveMode) { out.push(haveCard()); return out; }

  if (!mb) {
    const c = el(`<div class="card"><div class="head"><h2>Start a meal</h2></div>
      <div class="set"><div class="h">Pick what kind of meal it is. That sets the share of the day it should carry, which is how the app judges whether it fits.</div>
      <div class="seg" id="mt">${Object.keys(MEAL_TYPES).map(k => `<button type="button" data-k="${k}">${MEAL_TYPES[k].n}</button>`).join('')}</div>
      <div class="btnrow"><button class="act sm ghost" id="hv">Use what I have at home</button></div></div></div>`);
    c.querySelectorAll('#mt button').forEach(b => b.onclick = () => { mb = newMeal(b.dataset.k); render(); });
    c.querySelector('#hv').onclick = () => { haveMode = true; haveSel = []; render(); };
    out.push(c);
    out.push(savedCard());
    return out;
  }

  /* ---- the meal under construction ---- */
  const t = mealTarget(mb.type), nut = mealNutrition(mb.lines);
  const per = mb.yield === 'servings' ? Math.max(1, mb.servings || 1) : 1;
  const bal = mealBalance(mb.lines, mb.type);
  const kFit = fitLabel(nut.kcal / per, t.kcal), pFit = fitLabel(nut.p / per, t.protein);

  const head = el(`<div class="card"><div class="head"><h2>${esc(MEAL_TYPES[mb.type].n)}${mb.name ? ' · ' + esc(mb.name) : ''}</h2>
    <span class="${bal.score >= 60 ? 'chip' : 'chip amber'}">${bal.band}</span></div>
    <div class="stats">
      <div class="stat"><div class="v">${Math.round(nut.kcal / per)}</div><div class="k">kcal · target ${t.kcal}</div></div>
      <div class="stat"><div class="v">${Math.round(nut.p / per)}</div><div class="k">g protein · target ${t.protein}</div></div>
      <div class="stat"><div class="v">${nut.fibKnown ? Math.round(nut.fib / per) : '—'}</div><div class="k">g fibre</div></div>
      <div class="stat"><div class="v">${Math.round(nut.carb / per)}/${Math.round(nut.fat / per)}</div><div class="k">carb / fat g</div></div>
    </div>
    <div class="set"><div class="btnrow" style="margin:0">
      <span class="${kFit.cls}">Calories: ${kFit.txt}</span>
      <span class="${pFit.cls}">Protein: ${pFit.txt}</span>
      ${nut.fibKnown ? '' : '<span class="chip amber">Fibre data incomplete</span>'}
    </div>${bal.why.length ? `<div class="h" style="margin-top:10px">Marked down for: ${esc(bal.why.join(', '))}.</div>` : ''}</div></div>`);
  out.push(head);

  /* ingredients */
  const ing = el(`<div class="card"><div class="head"><h2>Ingredients</h2>
    <span class="meta">${mb.lines.length}</span></div></div>`);
  if (!mb.lines.length) ing.appendChild(el(`<div class="set"><div class="h">Nothing added yet. Search below.</div></div>`));

  mb.lines.forEach((l, i) => {
    const f = anyFood(l.fid);
    if (!f) return;
    const ln = lineNutrition(l), st = prepState(f);
    const row = el(`<div class="set">
      <div class="t">${esc(f.n)}${f.custom ? ' · yours' : ''}</div>
      <div class="h">${Math.round(lineGrams(l))} g${STATE_LABEL[st] ? ' ' + STATE_LABEL[st] : ''} · ${Math.round(ln.kcal)} kcal · ${Math.round(ln.p)} g protein</div>
      <div class="grid2">
        <label class="f"><span>Amount</span><input class="fld" id="q" type="number" inputmode="decimal" step="0.25" value="${l.qty}"></label>
        <label class="f"><span>Unit</span><select class="fld" id="u">${Object.keys(UNITS).map(k => `<option value="${k}"${l.unit===k?' selected':''}>${UNITS[k].n}</option>`).join('')}</select></label>
      </div>
      <div class="btnrow">
        <button class="act sm ghost" data-a="up">Update</button>
        <button class="act sm ghost" data-a="sw">Swap</button>
        <button class="act sm ghost" data-a="rm">Remove</button></div></div>`);
    row.querySelector('[data-a="up"]').onclick = () => {
      l.qty = parseFloat(row.querySelector('#q').value) || 0;
      l.unit = row.querySelector('#u').value;
      render();
    };
    row.querySelector('[data-a="rm"]').onclick = () => { mb.lines.splice(i, 1); render(); };
    row.querySelector('[data-a="sw"]').onclick = () => { mbSwap = mbSwap === i ? null : i; render(); };
    ing.appendChild(row);

    if (mbSwap === i) {
      const box = el(`<div class="set" style="background:#FAFBFC">
        <div class="t">Swap ${esc(f.n.toLowerCase())} for</div>
        <div class="seg" id="in">
          <button type="button" data-i="similar" aria-pressed="true">Similar calories</button>
          <button type="button" data-i="protein">More protein</button>
          <button type="button" data-i="fewer">Fewer calories</button>
          <button type="button" data-i="fibre">More fibre</button></div>
        <div id="res" style="margin-top:10px"></div></div>`);
      const show = intent => {
        const res = box.querySelector('#res');
        res.innerHTML = '';
        swapByIntent(l, intent).forEach(s => {
          const b = el(`<div class="hrow" style="padding-left:0;padding-right:0">
            <span class="n" style="width:auto;flex:1;font-size:14px">${esc(s.f.n)}</span>
            <span class="d" style="width:auto">${s.kcal} kcal · ${s.p} g</span>
            <button class="pill">Use</button></div>`);
          b.querySelector('button').onclick = () => {
            l.fid = s.f.id; l.unit = 'g'; l.qty = Math.round(lineGrams(l)) || servingGrams(s.f);
            mbSwap = null; render();
          };
          res.appendChild(b);
        });
      };
      box.querySelectorAll('#in button').forEach(b => b.onclick = () => {
        box.querySelectorAll('#in button').forEach(x => x.setAttribute('aria-pressed', x === b));
        show(b.dataset.i);
      });
      show('similar');
      ing.appendChild(box);
    }
  });

  /* search and add */
  const q = mbSearch.trim().toLowerCase();
  const pool = FOODS.concat(myFoods()).filter(f => !q || f.n.toLowerCase().includes(q)).slice(0, 12);
  const sc = el(`<div class="set"><div class="t">Add an ingredient</div>
    <input class="fld" id="s" placeholder="Search chicken, oats, avocado" value="${esc(mbSearch)}">
    <div id="list" style="margin-top:10px"></div>
    <div class="btnrow"><button class="act sm ghost" id="nf">${mbFoodForm ? 'Close' : 'Add a food that is not listed'}</button></div></div>`);
  const si = sc.querySelector('#s');
  si.oninput = () => { mbSearch = si.value; const l = sc.querySelector('#list'); l.innerHTML = ''; fill(l); };
  function fill(container) {
    const qq = mbSearch.trim().toLowerCase();
    const items = FOODS.concat(myFoods()).filter(f => !qq || f.n.toLowerCase().includes(qq)).slice(0, 12);
    if (!items.length) { container.appendChild(el(`<div class="h">Nothing matches. Add it as your own food below.</div>`)); return; }
    items.forEach(f => {
      const p = per100(f), st = prepState(f);
      const r = el(`<div class="hrow" style="padding-left:0;padding-right:0">
        <span class="n" style="width:auto;flex:1;font-size:14px">${esc(f.n)}${f.custom ? ' <em style="font-style:normal;font-size:10px;color:var(--muted)">yours</em>' : ''}</span>
        <span class="d" style="width:auto">${Math.round(p.kcal)} kcal · ${Math.round(p.p)} g / 100 g${STATE_LABEL[st] ? ' ' + STATE_LABEL[st] : ''}</span>
        <button class="pill">Add</button></div>`);
      r.querySelector('button').onclick = () => {
        mb.lines.push({ fid: f.id, qty: 1, unit: 'serving' });
        mbSearch = ''; render();
      };
      container.appendChild(r);
    });
  }
  fill(sc.querySelector('#list'));
  sc.querySelector('#nf').onclick = () => { mbFoodForm = !mbFoodForm; render(); };
  ing.appendChild(sc);

  if (mbFoodForm) ing.appendChild(customFoodForm());
  out.push(ing);

  /* suggestions */
  const sug = mealSuggestions(mb.lines, mb.type);
  if (sug.length) {
    const c = el(`<div class="card"><div class="head"><h2>To improve it</h2></div></div>`);
    sug.forEach(s => c.appendChild(el(`<div class="set"><div class="h">${esc(s)}</div></div>`)));
    out.push(c);
  }

  /* yield and saving */
  const sv = el(`<div class="card"><div class="head"><h2>Save or log</h2></div>
    <div class="set"><div class="t">Name</div>
      <input class="fld" id="nm" placeholder="Chicken and rice bowl" value="${esc(mb.name)}"></div>
    <div class="set"><div class="t">Is this one portion or a batch</div>
      <div class="h">A batch divides the totals. By servings is easier. By final cooked weight is more accurate, because you weigh what you actually eat.</div>
      <div class="seg" id="yl">
        <button type="button" data-y="servings" aria-pressed="${mb.yield==='servings'}">Servings</button>
        <button type="button" data-y="weight" aria-pressed="${mb.yield==='weight'}">Final cooked weight</button></div>
      ${mb.yield === 'servings'
        ? `<div class="grid2"><label class="f"><span>Makes how many</span><input class="fld" id="sr" type="number" inputmode="numeric" value="${mb.servings}"></label></div>`
        : `<div class="grid2">
            <label class="f"><span>Cooked weight g</span><input class="fld" id="cw" type="number" inputmode="numeric" value="${mb.cookedG || ''}"></label>
            <label class="f"><span>You eat g</span><input class="fld" id="ew" type="number" inputmode="numeric" value="${mb.eatG || ''}"></label></div>
           ${mb.cookedG && mb.eatG ? `<div class="h">Your portion is ${Math.round(mb.eatG / mb.cookedG * 100)}% of the batch, about ${Math.round(nut.kcal * mb.eatG / mb.cookedG)} kcal and ${Math.round(nut.p * mb.eatG / mb.cookedG)} g protein.</div>` : ''}`}
      <div class="btnrow"><button class="act sm ghost" id="ap">Apply</button></div></div>
    <div class="set"><div class="btnrow">
      <button class="act" id="log">Log this to today</button>
      <button class="act ghost" id="save">Save for reuse</button>
      <button class="act ghost" id="disc">Discard</button></div></div></div>`);
  sv.querySelectorAll('#yl button').forEach(b => b.onclick = () => { mb.yield = b.dataset.y; render(); });
  sv.querySelector('#ap').onclick = () => {
    mb.name = sv.querySelector('#nm').value.trim();
    if (mb.yield === 'servings') mb.servings = Math.max(1, +sv.querySelector('#sr').value || 1);
    else { mb.cookedG = +sv.querySelector('#cw').value || 0; mb.eatG = +sv.querySelector('#ew').value || 0; }
    render();
  };
  sv.querySelector('#log').onclick = () => {
    mb.name = sv.querySelector('#nm').value.trim() || MEAL_TYPES[mb.type].n;
    const frac = mb.yield === 'weight' && mb.cookedG && mb.eatG ? mb.eatG / mb.cookedG : 1 / Math.max(1, mb.servings || 1);
    const d = today();
    put(d, { protein: Math.round((D(d).protein || 0) + nut.p * frac),
      calories: Math.round((D(d).calories || 0) + nut.kcal * frac) });
    save(); toast(`${Math.round(nut.kcal * frac)} kcal and ${Math.round(nut.p * frac)} g logged to today.`, false);
    mb = null; render();
  };
  sv.querySelector('#save').onclick = () => {
    mb.name = sv.querySelector('#nm').value.trim();
    if (!mb.name) return toast('Give it a name first.', false);
    state.nutrition.savedMeals = savedMeals().concat([Object.assign({ id: 'm' + Date.now() }, mb)]);
    save(); toast('Saved.', false); mb = null; render();
  };
  sv.querySelector('#disc').onclick = () => { mb = null; mbSwap = null; render(); };
  out.push(sv);
  return out;
}

    <div class="t">Your own food</div>
    <div class="h">From the packet. Enter the figures for one stated serving and the weight of that serving, and everything scales from there.</div>
    <div class="grid2">
      <label class="f"><span>Name</span><input class="fld" id="n" placeholder="Brand yoghurt"></label>
      <label class="f"><span>Serving weight g</span><input class="fld" id="g" type="number" inputmode="numeric" placeholder="100"></label>
    </div>
    <div class="grid4">

      <label class="f"><span>Protein g</span><input class="fld" id="p" type="number" inputmode="decimal"></label>
      <label class="f"><span>Carbs g</span><input class="fld" id="c" type="number" inputmode="decimal"></label>

    </div>
    <div class="grid2">

      <label class="f"><span>State</span><select class="fld" id="st"><option value="n">Not applicable</option><option value="c">Cooked weight</option><option value="r">Raw weight</option></select></label>
    </div>
    <div class="btnrow"><button class="act sm" id="add">Save food</button></div>
    <div class="h" id="warn" style="color:var(--amber);margin-top:8px"></div></div>`);
  f.querySelector('#add').onclick = () => {
    const food = { id: 'u' + Date.now(), custom: true, c: 'protein',
      n: f.querySelector('#n').value.trim(), g: +f.querySelector('#g').value || 100,
      kcal: +f.querySelector('#k').value || 0, p: +f.querySelector('#p').value || 0,
      carb: +f.querySelector('#c').value || 0, fat: +f.querySelector('#ft').value || 0,
      fib: f.querySelector('#fb').value === '' ? null : +f.querySelector('#fb').value,
      state: f.querySelector('#st').value, t: ['v','vg','gf','df','h','k'] };
    if (!food.n) return toast('Give the food a name.', false);
    if (!food.kcal) return toast('Calories are needed.', false);
    const bad = macroCheck(food);
    if (bad) { f.querySelector('#warn').textContent = `The macros work out to a different calorie figure, off by about ${bad}%. Check the numbers, then save again to keep them as entered.`; food.checked = true; }
    state.nutrition.myFoods = myFoods().concat([food]);
    save(); mbFoodForm = false; render(); toast('Food added.', false);
  };
  return f;
}

function savedCard() {
  const list = savedMeals();
  const c = el(`<div class="card"><div class="head"><h2>Saved meals</h2>
    <span class="meta">${list.length}</span></div></div>`);
  if (!list.length) c.appendChild(el(`<div class="set"><div class="h">Nothing saved yet. Anything you build can be kept and reused.</div></div>`));
  list.forEach((m, i) => {
    const nut = mealNutrition(m.lines);
    const per = m.yield === 'servings' ? Math.max(1, m.servings || 1) : 1;
    const row = el(`<div class="set"><div class="t">${esc(m.name)}</div>
      <div class="h">${esc(MEAL_TYPES[m.type].n)} · ${Math.round(nut.kcal / per)} kcal · ${Math.round(nut.p / per)} g protein${per > 1 ? ` per serving, makes ${per}` : ''}</div>
      <div class="btnrow"><button class="act sm" data-a="log">Log to today</button>
      <button class="act sm ghost" data-a="ed">Open</button>
      <button class="act sm ghost" data-a="rm">Delete</button></div></div>`);
    row.querySelector('[data-a="log"]').onclick = () => {
      const d = today();
      put(d, { protein: Math.round((D(d).protein || 0) + nut.p / per),
        calories: Math.round((D(d).calories || 0) + nut.kcal / per) });
      save(); render(); toast('Logged to today.', false);
    };
    row.querySelector('[data-a="ed"]').onclick = () => { mb = JSON.parse(JSON.stringify(m)); render(); };
    row.querySelector('[data-a="rm"]').onclick = () => {
      state.nutrition.savedMeals = savedMeals().filter((_, k) => k !== i); save(); render();
    };
    c.appendChild(row);
  });
  return c;
}

/* ---------- use what I have ---------- */
function haveCard() {
  const prefs = (nutri() && nutri().prefs) || {}, dis = (nutri() && nutri().dislikes) || [];
  const pool = FOODS.filter(f => allowed(f, prefs, dis));
  const c = el(`<div class="card"><div class="head"><h2>Use what I have</h2>
    <span class="meta">${haveSel.length} selected</span></div>
    <div class="set"><div class="h">Tap what is actually in the kitchen. A meal is built only from those, sized to hit the lunch or dinner share of your day.</div></div></div>`);
  [['protein','Protein'],['carb','Carbohydrate'],['veg','Vegetables and fruit'],['fat','Fats']].forEach(([cat, label]) => {
    const items = pool.filter(f => f.c === cat);
    if (!items.length) return;
    const sec = el(`<div class="set"><div class="t">${label}</div>
      <div class="seg">${items.map(f => `<button type="button" data-k="${f.id}" aria-pressed="${haveSel.includes(f.id)}">${esc(f.n)}</button>`).join('')}</div></div>`);
    sec.querySelectorAll('button').forEach(b => b.onclick = () => {
      haveSel = haveSel.includes(b.dataset.k) ? haveSel.filter(x => x !== b.dataset.k) : haveSel.concat([b.dataset.k]);
      b.setAttribute('aria-pressed', haveSel.includes(b.dataset.k));
      c.querySelector('.meta').textContent = `${haveSel.length} selected`;
    });
    c.appendChild(sec);
  });
  const f = el(`<div class="set"><div class="btnrow">
    <button class="act" id="go">Build a dinner from these</button>
    <button class="act ghost" id="bk">Back</button></div>
    <div class="h" style="margin-top:9px">Needs at least a protein. Without one the meal cannot reach its protein share, and the app will not pretend otherwise.</div></div>`);
  f.querySelector('#bk').onclick = () => { haveMode = false; render(); };
  f.querySelector('#go').onclick = () => {
    const chosen = haveSel.map(id => foodById(id)).filter(Boolean);
    const prot = chosen.filter(x => x.c === 'protein');
    if (!prot.length) return toast('Pick at least one protein.', false);
    const t = mealTarget('dinner');
    const lines = [];
    const P = prot[0], pp = per100(P);
    lines.push({ fid: P.id, unit: 'g', qty: Math.max(50, Math.round(t.protein / pp.p * 100 / 10) * 10) });
    const V = chosen.find(x => x.c === 'veg');
    if (V) lines.push({ fid: V.id, unit: 'g', qty: servingGrams(V) });
    let used = mealNutrition(lines).kcal;
    const F = chosen.find(x => x.c === 'fat');
    if (F && t.kcal - used > 150) lines.push({ fid: F.id, unit: 'g', qty: Math.round(servingGrams(F) * 0.5) });
    used = mealNutrition(lines).kcal;
    const C = chosen.find(x => x.c === 'carb');
    if (C && t.kcal - used > 60) {
      const cp = per100(C);
      lines.push({ fid: C.id, unit: 'g', qty: Math.max(30, Math.round((t.kcal - used) / cp.kcal * 100 / 10) * 10) });
    }
    mb = Object.assign(newMeal('dinner'), { lines, name: 'From what I have' });
    haveMode = false; render();
  };
  c.appendChild(f);
  return c;
}

/* ---------- nutrition pages ---------- */
let nutriStep = null, nutriDraft = null, swapOpen = null, planDay = 0;

const nutri = () => state.nutrition || null;

function startNutri() {
  const n = nutri() || {}, p = P();
  nutriDraft = { meals: n.meals || 3, prefs: Object.assign({}, n.prefs), dislikes: (n.dislikes || []).slice(),
    away: (n.away || []).slice(), pattern: n.pattern || null,
    goal: p.goal || 'health', sex: p.sex || 'f', age: p.age || null,
    heightCm: p.heightCm || null, weightKg: p.weightKg || null, activity: p.activity || 1.375 };
  nutriStep = profileComplete() ? 3 : 0;
  render();
}

function pgNutrition() {
  const out = [];
  if (nutriStep !== null) { out.push(nutriWizard()); return out; }

  const n = nutri(), t = n ? nutriTargets(n) : null;
  if (!n || !t) {
    const c = el(`<div class="card"><div class="head"><h2>Eating plan</h2><span class="meta">Not set up</span></div>
      <div class="set"><div class="t">75 Hard says follow a diet. It does not say which.</div>
        <div class="h">That gap is where most people stall. Rather than asking you to pick a named diet, this asks what you are training for, then works out the numbers and suggests a pattern that fits. Five questions, about two minutes.</div>
        <div class="btnrow"><button class="act" id="go">Build my plan</button></div></div></div>`);
    c.querySelector('#go').onclick = startNutri;
    out.push(c);
    out.push(kitCard());
    return out;
  }

  const g = NGOALS[n.goal], pat = PATTERNS[t.pattern];
  const head = el(`<div class="card"><div class="head"><h2>${esc(pat.name)}</h2>
    <span class="meta">${esc(g.name)}</span></div>
    <div class="stats">
      <div class="stat"><div class="v">${t.kcal}</div><div class="k">kcal a day</div></div>
      <div class="stat"><div class="v">${t.protein}</div><div class="k">g protein</div></div>
      <div class="stat"><div class="v">${t.carb}</div><div class="k">g carbs</div></div>
      <div class="stat"><div class="v">${t.fat}</div><div class="k">g fat</div></div>
    </div>
    <div class="set"><div class="t">Why this pattern</div><div class="h">${esc(pat.why)}</div></div>
    <div class="set"><div class="t">Where the numbers come from</div>
      <div class="h">Resting energy ${t.bmr} kcal by the Mifflin-St Jeor equation, ${t.tdee} kcal once activity is counted, then ${g.adj === 0 ? 'held at maintenance' : (g.adj < 0 ? Math.round(Math.abs(g.adj)*100) + '% below it' : Math.round(g.adj*100) + '% above it')} for your goal. Protein at ${g.protein} g per kilogram.
      ${t.capped ? `<br><br>The equation returned less than ${t.floor} kcal, so it was raised to that floor. Eating below it while training twice a day is how people lose muscle and quit in week three.` : ''}
      <br><br>These are estimates. Correct them against what the scale and your energy actually do over three weeks, not against the equation.</div></div>
    <div class="set"><div class="t">Other patterns that would work</div>
      <div class="h">${pat.alts.map(a => esc(PATTERNS[a].name)).join(', ')}. None of them beats the one you will actually follow.</div>
      <div class="btnrow"><button class="act sm ghost" id="ed">Change my answers</button>
      <button class="act sm ghost" id="ap">Use these as my daily targets</button>
      <button class="act sm ghost" id="own">Build my own meals</button></div></div></div>`);
  head.querySelector('#ed').onclick = startNutri;
  head.querySelector('#own').onclick = () => { planTab = 'build'; render(); };
  head.querySelector('#ap').onclick = () => {
    state.proteinTarget = t.protein; state.calorieTarget = t.kcal;
    save(); render(); toast('Fuel targets updated.', false);
  };
  const warns = planWarnings(t, n);
  if (warns.length) {
    const wc = el(`<div class="card warn"><div class="head"><h2>Worth knowing</h2></div></div>`);
    warns.forEach(x => wc.appendChild(el(`<div class="set"><div class="h">${esc(x)}</div></div>`)));
    out.push(wc);
  }
  out.push(head);

  /* the day plan */
  const day = buildDay(t, n.prefs || {}, n.dislikes || [], n.meals || 3, planDay, n.away || []);
  const tot = day.reduce((a, m) => ({ kcal: a.kcal + m.kcal, protein: a.protein + m.protein }), { kcal: 0, protein: 0 });
  const dc = el(`<div class="card"><div class="head"><h2>Day ${planDay + 1} of 7</h2>
    <span class="meta">${tot.kcal} kcal · ${tot.protein} g</span></div>
    <div class="set" style="border-top:0"><div class="btnrow" style="margin:0">
      <button class="act sm ghost" id="pv">Previous day</button>
      <button class="act sm ghost" id="nx">Next day</button></div></div></div>`);
  dc.querySelector('#pv').onclick = () => { planDay = (planDay + 6) % 7; render(); };
  dc.querySelector('#nx').onclick = () => { planDay = (planDay + 1) % 7; render(); };

  day.forEach((m, mi) => {
    const mm = mealMethod(m);
    const mkey = `m${planDay}-${mi}`;
    const sec = el(`<div class="set"><div class="t">${m.name} · ${m.protein} g protein · ${m.kcal} kcal${m.away ? ' · packed' : ''}</div>
      <div class="h">${mm.total} min to the table, ${mm.active} min hands on.${m.away ? ' Built from things that travel and need no kitchen.' : ''}</div></div>`);
    m.items.forEach((x, ii) => {
      const key = `${planDay}-${mi}-${ii}`;
      const row = el(`<div class="hrow" style="padding-left:0;padding-right:0">
        <span class="n" style="width:auto;flex:1;font-size:14px">${esc(x.f.n)}</span>
        <span class="d" style="width:auto;text-align:right">${x.mult === 1 ? '' : x.mult + ' × '}${esc(x.f.s)}</span>
        <button class="pill">Swap</button></div>`);
      row.querySelector('button').onclick = () => { swapOpen = swapOpen === key ? null : key; render(); };
      sec.appendChild(row);
      if (swapOpen === key) {
        const opts = swapsFor(x.f, n.prefs || {}, n.dislikes || []);
        const box = el(`<div class="seg" style="margin-bottom:10px"></div>`);
        opts.forEach(o => {
          const b = el(`<button type="button">${esc(o.n)}</button>`);
          b.onclick = () => {
            state.nutrition.dislikes = (state.nutrition.dislikes || []).concat([x.f.id]);
            swapOpen = null; save(); render();
            toast(`${x.f.n} removed from your plan.`, false);
          };
          box.appendChild(b);
        });
        box.appendChild(el(`<span class="h" style="width:100%;margin-top:6px">Choosing one drops ${esc(x.f.n)} from every day and rebuilds the week around what is left.</span>`));
        sec.appendChild(box);
      }
    });
    const mb = el(`<div class="btnrow" style="margin-top:10px"><button class="act sm ghost">${panels[mkey] ? 'Hide method' : 'How to make it'}</button></div>`);
    mb.querySelector('button').onclick = () => togglePanel(mkey);
    sec.appendChild(mb);
    if (panels[mkey]) {
      const steps = el(`<div style="margin-top:10px"></div>`);
      mm.steps.forEach((s, si) => steps.appendChild(el(`<div class="hrow" style="padding:9px 0;align-items:flex-start">
        <span class="n" style="width:22px;flex:0 0 22px;color:var(--brand)">${si + 1}</span>
        <span class="h" style="margin:0;flex:1">${esc(s)}</span></div>`)));
      sec.appendChild(steps);
    }
    dc.appendChild(sec);
  });
  out.push(dc);

  const batch = batchHints(t, n.prefs || {}, n.dislikes || [], n.meals || 3, n.away || []);
  if (batch.length) {
    const bc = el(`<div class="card"><div class="head"><h2>Cook once, eat several times</h2>
      <span class="meta">${batch.length} items</span></div>
      <div class="set"><div class="h">These repeat across the week and take real time to cook. Doing them in one session on a Sunday removes most of the daily cooking, which is what makes the diet check survivable alongside two workouts a day.</div></div></div>`);
    batch.forEach(b => bc.appendChild(el(`<div class="hrow">
      <span class="n" style="width:auto;flex:1;font-size:14px">${esc(b.f.n)}</span>
      <span class="d" style="width:auto;text-align:right">${b.days} days · ${(PREP[b.f.id]||[0,0])[1]} min</span></div>`)));
    out.push(bc);
  }

  /* grocery list */
  const gl = groceryList(t, n.prefs || {}, n.dislikes || [], n.meals || 3, n.away || []);
  const labels = { protein: 'Protein', carb: 'Carbohydrate', veg: 'Vegetables and fruit', fat: 'Fats' };
  const gc = el(`<div class="card"><div class="head"><h2>Week's shopping</h2>
    <span class="meta">7 days</span></div></div>`);
  Object.keys(labels).forEach(k => {
    if (!gl[k].length) return;
    const sec = el(`<div class="set"><div class="t">${labels[k]}</div></div>`);
    gl[k].forEach(x => sec.appendChild(el(`<div class="hrow" style="padding-left:0;padding-right:0">
      <span class="n" style="width:auto;flex:1;font-size:14px">${esc(x.f.n)}</span>
      <span class="d" style="width:auto;text-align:right">${x.n} × ${esc(x.f.s)}</span></div>`)));
    gc.appendChild(sec);
  });
  gc.appendChild(el(`<div class="set"><div class="h">Quantities are servings across seven days, so round up at the shop. Buying the week at once removes the daily decision, which is the part that actually fails.</div></div>`));
  out.push(gc);

  out.push(kitCard());
  return out;
}

function nutriWizard() {
  const d = nutriDraft;
  const c = el(`<div class="card"><div class="head"><h2>Build your plan</h2>
    <span class="meta">Step ${nutriStep + 1} of 5</span></div><div id="body"></div></div>`);
  const body = c.querySelector('#body');

  if (nutriStep === 0) {
    body.innerHTML = `<div class="set"><div class="t">What are you actually training for</div>
      <div class="h">Not which diet. The diet follows from this.</div>
      <div class="seg" id="g">${Object.keys(PROFILE_GOALS).map(k => `<button type="button" data-k="${k}" aria-pressed="${d.goal===k}">${PROFILE_GOALS[k].n}</button>`).join('')}</div></div>`;
    body.querySelectorAll('#g button').forEach(b => b.onclick = () => { d.goal = b.dataset.k; nutriStep = 1; render(); });
    body.appendChild(el(`<div class="set"><div class="h">Answered once. Your training plan uses the same answer, so you will not be asked again there.</div></div>`));
  }

  if (nutriStep === 1) {
    body.innerHTML = `<div class="set"><div class="t">About you</div>
      <div class="h">Needed for the energy equation. Nothing here is shared with your crew.</div>
      <div class="seg" id="sx"><button type="button" data-s="f" aria-pressed="${d.sex==='f'}">Female</button>
        <button type="button" data-s="m" aria-pressed="${d.sex==='m'}">Male</button></div>
      <div class="grid4">
        <label class="f"><span>Age</span><input class="fld" id="ag" type="number" inputmode="numeric" value="${d.age||''}"></label>
        <label class="f"><span>Height cm</span><input class="fld" id="ht" type="number" inputmode="numeric" value="${d.heightCm||''}"></label>
        <label class="f"><span>Weight kg</span><input class="fld" id="wt" type="number" inputmode="decimal" value="${d.weightKg||''}"></label>
        <label class="f"><span>Meals a day</span><select class="fld" id="ml">${[2,3,4,5].map(k => `<option value="${k}"${d.meals===k?' selected':''}>${k}</option>`).join('')}</select></label>
      </div>
      <div class="btnrow"><button class="act" id="n">Continue</button><button class="act ghost" id="b">Back</button></div></div>`;

      d.sex = b.dataset.s;
      body.querySelectorAll('#sx button').forEach(x => x.setAttribute('aria-pressed', x.dataset.s === d.sex));
    });
    body.querySelector('#n').onclick = () => {
      d.age = +body.querySelector('#ag').value || null;
      d.heightCm = +body.querySelector('#ht').value || null;
      d.weightKg = parseFloat(body.querySelector('#wt').value) || null;
      d.meals = +body.querySelector('#ml').value;
      if (!d.age || !d.heightCm || !d.weightKg) return toast('Age, height, and weight are all needed.', false);
      if (d.age < 16 || d.age > 90) return toast('Enter an age between 16 and 90.', false);
      nutriStep = 2; render();
    };
    body.appendChild(el(`<div class="set"><div class="h">Saved to your profile under You, not to this plan. Change it once and every plan follows.</div></div>`));
    body.querySelector('#b').onclick = () => { nutriStep = 0; render(); };
  }

  if (nutriStep === 2) {
    body.innerHTML = `<div class="set"><div class="t">Your day outside training</div>
      <div class="h">The two daily workouts are counted separately. This is about the other sixteen hours.</div>
      <div class="seg" id="ac" style="flex-direction:column;align-items:stretch">
        ${Object.keys(ACTIVITY).map(k => `<button type="button" data-a="${k}" aria-pressed="${String(d.activity)===k}" style="text-align:left">${ACTIVITY[k]}</button>`).join('')}</div>
      <div class="btnrow"><button class="act ghost" id="b">Back</button></div></div>`;
    body.querySelectorAll('#ac button').forEach(b => b.onclick = () => { d.activity = parseFloat(b.dataset.a); nutriStep = 3; render(); });
    body.querySelector('#b').onclick = () => { nutriStep = 1; render(); };
  }

  if (nutriStep === 3) {
    const p = d.prefs || (d.prefs = {});
    d.away = d.away || [];
    const diet = [['vegetarian','Vegetarian'],['vegan','Vegan'],['pescatarian','Pescatarian'],['noRedMeat','No red meat'],['noPork','No pork']];
    const need = [['halal','Halal'],['kosher','Kosher'],['glutenFree','Gluten free'],['dairyFree','Dairy free'],['nutAllergy','Nut allergy']];
    const life = [['budget','Tight budget'],['noCook','Minimal cooking']];
    const mealNames = (MEAL_SPLITS[d.meals] || MEAL_SPLITS[3]).names;
    body.innerHTML = `<div class="set"><div class="t">How you eat</div>
      <div class="h">Tap anything that applies. The plan and the shopping list are built only from what is left.</div>
      <div class="seg" id="pf1">${diet.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${!!p[k]}">${l}</button>`).join('')}</div></div>

      <div class="set"><div class="t">Cooking and budget</div>
      <div class="h">Minimal cooking drops anything needing a proper cook, so the plan leans on tins, dairy, bread, and salads.</div>
      <div class="seg" id="pf3">${life.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${!!p[k]}">${l}</button>`).join('')}</div></div>
      <div class="set"><div class="t">Which meals are away from a kitchen</div>
      <div class="h">Tap the meals you eat at work or on the road. Those get built only from food that travels and needs no cooking, so you will not be told to fry eggs at your desk.</div>
      <div class="seg" id="aw">${mealNames.map(m => `<button type="button" data-m="${m}" aria-pressed="${d.away.includes(m)}">${m}</button>`).join('')}</div>
      <div class="btnrow"><button class="act" id="n">Continue</button><button class="act ghost" id="b">Back</button></div></div>`;
    ['#pf1','#pf2','#pf3'].forEach(sel => body.querySelectorAll(sel + ' button').forEach(b => b.onclick = () => {
      p[b.dataset.k] = !p[b.dataset.k];
      b.setAttribute('aria-pressed', !!p[b.dataset.k]);
    }));
    body.querySelectorAll('#aw button').forEach(b => b.onclick = () => {
      d.away = d.away.includes(b.dataset.m) ? d.away.filter(x => x !== b.dataset.m) : d.away.concat([b.dataset.m]);
      b.setAttribute('aria-pressed', d.away.includes(b.dataset.m));
    });
    body.querySelector('#n').onclick = () => { nutriStep = 4; render(); };
    body.querySelector('#b').onclick = () => { nutriStep = 2; render(); };
  }

  if (nutriStep === 4) {
    const cats = [['protein','Protein'],['carb','Carbohydrate'],['veg','Vegetables and fruit'],['fat','Fats']];
    body.innerHTML = `<div class="set"><div class="t">Anything you will not eat</div>
      <div class="h">Tap to exclude. Nothing here is required, and you can swap any item later straight from the plan.</div></div>
      ${cats.map(([c, label]) => {
        const pool = FOODS.filter(f => f.c === c && allowed(f, d.prefs || {}, []));
        if (!pool.length) return '';
        return `<div class="set"><div class="t">${label}</div>
          <div class="seg dlg">${pool.map(f => `<button type="button" data-k="${f.id}" aria-pressed="${(d.dislikes||[]).includes(f.id)}">${f.n}</button>`).join('')}</div></div>`;
      }).join('')}
      <div class="set"><div class="btnrow"><button class="act" id="n">Build the plan</button><button class="act ghost" id="b">Back</button></div></div>`;
    body.querySelectorAll('.dlg button').forEach(b => b.onclick = () => {
      d.dislikes = d.dislikes || [];
      d.dislikes = d.dislikes.includes(b.dataset.k) ? d.dislikes.filter(x => x !== b.dataset.k) : d.dislikes.concat([b.dataset.k]);
      b.setAttribute('aria-pressed', d.dislikes.includes(b.dataset.k));
    });
    body.querySelector('#n').onclick = () => {
      const p = P();
      p.goal = d.goal; p.sex = d.sex; p.age = d.age; p.heightCm = d.heightCm;
      p.activity = d.activity;
      setWeight(d.weightKg);
      state.nutrition = Object.assign(state.nutrition || {}, {
        meals: d.meals, prefs: d.prefs, dislikes: d.dislikes, away: d.away, pattern: d.pattern });
      nutriStep = null; nutriDraft = null; planDay = 0;
      save(); render(); toast('Plan built.', false);
    };
    body.querySelector('#b').onclick = () => { nutriStep = 3; render(); };
  }

  const foot = el(`<div class="set"><div class="h">General guidance for healthy adults, not medical advice. If you are pregnant, breastfeeding, managing a diagnosed condition, or have a history of disordered eating, work with a dietitian or your doctor instead of an equation.</div>
    <div class="btnrow"><button class="act sm ghost" id="cx">Cancel</button></div></div>`);
  foot.querySelector('#cx').onclick = () => { nutriStep = null; nutriDraft = null; render(); };
  c.appendChild(foot);
  return c;
}

/* ---------- what you need before day 1 ---------- */
function kitCard() {
  const r = R();
  const items = [
    ['A refillable bottle you know the volume of', `${(waterTarget()/1000).toFixed(1)} litres is easier counted in bottles than glasses. A 750 ml bottle means ${Math.ceil(waterTarget()/750)} refills.`],
    ['Shoes and clothes for bad weather', 'The outdoor session is the check that breaks most runs, and it breaks on the days you would rather not go outside.'],
    ['A paper book, already chosen', `${r.pages} pages a day${r.fiction ? '' : ' of non-fiction'}. Choosing the book on day 1 costs you day 1.`],
    ['A fixed spot and time for the photo', 'Same place, same light, same time. Comparisons are worthless otherwise.'],
    ['A week of food bought in advance', 'The diet check fails at 18:00 when nothing is in the fridge, not at the moment you decide to eat well.'],
    ['Two slots blocked in your calendar', `${r.sessions} sessions of ${r.minutes} minutes does not fit into leftover time. Put them in before the week fills.`]
  ];
  const c = el(`<div class="card"><div class="head"><h2>Before day 1</h2>
    <span class="meta">${items.length} things</span></div></div>`);
  items.forEach(([t, h]) => c.appendChild(el(`<div class="set"><div class="t">${esc(t)}</div><div class="h">${esc(h)}</div></div>`)));
  return c;
}

/* ============================================================

  relations: { n: 'Relationships',    ic: '👨‍👩‍👧' },
  home:      { n: 'Home',             ic: '🏠' },
  travel:    { n: 'Travel',           ic: '✈️' },
  business:  { n: 'Business',         ic: '🚀' },
  growth:    { n: 'Personal growth',  ic: '🎨' },

const STAGES = ['Not started', 'Planning', 'In progress', 'Almost there', 'Completed'];

/* Numeric goals now include a plain target, which covers saving,
   word counts, and anything else that is just a number by a date. */
const GOAL_TYPES = {
  fitness: { name: 'Fitness', ic: '🏃', cat: 'health' },
  book:    { name: 'Book',    ic: '📚', cat: 'learning' },
  weight:  { name: 'Weight',  ic: '⚖️', cat: 'health' },
  number:  { name: 'A number by a date', ic: '📈', cat: 'finance' },
  project: { name: 'A project with steps', ic: '🗂️', cat: 'career' }
};

const monthKey = d => (d || today()).slice(0, 7);
const weekKey = d => { const x = fromIso(d || today()); const day = (x.getDay() + 6) % 7;
  return iso(addDays(d || today(), -day) ? addDays(d || today(), -day) : d); };

const milestones = g => g.milestones || (g.milestones = []);
const actions = g => g.actions || (g.actions = []);

/* ============================================================
   GOAL FORMATS
   Format is how a goal is tracked. Category is what it is about.
   Metric decides the unit and, underneath, which engine runs the
   maths, so a running time is not treated like a savings balance.
   ============================================================ */
const FORMATS = {
  target:  { n: 'Reach a target', ic: '🎯', d: 'Move a number from where it is now to where you want it.' },
  habit:   { n: 'Build a habit',  ic: '🔁', d: 'Do something a set number of times a week.' },
  project: { n: 'Complete a project', ic: '🗂️', d: 'Finish a set of steps by a date.' },
  range:   { n: 'Stay in a range', ic: '⚖️', d: 'Hold a number between two values.' }
};

/* engine: which progress model runs. dir: 'auto' works it out from the
   numbers, 'ask' means lower is not automatically better. */
const METRICS = {
  time:     { n: 'Time for a distance', units: ['minutes', 'seconds', 'hours'], engine: 'fitness', dir: 'lower', hint: 'Your most recent finish time for that distance.' },
  distance: { n: 'Distance',            units: ['km', 'm', 'miles'],            engine: 'fitness', dir: 'higher', hint: 'The furthest you can currently cover in one go.' },
  pace:     { n: 'Pace',                units: ['min/km', 'min/mile'],          engine: 'fitness', dir: 'lower', hint: 'Your current sustainable pace.' },
  lift:     { n: 'Weight lifted',       units: ['kg', 'lb'],                    engine: 'fitness', dir: 'higher', hint: 'A weight you can lift with clean form today.' },
  reps:     { n: 'Repetitions',         units: ['reps'],                        engine: 'fitness', dir: 'higher', hint: 'How many you can do in one set right now.' },
  bodywt:   { n: 'Body weight',         units: ['kg', 'lb'],                    engine: 'weight',  dir: 'auto', hint: 'Your most recent weigh-in.' },
  measure:  { n: 'Body measurement',    units: ['cm', 'in'],                    engine: 'number',  dir: 'auto', hint: 'Measured the same way each time.' },
  pages:    { n: 'Book pages',          units: ['pages'],                       engine: 'book',    dir: 'higher', hint: 'Pages logged on Today count towards this.' },
  money:    { n: 'An amount of money',  units: ['R', '$', '€', '£'],            engine: 'number',  dir: 'auto', hint: 'What you have set aside so far.' },
  count:    { n: 'A count of something',units: ['times', 'items', 'words'],     engine: 'number',  dir: 'auto', hint: 'Where the count stands now.' },
  percent:  { n: 'A percentage',        units: ['%'],                           engine: 'number',  dir: 'auto', hint: 'The current figure.' },
  custom:   { n: 'Something else',      units: [],                              engine: 'number',  dir: 'auto', hint: 'Whatever you are measuring.' }
};

const CHECKINS = { attempt: 'After every attempt', weekly: 'Weekly', fortnight: 'Every two weeks', monthly: 'Monthly' };

/* Suggested supporting actions, by category. An outcome says where you
   want to go; these are what you actually do. */
const ACTION_IDEAS = {
  health: ['Run three times a week', 'One interval session a week', 'One long session a week', 'Strength train twice a week', 'Walk 30 minutes daily'],
  finance: ['Move money on payday', 'Review spending weekly', 'Cancel one subscription', 'No spending on one day a week'],
  learning: ['Read 20 pages a day', 'One study session a week', 'Write notes after each chapter'],
  career: ['One hour of deep work daily', 'Weekly progress review', 'Send one outreach message a week'],
  business: ['Ship one thing a week', 'Contact five prospects a week', 'Review numbers monthly'],
  relations: ['One call a week', 'A proper evening out monthly', 'Message first, not last'],
  home: ['Fifteen minutes tidying daily', 'One repair a week'],
  travel: ['Move money to the trip fund weekly', 'Research one thing a week'],
  growth: ['Ten minutes journalling', 'One new thing a month'],
  mind: ['Ten minutes quiet daily', 'Screens off an hour before bed', 'Eight hours in bed']

/* ---------- habit ---------- */
function habitProgress(g) {
  const per = g.perWeek || 3;
  const es = entriesOf(g);
  const weekCount = offset => {
    const end = addDays(today(), -7 * offset), start = addDays(end, -6);
    return es.filter(e => e.date >= start && e.date <= end).length;
  };
  const thisWeek = weekCount(0);
  const prior = [1, 2, 3, 4].map(weekCount);
  const hit = prior.filter(c => c >= per).length;
  const pct = Math.min(1, thisWeek / per);
  const line = `${thisWeek} of ${per} this week.`;
  let sub = es.length
    ? `${hit} of the last 4 weeks hit ${per}. ${es.length} logged in total.`
    : 'Nothing logged yet. Tap the log button each time you do it.';
  if (thisWeek >= per) sub = `This week is done. ` + sub;
  return { pct, line, sub, thisWeek, per };
}

/* ---------- range ---------- */
function rangeProgress(g) {
  const es = entriesOf(g), last = es.length ? es[es.length - 1] : null;
  const unit = g.unit || '';
  const r2 = x => Math.round(x * 100) / 100;
  if (!last) return { pct: 0, line: `Target range ${g.min} to ${g.max} ${unit}.`, sub: 'Log a measurement to start tracking.' };
  const v = last.value, inside = v >= g.min && v <= g.max;
  const recent = es.slice(-8);
  const insideCount = recent.filter(e => e.value >= g.min && e.value <= g.max).length;
  const line = `${r2(v)} ${unit} on ${shortD(last.date)}. Range is ${g.min} to ${g.max} ${unit}.`;
  const sub = (inside
    ? 'Inside the range.'
    : v < g.min ? `${r2(g.min - v)} ${unit} below the range.` : `${r2(v - g.max)} ${unit} above the range.`)
    + ` ${insideCount} of the last ${recent.length} readings were inside.`;
  return { pct: inside ? 1 : Math.max(0.2, insideCount / Math.max(1, recent.length)), line, sub, inside };
}

/* Titles the user does not have to write. */
function autoTitle(f) {
  const m = METRICS[f.metric] || METRICS.custom;
  const u = f.unit || '';
  if (f.format === 'habit') return `${f.actionName || 'Do it'} ${f.perWeek} times a week`;
  if (f.format === 'range') return `Keep ${m.n.toLowerCase()} between ${f.min} and ${f.max} ${u}`;
  if (f.format === 'project') return f.title || 'A project';
  if (f.metric === 'time') return `Run ${f.what || 'the distance'} in ${f.target} ${u}`;
  if (f.metric === 'distance') return `Cover ${f.target} ${u} in one go`;
  if (f.metric === 'reps') return `${f.target} ${u}${f.what ? ' of ' + f.what : ''}`;
  if (f.metric === 'pace') return `Hold ${f.target} ${u}${f.what ? ' over ' + f.what : ''}`;
  if (f.metric === 'lift') return `Lift ${f.target} ${u}${f.what ? ' on ' + f.what : ''}`;
  if (f.metric === 'money') return `Save ${CURRENCIES.includes(u) ? u + fmtNum(f.target) : fmtNum(f.target) + ' ' + u}`;
  if (f.metric === 'bodywt') return `Reach ${f.target} ${u}`;
  return `Reach ${f.target} ${u}`.trim();
}

/* What the app understood, in a sentence, before anything is saved. */
function goalSummary(f) {
  const m = METRICS[f.metric] || METRICS.custom, u = f.unit || '';
  const when = f.deadline ? ` by ${pretty(f.deadline)}` : ', with no deadline set';
  if (f.format === 'habit') {
    return { line: `${f.actionName || 'This'}, ${f.perWeek} times a week${f.deadline ? ` until ${pretty(f.deadline)}` : ', ongoing'}.`, facts: [] };
  }
  if (f.format === 'range') {
    return { line: `Hold ${m.n.toLowerCase()} between ${f.min} and ${f.max} ${u}${when}.`, facts: [] };
  }
  if (f.format === 'project') {
    return { line: `Finish ${f.title || 'this project'}${when}.`, facts: ['Add the steps once it is created.'] };
  }
  if (f.start == null || f.target == null || isNaN(f.start) || isNaN(f.target)) {
    return { line: 'Fill in where you are now and where you want to get to.', facts: [] };
  }
  const down = f.target < f.start;
  const diff = Math.abs(f.start - f.target);
  const pctChange = f.start ? Math.abs(diff / f.start * 100) : 0;
  const dl = f.deadline ? between(today(), f.deadline) : null;
  const facts = [
    `${down ? 'Reduction' : 'Improvement'} needed: ${Math.round(diff * 100) / 100} ${u}`,
    `About ${pctChange.toFixed(1)}%`
  ];
  if (dl != null) facts.push(`${dl} days available`);
  const subject = f.metric === 'distance' ? 'longest distance'
    : f.metric === 'time' ? `time for ${f.what || 'the distance'}`
    : f.metric === 'lift' ? `${f.what || 'lift'}`
    : f.metric === 'reps' ? `${f.what || 'reps'}`
    : m.n.toLowerCase();
  return {
    line: `${down ? 'Bring' : 'Take'} your ${subject} ${down ? 'down' : 'up'} from ${f.start} ${u} to ${f.target} ${u}${when}.`,
    facts
  };
}

/* ---------- progress ---------- */
function numberProgress(g) {
  const last = latestEntry(g);
  const start = g.start != null ? g.start : 0;
  const now = last ? last.value : start;
  const total = g.target - start, moved = now - start;
  const pct = total === 0 ? 1 : Math.max(0, Math.min(1, moved / total));
  const left = Math.max(0, g.target - now);
  const dl = daysLeft(g);
  const unit = g.unit || '';
  if (!dl || dl <= 0) return { pct, line: `${amt(now, unit)} of ${amt(g.target, unit)}.`, sub: '' };
  const months = Math.max(dl / 30.44, 0.1), weeks = Math.max(dl / 7, 0.15);
  return { pct,
    line: `${amt(now, unit)} of ${amt(g.target, unit)}, ${amt(left, unit)} to go.`,
    sub: `${amt(left / months, unit)} a month, ${amt(left / weeks, unit)} a week, ${amt(left / dl, unit)} a day for the ${dl} days left.` };
}
function projectProgress(g) {
  const ms = milestones(g);
  if (!ms.length) return { pct: 0, line: 'No steps yet. Break it into the parts that have to happen.', sub: '' };
  const done = ms.filter(m => m.done).length;
  const next = ms.find(m => !m.done);
  return { pct: done / ms.length,
    line: `${done} of ${ms.length} steps done.`,
    sub: next ? `Next: ${next.title}.` : 'Every step is complete.' };
}
const fmtNum = n => Math.round(n).toLocaleString();
/* Currency symbols go in front, units of measure go behind. */
const CURRENCIES = ['R', '$', '€', '£', 'ZAR', 'USD', 'EUR', 'GBP', 'kr', '¥'];
function amt(n, unit) {
  const u = (unit || '').trim();
  if (!u) return fmtNum(n);
  return CURRENCIES.includes(u) ? u + fmtNum(n) : fmtNum(n) + ' ' + u;
}

function goalStage(g) {
  if (g.type === 'habit') {
    const hp = habitProgress(g);
    if (hp.pct >= 1) return 3;
    return entriesOf(g).length ? 2 : 1;
  }
  const p = goalProgress(g);
  if (p.pct >= 1) return 4;
  if (p.pct >= 0.75) return 3;
  if (p.pct > 0.02 || (g.milestones || []).some(m => m.done)) return 2;
  if ((g.milestones || []).length || (g.actions || []).length) return 1;
  return 0;
}

/* ---------- goal health ---------- */
function goalHealth(g) {
  const notes = [];
  let score = 100;
  const p = goalProgress(g), dl = daysLeft(g);

  if (g.deadline && g.created) {
    const span = Math.max(1, between(g.created, g.deadline));
    const gone = Math.max(0, between(g.created, today()));
    const expected = Math.min(1, gone / span);
    const behind = expected - p.pct;
    if (p.pct >= 1) notes.push('✓ Target reached');
    else if (behind > 0.2) { score -= 35; notes.push('⚠ Well behind the pace this deadline needs'); }
    else if (behind > 0.08) { score -= 15; notes.push('⚠ Slightly behind schedule'); }
    else notes.push('✓ On schedule');
  } else { score -= 10; notes.push('⚠ No deadline, so nothing sets the pace'); }

  const ms = milestones(g);
  const overdue = ms.filter(m => !m.done && m.due && between(m.due, today()) > 0);
  if (overdue.length) { score -= Math.min(25, overdue.length * 12); notes.push(`⚠ ${overdue.length} ${overdue.length === 1 ? 'step is' : 'steps are'} past ${overdue.length === 1 ? 'its' : 'their'} date`); }
  else if (ms.length) notes.push('✓ No steps overdue');

  const acts = actions(g);
  const recent = acts.filter(a => a.done);
  if (acts.length) {
    const rate = recent.length / acts.length;
    if (rate < 0.4) { score -= 20; notes.push('⚠ Most weekly actions left undone'); }
    else notes.push('✓ Weekly actions being completed');
  } else { score -= 10; notes.push('⚠ Nothing scheduled this week'); }

  const last = latestEntry(g);
  if (last && between(last.date, today()) > 21 && g.type !== 'project') {
    score -= 15; notes.push('⚠ Nothing logged in three weeks');
  }
  if (dl != null && dl < 0 && p.pct < 1) { score -= 20; notes.push('⚠ Deadline has passed'); }

  return { score: Math.max(0, Math.min(100, score)), notes };
}

/* ---------- category rollup ---------- */
function categoryRollup() {
  const out = {};
  goals().forEach(g => {
    const c = g.category || (GOAL_TYPES[g.type] || {}).cat || 'growth';
    (out[c] = out[c] || { pct: [], n: 0, health: [] });
    out[c].pct.push(goalProgress(g).pct);
    out[c].health.push(goalHealth(g).score);
    out[c].n++;
  });
  Object.keys(out).forEach(k => {
    const o = out[k];
    o.avg = Math.round(o.pct.reduce((a, b) => a + b, 0) / o.pct.length * 100);
    o.hp = Math.round(o.health.reduce((a, b) => a + b, 0) / o.health.length);
  });
  return out;
}

/* ---------- month and week ---------- */
function focusGoals() {
  const m = monthKey();
  return goals().filter(g => (g.focusMonths || []).includes(m));
}
function toggleFocus(g) {
  const m = monthKey();
  g.focusMonths = g.focusMonths || [];
  g.focusMonths = g.focusMonths.includes(m) ? g.focusMonths.filter(x => x !== m) : g.focusMonths.concat([m]);
  save();
}
/* Which goals the app would put forward this month, and why. */
function suggestFocus() {
  return goals().map(g => {
    const h = goalHealth(g), dl = daysLeft(g), p = goalProgress(g);
    let why = null, urgency = 0;
    if (p.pct >= 1) return null;
    if (dl != null && dl >= 0 && dl <= 45) { why = `Deadline in ${dl} days`; urgency = 3; }
    else if (h.score < 55) { why = 'Behind schedule'; urgency = 2; }
    else if (h.score < 80) { why = 'Slipping'; urgency = 1; }
    else { why = 'On track'; urgency = 0; }
    return { g, why, urgency, health: h.score };
  }).filter(Boolean).sort((a, b) => b.urgency - a.urgency || a.health - b.health).slice(0, 3);
}

function weekActions() {
  const out = [];
  goals().forEach(g => actions(g).forEach(a => out.push({ g, a })));
  return out;
}
function todayActions() {
  return weekActions().filter(x => x.a.today && !x.a.done);
}

    <button class="pill" data-a="x">✕</button></div>`);
  row.querySelector('[data-a="t"]').onclick = () => { a.done = !a.done; save(); render(); };
  row.querySelector('[data-a="d"]').onclick = () => { a.today = !a.today; save(); render(); };
  row.querySelector('[data-a="x"]').onclick = () => {
    g.actions = actions(g).filter(x => x.id !== a.id); save(); render();
  };
  return row;
}

/* ---------- all goals ---------- */
function allGoalsView() {

  const head = el(`<div class="card"><div class="head"><h2>Goals</h2>
    <span class="meta">${gs.length}</span></div>
    <div class="set"><div class="h">A goal is a number and a date, or a set of steps and a date. Everything below it, the monthly focus, the weekly actions, the daily tasks, comes from here.</div>

  out.push(head);
  if (goalForm) out.push(goalFormCard());

  if (!gs.length && !goalForm) {
    out.push(el(`<div class="card"><div class="set"><div class="h">Nothing set yet. Save an amount by a date, finish a book, reach a weight, run a distance, or break a project like a wedding or a dissertation into its steps.</div></div></div>`));
  }

      <div class="set" style="border-top:0">

        <div class="btnrow"><button class="act sm">Open</button></div>

/* ---------- one goal ---------- */
function goalDetail(id) {
  const g = goalById(id);
  if (!g) { openGoal = null; return []; }
  const out = [];
  const back = el(`<div class="btnrow" style="margin:0 0 12px"><button class="act sm ghost">Back</button></div>`);
  back.querySelector('button').onclick = () => { openGoal = null; render(); };
  out.push(back);

  const p = goalProgress(g), h = goalHealth(g);
  const cat = CATEGORIES[g.category] || { n: 'Other', ic: '⭐' };
  const head = el(`<div class="card"><div class="head"><h2>${cat.ic} ${esc(g.title)}</h2>
    <span class="${h.score >= 75 ? 'chip' : h.score >= 50 ? 'chip amber' : 'chip red'}">${h.score}/100</span></div>
    <div class="set" style="border-top:0">
      <div class="prog">${Array.from({length:20},(_,k)=>`<span class="${k < Math.round(p.pct*20)?'on':''}"></span>`).join('')}</div>
      <div class="t" style="margin-top:10px">${esc(p.line)}</div>
      ${p.sub ? `<div class="h">${esc(p.sub)}</div>` : ''}
      <div class="amt">${STAGES[goalStage(g)]}${g.deadline ? ' · due ' + pretty(g.deadline) : ' · no deadline'}</div></div>
    <div class="set"><div class="t">Goal health</div>
      ${h.notes.map(x => `<div class="h">${esc(x)}</div>`).join('')}</div></div>`);
  out.push(head);

  /* milestones */
  const ms = milestones(g);
  const mc = el(`<div class="card"><div class="head"><h2>Steps</h2>
    <span class="meta">${ms.filter(m => m.done).length} of ${ms.length}</span></div>
    <div class="set" style="border-top:0"><div class="h">The parts that have to happen, in order. A goal without these is a wish with a date on it.</div></div></div>`);
  ms.forEach((m, i) => {
    const late = !m.done && m.due && between(m.due, today()) > 0;
    const row = el(`<div class="hrow">
      <button class="pill" data-a="t" style="border-radius:50%;width:26px;height:26px;padding:0;${m.done ? 'background:var(--brand);border-color:var(--brand);color:#fff' : ''}">${m.done ? '✓' : i + 1}</button>
      <span class="n" style="width:auto;flex:1;font-size:14px;${m.done ? 'color:var(--muted);text-decoration:line-through' : ''}">${esc(m.title)}</span>
      <span class="d" style="width:auto;${late ? 'color:var(--red)' : ''}">${m.due ? shortD(m.due) : ''}</span>
      <button class="pill" data-a="x">✕</button></div>`);
    row.querySelector('[data-a="t"]').onclick = () => { m.done = !m.done; save(); render(); };
    row.querySelector('[data-a="x"]').onclick = () => { g.milestones = ms.filter(x => x !== m); save(); render(); };
    mc.appendChild(row);
  });
  const mf = el(`<div class="set"><div class="grid2">
      <label class="f"><span>Step</span><input class="fld" id="mt" placeholder="Book the venue"></label>
      <label class="f"><span>By, optional</span><input class="fld" id="md" type="date"></label></div>
    <div class="btnrow"><button class="act sm" id="ma">Add step</button>
    ${ms.length ? '' : '<button class="act sm ghost" id="mk">Suggest steps</button>'}</div></div>`);
  mf.querySelector('#ma').onclick = () => {
    const t = mf.querySelector('#mt').value.trim();
    if (!t) return toast('Name the step.', false);
    milestones(g).push({ id: 'm' + Date.now(), title: t, due: mf.querySelector('#md').value || null, done: false });
    save(); render();
  };
  if (mf.querySelector('#mk')) mf.querySelector('#mk').onclick = () => {
    suggestMilestones(g).forEach(t => milestones(g).push({ id: 'm' + Date.now() + Math.random(), title: t, done: false }));
    save(); render(); toast('Starting points added. Edit them to fit.', false);
  };
  mc.appendChild(mf);
  out.push(mc);

  /* actions */
  const ac = el(`<div class="card"><div class="head"><h2>This week</h2>
    <span class="meta">${actions(g).filter(a => a.done).length} of ${actions(g).length}</span></div></div>`);
  actions(g).forEach(a => ac.appendChild(actionRow(g, a)));
  const af = el(`<div class="set"><div class="btnrow">
    <input class="fld" id="na" placeholder="Call the photographer" style="flex:1;min-width:160px;margin:0">
    <button class="act sm">Add</button></div></div>`);
  af.querySelector('button').onclick = () => {
    const t = af.querySelector('#na').value.trim();
    if (!t) return;
    actions(g).push({ id: 'a' + Date.now(), title: t, done: false, today: false });
    save(); render();
  };
  ac.appendChild(af);
  out.push(ac);

  /* logging and plan, reused from before */
  out.push(goalCard(g));
  return out;
}

/* Starting points, from the shape of the goal rather than a model. */
function suggestMilestones(g) {
  if (g.type === 'number') {
    const start = g.start || 0, span = g.target - start;
    return [0.25, 0.5, 0.75, 1].map(f => `Reach ${amt(start + span * f, g.unit)}`);
  }
  if (g.type === 'weight') {
    const start = g.start, span = g.target - g.start;
    return [0.25, 0.5, 0.75, 1].map(f => `Reach ${Math.round((start + span * f) * 10) / 10} kg`);
  }
  if (g.type === 'book') return ['Read the first quarter', 'Halfway', 'Three quarters', 'Finish it'];
  if (g.type === 'fitness') return ['Set a baseline attempt', 'Halfway to the target', 'Within reach of the target', 'Hit the target'];
  return ['Work out what has to happen', 'Start the first part', 'Get to halfway', 'Finish and check it'];
}

  /* ---- format-specific fields ---- */
  function drawFields() {

        <div class="h">This decides the unit and how progress is worked out.</div>
        <select class="fld" id="mt" style="margin-top:9px">${Object.keys(METRICS).map(k =>

${(() => {

        })()}
        </div>
        <div class="set">
          <div class="grid2">
            <label class="f"><span>Current best</span><input class="fld" id="st" type="number" inputmode="decimal" value="${f.start != null ? f.start : ''}">
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)">${esc(METRICS[f.metric].hint)}</span></label>
            <label class="f"><span>Goal</span><input class="fld" id="tg" type="number" inputmode="decimal" value="${f.target != null ? f.target : ''}"></label>
          </div>
          <div class="grid2">
            <label class="f"><span>Unit</span>${METRICS[f.metric].units.length
              ? `<select class="fld" id="un">${METRICS[f.metric].units.map(u => `<option value="${u}"${f.unit===u?' selected':''}>${u}</option>`).join('')}</select>`
              : `<input class="fld" id="un" placeholder="Unit" value="${esc(f.unit || '')}">`}</label>

          </div>
          ${METRICS[f.metric].dir === 'auto' && f.start != null && f.target != null && !isNaN(f.start) && !isNaN(f.target)
            ? `<div class="h" style="margin-top:9px">Progress means the number going ${f.target < f.start ? 'down' : 'up'}, worked out from the two values above.</div>`
            : METRICS[f.metric].dir === 'auto' ? '' :
              `<div class="h" style="margin-top:9px">For this metric, progress means the number going ${METRICS[f.metric].dir === 'lower' ? 'down' : 'up'}.</div>`}
        </div>
        <div class="set"><div class="t">How often will you check progress</div>
          <div class="seg" id="ci">${Object.keys(CHECKINS).map(k =>
            `<button type="button" data-k="${k}" aria-pressed="${f.checkIn===k}">${CHECKINS[k]}</button>`).join('')}</div></div>`;
    }

    if (f.format === 'habit') {
      fields.innerHTML = `<div class="set"><div class="t">What will you do</div>
        <input class="fld" id="an" placeholder="Strength train" value="${esc(f.actionName || '')}" style="margin-top:9px"></div>
        <div class="set"><div class="t">How many times a week</div>
          <div class="seg" id="pw">${[1,2,3,4,5,6,7].map(k =>
            `<button type="button" data-k="${k}" aria-pressed="${f.perWeek===k}">${k}</button>`).join('')}</div>
          <div class="h" style="margin-top:9px">Pick the number you will still hit in a bad week. A habit at three times a week beats one at six that collapses.</div></div>
        <div class="set"><div class="grid2"><label class="f"><span>Until, optional</span>
          <input class="fld" id="dl" type="date" value="${f.deadline || ''}"></label></div></div>`;

      fields.innerHTML = `<div class="set"><div class="t">What are you holding steady</div>
        <select class="fld" id="mt" style="margin-top:9px">${Object.keys(METRICS).map(k =>
          `<option value="${k}"${f.metric===k?' selected':''}>${METRICS[k].n}</option>`).join('')}</select></div>
        <div class="set"><div class="grid4">
          <label class="f"><span>Lowest</span><input class="fld" id="mn" type="number" inputmode="decimal" value="${f.min != null ? f.min : ''}"></label>
          <label class="f"><span>Highest</span><input class="fld" id="mx" type="number" inputmode="decimal" value="${f.max != null ? f.max : ''}"></label>
          <label class="f"><span>Unit</span>${METRICS[f.metric] && METRICS[f.metric].units.length
            ? `<select class="fld" id="un">${METRICS[f.metric].units.map(u => `<option value="${u}"${f.unit===u?' selected':''}>${u}</option>`).join('')}</select>`
            : `<input class="fld" id="un" value="${esc(f.unit || '')}">`}</label>
          <label class="f"><span>Until, optional</span><input class="fld" id="dl" type="date" value="${f.deadline || ''}"></label>

        <input class="fld" id="ti" placeholder="Submit the dissertation" value="${esc(f.title || '')}" style="margin-top:9px">
        <div class="h" style="margin-top:9px">Steps are added once it exists, and the app can suggest a starting set.</div>
        <div class="grid2"><label class="f"><span>By</span><input class="fld" id="dl" type="date" value="${f.deadline || dflt}"></label></div></div>`;
    }

    /* supporting actions, for every format except habit */
    if (f.format !== 'habit') {
      const ideas = ACTION_IDEAS[f.category] || ACTION_IDEAS.growth;
      fields.innerHTML += `<div class="set"><div class="t">What will you actually do, optional</div>
        <div class="h">The target says where you are going. These are the weekly actions that get you there, and they are tracked separately, because the number does not move every week even when you do everything right.</div>
        <div class="seg" id="ai">${ideas.map(x =>
          `<button type="button" data-k="${esc(x)}" aria-pressed="${f.actions.includes(x)}">${esc(x)}</button>`).join('')}</div></div>`;
    }
    wire();
    summarise();
  }

  function readFields() {
    const g = id => fields.querySelector('#' + id);
    if (g('mt')) { const v = g('mt').value; if (v !== f.metric) { f.metric = v; f.unit = METRICS[v].units[0] || ''; return true; } }
    if (g('un')) f.unit = g('un').value;
    if (g('st')) f.start = g('st').value === '' ? null : parseFloat(g('st').value);
    if (g('tg')) f.target = g('tg').value === '' ? null : parseFloat(g('tg').value);
    if (g('mn')) f.min = g('mn').value === '' ? null : parseFloat(g('mn').value);
    if (g('mx')) f.max = g('mx').value === '' ? null : parseFloat(g('mx').value);
    if (g('dl')) f.deadline = g('dl').value || null;
    if (g('ti')) f.title = g('ti').value;
    if (g('an')) f.actionName = g('an').value;
    if (g('what')) f.what = g('what').value;
    return false;
  }

  function summarise() {
    const s = goalSummary(f);
    c.querySelector('#sumline').textContent = s.line;
    c.querySelector('#sumfacts').textContent = s.facts.join(' · ');
  }

  function wire() {
    fields.querySelectorAll('input, select').forEach(x => {
      x.oninput = () => { if (readFields()) drawFields(); else summarise(); };
      x.onchange = () => { if (readFields()) drawFields(); else summarise(); };
    });
    const pw = fields.querySelector('#pw');
    if (pw) pw.querySelectorAll('button').forEach(b => b.onclick = () => {
      f.perWeek = +b.dataset.k;
      pw.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.k === f.perWeek));
      summarise();
    });
    const ci = fields.querySelector('#ci');
    if (ci) ci.querySelectorAll('button').forEach(b => b.onclick = () => {
      f.checkIn = b.dataset.k;
      ci.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === f.checkIn));
    });
    const ai = fields.querySelector('#ai');
    if (ai) ai.querySelectorAll('button').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      f.actions = f.actions.includes(k) ? f.actions.filter(x => x !== k) : f.actions.concat([k]);
      b.setAttribute('aria-pressed', f.actions.includes(k));
    });
  }

  c.querySelectorAll('#fm button').forEach(b => b.onclick = () => {
    if (b.dataset.k === 'challenge') {
      goalForm = null; tab = 'today'; render();
      toast('Daily challenges live on the Today tab, where the checks are logged.', false);
      return;
    }
    f.format = b.dataset.k;
    if (f.format === 'target' && !METRICS[f.metric]) f.metric = 'time';
    if (f.format === 'range' && !['bodywt','measure','percent','count','money'].includes(f.metric)) { f.metric = 'bodywt'; f.unit = 'kg'; }
    goalForm = f; render();
  });
  c.querySelectorAll('#ct button').forEach(b => b.onclick = () => {
    f.category = b.dataset.k; goalForm = f; render();
  });

  /* ---- save ---- */
  c.querySelector('#sv').onclick = () => {
    readFields();
    const base = { id: 'g' + Date.now(), category: f.category, created: today(),
      deadline: f.deadline || null, checkIn: f.checkIn, milestones: [],
      actions: (f.actions || []).map((t, i) => ({ id: 'a' + Date.now() + i, title: t, done: false, today: false })) };

    if (f.format === 'project') {
      if (!f.title || !f.title.trim()) return toast('Give the project a name.', false);
      goals().push(Object.assign(base, { type: 'project', title: f.title.trim(), entries: [] }));
    } else if (f.format === 'habit') {
      if (!f.actionName || !f.actionName.trim()) return toast('Say what you will do.', false);
      goals().push(Object.assign(base, { type: 'habit', title: autoTitle(f),
        actionName: f.actionName.trim(), perWeek: f.perWeek, unit: '', entries: [] }));
    } else if (f.format === 'range') {
      if (f.min == null || f.max == null || isNaN(f.min) || isNaN(f.max)) return toast('Both ends of the range are needed.', false);
      if (f.min >= f.max) return toast('The lowest value must be below the highest.', false);
      goals().push(Object.assign(base, { type: 'range', title: autoTitle(f),
        metric: f.metric, min: f.min, max: f.max, unit: f.unit, entries: [] }));
    } else {
      if (f.start == null || f.target == null || isNaN(f.start) || isNaN(f.target)) return toast('Current best and goal are both needed.', false);
      if (f.start === f.target) return toast('Those are the same number, so there is nothing to track.', false);
      const m2 = METRICS[f.metric];
      const type = m2.engine === 'book' ? 'book' : m2.engine === 'weight' ? 'weight' : m2.engine === 'fitness' ? 'fitness' : 'number';
      const g = Object.assign(base, { type, title: autoTitle(f), metric: f.metric, what: f.what || null,
        start: f.start, target: f.target, unit: f.unit,
        lowerIsBetter: m2.dir === 'lower' ? true : m2.dir === 'higher' ? false : f.target < f.start,
        entries: [{ date: today(), value: f.start }] });
      if (type === 'book') {
        state.books = (state.books || []).concat([{ title: f.what || f.title || 'Book', pages: f.target, read: f.start || 0 }]);
        booksDirty = true;
        g.bookIndex = state.books.length - 1;
      }
      goals().push(g);
    }
    goalForm = null; save(); render(); toast('Goal created.', false);
  };
  c.querySelector('#cx').onclick = () => { goalForm = null; render(); };

  drawFields();
  return c;
}

      <div class="t" style="margin-top:10px">${esc(p.line)}</div>
      ${p.sub ? `<div class="h">${esc(p.sub)}</div>` : ''}

    </div></div>`);

  if (g.type === 'habit') {
    const hp = habitProgress(g);
    const doneToday = entriesOf(g).some(e => e.date === today());
    const hc = el(`<div class="set"><div class="t">Log it</div>
      <div class="h">${hp.thisWeek} of ${hp.per} done this week.${doneToday ? ' Already logged today.' : ''}</div>
