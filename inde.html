      ${doneToday ? '<button class="act sm ghost" id="un">Undo today</button>' : ''}</div></div>`);
    hc.querySelector('button').onclick = () => {
      g.entries = (g.entries || []).concat([{ date: today(), value: 1 }]);
      save(); render(); toast('Logged.', false);
    };
    const un = hc.querySelector('#un');
    if (un) un.onclick = () => { g.entries = entriesOf(g).filter(e => e.date !== today()); save(); render(); };
    c.appendChild(hc);
  }

  if (g.type !== 'book' && g.type !== 'habit') {
    const last = latestEntry(g);
    const due = last && g.cadence ? between(last.date, today()) >= g.cadence : true;
    const entry = el(`<div class="set">
      <div class="t">${g.type === 'weight' ? 'Weigh in' : g.type === 'range' ? 'Log a reading' : 'Log an attempt'}</div>
      <div class="h">${g.type === 'weight'
        ? (last ? `Last weigh-in ${shortD(last.date)} at ${last.value} kg. ${g.cadence ? (due ? 'Due now.' : `Next one in ${g.cadence - between(last.date, today())} days.`) : ''}` : 'No weigh-ins yet.')
        : (last ? `Best so far ${last.value} ${esc(g.unit || '')} on ${shortD(last.date)}.` : 'No attempts logged.')}</div>
      <div class="grid2">
        <label class="f"><span>${g.type === 'weight' ? 'Weight kg' : 'Result ' + esc(g.unit || '')}</span>
          <input class="fld" id="v" type="number" inputmode="decimal"></label>
        <label class="f"><span>Date</span><input class="fld" id="d" type="date" value="${today()}"></label>
      </div>
      <div class="btnrow"><button class="act sm" id="lg">Log it</button></div></div>`);
    entry.querySelector('#lg').onclick = () => {
      const v = parseFloat(entry.querySelector('#v').value);
      if (isNaN(v)) return toast('Enter a number.', false);
      const d = entry.querySelector('#d').value || today();
      g.entries = (g.entries || []).filter(e => e.date !== d).concat([{ date: d, value: v }]);
      if (g.type === 'weight') { setWeight(v); put(d, { weightKg: v }); }
      save(); render(); toast('Logged.', false);
    };
    c.appendChild(entry);

    const hist = entriesOf(g).slice(-8).reverse();
    if (hist.length > 1) {
      const h = el(`<div class="set"><div class="t">History</div></div>`);
      hist.forEach((e, i) => {
        const prev = hist[i + 1];
        const delta = prev ? Math.round((e.value - prev.value) * 10) / 10 : null;
        h.appendChild(el(`<div class="hrow" style="padding-left:0;padding-right:0">
          <span class="d">${shortD(e.date)}</span>
          <span class="n" style="width:auto;flex:1">${e.value} ${esc(g.unit || '')}</span>
          <span class="amt" style="margin:0;color:${delta == null ? 'var(--muted)' : (g.lowerIsBetter || g.type === 'weight') ? (delta < 0 ? 'var(--brand)' : 'var(--red)') : (delta > 0 ? 'var(--brand)' : 'var(--red)')}">
            ${delta == null ? '' : (delta > 0 ? '+' : '') + delta}</span></div>`));
      });
      c.appendChild(h);
    }
  }

  const plan = el(`<div class="set">
    ${g.plan ? `<div class="coach" style="padding:0 0 10px"><div class="bubble">${esc(g.plan)}</div></div>` : ''}
    <div class="btnrow"><button class="act sm ghost" id="pl">${g.plan ? 'Refresh plan' : 'Work out a plan'}</button>
    <button class="act sm ghost" id="rm">Remove goal</button></div></div>`);
  plan.querySelector('#pl').onclick = () => goalPlan(g);
  plan.querySelector('#rm').onclick = () => {
    state.goals = goals().filter(x => x.id !== g.id);
    save(); render(); toast('Goal removed.', false);
  };
  c.appendChild(plan);
  return c;
}

/* ---------- Progress tab ---------- */
function pgProgress(t, n, fin) {
  const out = [];
  if (!state.name) { state.onboarded = false; obStep = 0; return out; }
  out.push(calendarCard(t));
  out.push(recordCard(n, fin));
  out.push(weekCard());
  out.push(photoCard(t));
  out.push(badgeCard());
  return out;
}

function calendarCard(t) {
  if (!calMonth) calMonth = t.slice(0, 7);
  const [Y, M] = calMonth.split('-').map(Number);
  const first = new Date(Y, M-1, 1), start = (first.getDay() + 6) % 7;
  const days = new Date(Y, M, 0).getDate();
  const c = el(`<div class="card"><div class="head"><h2>Calendar</h2>
    <span class="meta">${statsAll().perfect} perfect days</span></div>
    <div class="cal"><div class="mnav"><button id="pv">‹</button>
      <b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button id="nx">›</button></div>
      <div class="wk hd">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="wk" id="grid"></div></div>
    <div class="legend"><span><i style="background:var(--brand)"></i>Perfect</span>
      <span><i style="background:var(--amber-soft);border:1px solid #EBD9B4"></i>Partial</span>
      <span><i style="background:var(--red-soft);border:1px solid #F0D3CF"></i>Missed</span>
      <span><i style="background:var(--card);border:1px solid var(--line)"></i>Outside the run</span></div></div>`);
  const grid = c.querySelector('#grid');
  for (let i = 0; i < start; i++) grid.appendChild(el(`<div class="cell out">0</div>`));
  for (let day = 1; day <= days; day++) {
    const ds = `${Y}-${String(M).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const inRun = state.runStart && between(state.runStart, ds) >= 0 && between(state.runStart, ds) < TOTAL;
    const past = between(ds, cutoff()) > 0;
    let cls = '';
    if (inRun) {
      const dn = countDone(ds);
      cls = dn === tasks().length ? 'perfect' : (past ? (dn === 0 ? 'missed' : 'part') : (dn > 0 ? 'part' : ''));
    }
    const cell = el(`<div class="cell ${cls} ${ds === t ? 'today' : ''}" title="${inRun ? `Day ${between(state.runStart, ds)+1} · ${countDone(ds)}/${tasks().length}` : shortD(ds)}">${day}</div>`);
    grid.appendChild(cell);
  }
  const shift = k => { const d = new Date(Y, M-1+k, 1); calMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; render(); };
  c.querySelector('#pv').onclick = () => shift(-1);
  c.querySelector('#nx').onclick = () => shift(1);
  return c;
}

function recordCard(n, fin) {
  const s = statsAll(), cur = state.runStart ? Math.min(n, TOTAL) : 0;
  const cd = challengeDone();
  const rows = [['Complete', cd.pct + '%'], ['Days banked', cd.days + '/' + TOTAL], ['Streak', currentStreak()], ['Restarts', s.resets],
    ['Workout min', s.minutes], ['Outdoor', s.outdoor], ['Pages', s.pages], ['Photos', s.photoDays]];
  const c = el(`<div class="card"><div class="head"><h2>Record</h2>
    <span class="meta">${Math.max(state.longest||0, fin ? TOTAL : cur)} best run</span></div>
    <div class="bars" id="bars"></div><div class="axis"><span>Day 1</span><span>Day ${Math.round(TOTAL/2)}</span><span>Day ${TOTAL}</span></div>
    <div class="stats">${rows.map(r=>`<div class="stat"><div class="v">${r[1]}</div><div class="k">${r[0]}</div></div>`).join('')}</div></div>`);
  const bars = c.querySelector('#bars'), of = tasks().length;
  for (let i = 0; i < TOTAL; i++) {
    const d = state.runStart ? addDays(state.runStart, i) : null;
    const past = d ? between(d, cutoff()) > 0 : false, dn = d ? countDone(d) : 0;
    const b = document.createElement('div');
    b.className = 'bar' + (dn === of ? ' full' : dn > 0 ? '' : past ? ' miss' : ' empty');
    b.innerHTML = `<i style="height:${dn === 0 ? 3 : Math.round(dn/of*100)}%"></i>`;
    b.title = d ? `Day ${i+1} · ${shortD(d)} · ${dn}/${of}` : `Day ${i+1}`;
    bars.appendChild(b);
  }
  return c;
}

function weekCard() {
  const w = weekStats(), of = tasks().length;
  const perfect = w.filter(x => x.done === of).length;
  const avgP = Math.round(w.reduce((a,x)=>a+x.protein,0) / 7);
  const mins = w.reduce((a,x)=>a+x.minutes,0);
  const pages = w.reduce((a,x)=>a+x.pages,0);
  const weights = w.filter(x => x.weight);
  const moods = w.filter(x => x.mood);
  const c = el(`<div class="card"><div class="head"><h2>This week</h2><span class="meta">Last 7 days</span></div>
    <div class="stats">
      <div class="stat"><div class="v">${perfect}/7</div><div class="k">Perfect</div></div>
      <div class="stat"><div class="v">${mins}</div><div class="k">Workout min</div></div>
      <div class="stat"><div class="v">${avgP}</div><div class="k">Avg protein g</div></div>
      <div class="stat"><div class="v">${pages}</div><div class="k">Pages</div></div>
    </div>
    <div class="set"><div class="h">
      ${weights.length >= 2 ? `Weight moved from ${weights[0].weight} to ${weights[weights.length-1].weight} kg. ` : 'Log weight twice in a week to see the trend. '}
      ${moods.length ? `Average mood ${(moods.reduce((a,x)=>a+x.mood,0)/moods.length).toFixed(1)} out of 5.` : 'No mood entries this week.'}

  const dates = Object.keys(photos).sort();

    <span class="meta">${dates.length} ${dates.length === 1 ? 'photo' : 'photos'}</span></div></div>`);
  if (!dates.length) {
    c.appendChild(el(`<div class="set"><div class="h">No photos yet. Photos are stored on this device only and never shared with your crew.</div>
      <div class="btnrow"><button class="act sm" id="ad">Add today's photo</button></div></div>`));
    c.querySelector('#ad').onclick = () => pickPhoto(t);
    return c;
  }
  const strip = el(`<div class="strip"></div>`);
  dates.forEach(d => {
    const s = el(`<div class="shot ${cmp.includes(d) ? 'sel' : ''}"><img src="${photos[d]}" alt="Progress photo ${shortD(d)}"><b>${state.runStart && between(state.runStart, d) >= 0 ? 'D' + (between(state.runStart, d)+1) : shortD(d)}</b></div>`);
    s.onclick = () => {
      if (cmp.includes(d)) cmp = cmp.filter(x => x !== d);
      else cmp = cmp.concat([d]).slice(-2);
      render();
    };
    strip.appendChild(s);
  });
  c.appendChild(strip);
  if (cmp.length === 2) {
    const [a, b] = cmp.slice().sort();

    c.appendChild(el(`<div class="compare">
      <figure><img src="${photos[a]}" alt="Earlier photo"><figcaption>${days[0] ? 'Day ' + days[0] + ' · ' : ''}${shortD(a)}</figcaption></figure>
      <figure><img src="${photos[b]}" alt="Later photo"><figcaption>${days[1] ? 'Day ' + days[1] + ' · ' : ''}${shortD(b)}</figcaption></figure></div>`));
  }
  const f = el(`<div class="set"><div class="h">${cmp.length === 2 ? 'Tap a thumbnail to change the pair.' : 'Tap two thumbnails to compare them side by side.'}</div>
    <div class="btnrow"><button class="act sm" id="ad">${photos[t] ? "Replace today's photo" : "Add today's photo"}</button>
    ${cmp.length ? '<button class="act sm ghost" id="cc">Clear selection</button>' : ''}</div></div>`);
  f.querySelector('#ad').onclick = () => pickPhoto(t);
  const cc = f.querySelector('#cc'); if (cc) cc.onclick = () => { cmp = []; render(); };
  c.appendChild(f);
  return c;
}

/* ---------- Crew ---------- */
function pgCrew() {
  const out = [];
  if (!state.name) { state.onboarded = false; obStep = 0; return out; }

  // Joining always available: create, join, or switch, whatever the current state.
  const joiner = el(`<div class="card"><div class="head"><h2>${state.crew ? 'Join a different crew' : 'Join or create a crew'}</h2>
    <span class="meta">${cloudOn() ? 'Signed in' : 'Not signed in'}</span></div>
    <div class="set">
      <div class="h">${cloudOn()
        ? 'Enter a code someone shared with you, or start your own. Joining a new crew leaves the old one.'
        : 'A crew needs a Supabase account on both sides. Enter a code now and it is applied the moment you sign in under Settings, Cloud sync.'}
        ${state.pendingCrew ? `<br><br>Code ${esc(state.pendingCrew)} is waiting for you to sign in.` : ''}</div>
      <input class="fld code" id="cd" placeholder="CODE" maxlength="5" autocomplete="off" value="${esc(state.pendingCrew || '')}">
      <div class="btnrow"><button class="act" id="j">Join with code</button>
      <button class="act ghost" id="c">Create a crew</button></div>
    </div></div>`);
  joiner.querySelector('#j').onclick = async () => { if (await joinCrew(joiner.querySelector('#cd').value)) render(); else render(); };
  joiner.querySelector('#c').onclick = async () => { if (await createCrew()) render(); };

  if (!state.crew) {
    out.push(el(`<div class="card"><div class="head"><h2>No crew yet</h2></div>
      <div class="notice"><h3>Accountability works better in threes</h3>
      <p>Everyone in a crew sees each other's day count and which checks are still open today. Photos, weight, measurements, and fuel never leave your own rows.</p></div></div>`));
    out.push(joiner);
    return out;
  }

  const inv = el(`<div class="card"><div class="head"><h2>Your crew</h2><button class="pill" id="rf">Refresh</button></div>
    <div class="set"><div class="h">Share this code with the people you want holding you to it. They enter it under Crew, after signing in.</div>
    <div class="codebox"><b>${esc(state.crew)}</b><button class="act ghost sm" id="cp" style="margin:0">Copy</button></div>
    ${cloudOn() ? '' : '<div class="h" style="color:var(--red);margin-top:10px">Not signed in, so this crew exists only on this device. Connect under Settings, Cloud sync to make it real.</div>'}</div></div>`);
  inv.querySelector('#rf').onclick = async () => { await loadCrew(); render(); toast('Crew refreshed.', false); };
  inv.querySelector('#cp').onclick = async () => {
    try { await navigator.clipboard.writeText(state.crew); toast('Code copied.', false); }
    catch (e) { toast(`Code is ${state.crew}.`, false); }
  };
  out.push(inv);

  const board = el(`<div class="card"><div class="head"><h2>Standings</h2>
    <span class="meta">${crew.length} ${crew.length === 1 ? 'member' : 'members'}</span></div></div>`);
  if (!crew.length) board.appendChild(el(`<div class="set"><div class="h">Nobody has checked in yet. A member appears here once they log their first check, so a brand new crew looks empty until then.</div></div>`));
  crew.forEach(m => {
    const me = cloudOn() ? m.uid === cloud.uid : slug(m.name) === slug(state.name);
    const row = el(`<div class="mrow"><span class="av ${me ? 'me' : ''}">${esc(m.name.slice(0,1).toUpperCase())}</span>
      <span class="who"><span class="nm">${esc(m.name.split(' ')[0])}${me ? ' <em>you</em>' : ''}
        ${m.mode ? `<em>${esc(m.mode)}</em>` : ''}${m.broken ? '<em style="color:var(--red)">restarting</em>' : ''}</span>
        <span class="dots">${(m.checks||[]).map(b => `<i class="${b?'on':''}"></i>`).join('')}</span></span>
      <span class="day">${m.started ? String(m.day).padStart(2,'0') : '—'}<small>${m.done} of ${m.of||6}</small></span>
      <button class="pill">View</button></div>`);
    if (cloudOn() && m.uid) {
      row.style.cursor = 'pointer';
      row.querySelector('button').onclick = () => openMember(m.uid);
      row.onclick = e => { if (e.target.tagName !== 'BUTTON') openMember(m.uid); };
    } else {
      row.querySelector('button').remove();
    }
    board.appendChild(row);
  });
  out.push(board);

  const upd = crew.length ? Math.max(...crew.map(m => m.updated)) : null;
  out.push(el(`<div class="card"><div class="set"><div class="t">What your crew can see</div>
    <div class="h">First name, mode, day number, how many checks are done today, and whether you are restarting. Photos, weight, measurements, mood, and fuel stay in rows only you can read.${upd ? `<br><br>Last activity ${ago(upd)}.` : ''}</div></div></div>`));

  if (cloudOn()) {
    out.push(shareCard());
    const fc = el(`<div class="card"><div class="head"><h2>Crew feed</h2>
      <span class="meta">${feed.length} recent</span></div></div>`);
    if (!feed.length) fc.appendChild(el(`<div class="set"><div class="h">Nothing shared yet. Anything posted above appears here for everyone in the crew.</div></div>`));
    feed.slice(0, 12).forEach(p => {
      const r = el(`<div class="set"><div class="t">${esc(p.name.split(' ')[0])} · ${esc(p.kind)}</div>
        <div class="h">${esc(p.caption || '')}${p.caption ? ' · ' : ''}${ago(p.ts)}</div>
        ${p.url ? `<img src="${p.url}" alt="Shared ${esc(p.kind)}" style="width:100%;border-radius:12px;margin-top:9px;display:block">` : ''}</div>`);
      r.style.cursor = 'pointer';
      r.onclick = () => openMember(p.uid);
      fc.appendChild(r);
    });
    out.push(fc);
  }

  out.push(joiner);

  const lv = el(`<div class="card"><div class="set"><div class="t">Leave crew ${esc(state.crew)}</div>
    <div class="h">Removes you from the standings board. Your own log is untouched.</div>
    <div class="btnrow"><button class="act sm danger" id="lv">Leave crew</button></div></div></div>`);
  lv.querySelector('#lv').onclick = async () => { await leaveCrew(); toast('You left the crew.', false); };
  out.push(lv);
  return out;
}

      <div class="seg" id="gl">${Object.keys(PROFILE_GOALS).map(k => `<button type="button" data-k="${k}" aria-pressed="${(p.goal || 'health') === k}">${PROFILE_GOALS[k].n}</button>`).join('')}</div></div>
    <div class="set"><div class="t">Known by your plans</div>
      <div class="h">Equipment: ${(p.equipment || ['none']).map(k => EQUIP[k] || k).join(', ').toLowerCase()}.
      <br>Areas that hurt: ${(p.areas || []).length ? p.areas.join(', ') : 'none recorded'}.
      <br>Dietary: ${Object.keys((nutri() || {}).prefs || {}).filter(k => (nutri().prefs)[k]).join(', ') || 'nothing set'}.
      <br><br>These are edited in the Plan tab, under Train and Eat, because that is where they change what you see.</div></div>
    <div class="set" id="acct"><div class="t">Account</div>
      ${cloudOn()
        ? `<div class="h">Signed in as ${esc(cloud.email)}. Your log, crew, and photos sync to every device you sign in on. Signing out keeps everything here and stops it syncing.</div>
           <div class="h" style="margin-top:6px">${esc(syncMsg || 'Synced')}</div>
           <div class="btnrow"><button class="act sm ghost" id="rl">Reload from cloud</button>
           <button class="act sm ghost" id="out">Sign out</button></div>`
        : `<div class="h">Not signed in, so everything lives on this phone only and a crew will not work. Same two boxes whether you are new or coming back.</div>
           <label class="f" style="margin-top:10px"><span>Email address</span>
             <input class="fld" id="ae" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com"></label>
           <label class="f" style="margin-top:9px"><span>Password</span>
             <input class="fld" id="ap" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>
           <div class="btnrow"><button class="act sm" id="asu">Create account</button>
           <button class="act sm" id="asi" style="background:var(--card);color:var(--brand);border:1px solid var(--brand)">Sign in</button></div>
           <div class="h" id="aerr" style="color:var(--red);margin-top:9px"></div>
           <details style="margin-top:10px"><summary style="font-size:12.5px;color:var(--muted);cursor:pointer">Project connection (already set)</summary>
             <label class="f" style="margin-top:9px"><span>Project URL</span><input class="fld" id="au" value="${esc(cloud.url || '')}"></label>
             <label class="f" style="margin-top:9px"><span>Anon public key</span><input class="fld" id="ak" value="${esc(cloud.key || '')}"></label></details>`}
    </div></div>`);
  c.querySelector('#sv').onclick = () => {
    const v = c.querySelector('#nm').value.trim();
    if (v) setName(v);
    p.sex = c.querySelector('#sx').value;
    p.age = +c.querySelector('#ag').value || null;
    p.heightCm = +c.querySelector('#ht').value || null;
    p.activity = parseFloat(c.querySelector('#ac').value) || 1.375;
    setWeight(parseFloat(c.querySelector('#wt').value));
    save(); render(); toast('Profile saved.', false);
  };
  c.querySelectorAll('#gl button').forEach(b => b.onclick = () => { P().goal = b.dataset.k; save(); render(); });
  const outBtn = c.querySelector('#out');
  if (outBtn) outBtn.onclick = async () => {
    if (!confirm('Sign out? Your log stays on this device. Your crew will stop updating until you sign back in.')) return;
    await signOut(); render();
    toast('Signed out. Everything is still here on this device.', false);
  };
  const rl = c.querySelector('#rl');
  if (rl) rl.onclick = async () => { await pull(); await pullPhotos(); await loadCrew(); render(); };

  const go = async kind => {
    const err = c.querySelector('#aerr');
    const url = (c.querySelector('#au') || {}).value || cloud.url;
    const key = (c.querySelector('#ak') || {}).value || cloud.key;
    const email = c.querySelector('#ae').value.trim(), pw = c.querySelector('#ap').value;
    if (!email) { err.textContent = 'Enter your email address.'; return; }
    if (!EMAIL_RE.test(email)) { err.textContent = 'That is not an email address. It needs an @ and a domain.'; return; }
    if (!pw) { err.textContent = 'Enter a password.'; return; }
    if (pw.length < 6) { err.textContent = 'Password needs at least 6 characters.'; return; }
    err.textContent = 'Connecting.';
    try {
      await auth(kind, url.trim(), key.trim(), email, pw, P().name);
      const local = JSON.parse(JSON.stringify(state));
      await pull();
      if (!state.runStart && local.runStart) {
        state = Object.assign(state, local);
        Object.keys(state.log).forEach(d => dirty.add(d));
        booksDirty = true;
        await push();
        toast('Uploaded the run from this device.', false);
      }
      await pullPhotos(); await loadCrew(); render();
    } catch (e) { err.textContent = e.message; }
  };
  const su = c.querySelector('#asu'); if (su) su.onclick = () => go('up');
  const si = c.querySelector('#asi'); if (si) si.onclick = () => go('in');
  return c;
}

function historyCard() {
  const hs = state.history || [];
  const c = el(`<div class="card"><div class="head"><h2>Past challenges</h2>
    <span class="meta">${hs.length}</span></div></div>`);
  if (!hs.length) {
    c.appendChild(el(`<div class="set"><div class="h">Nothing finished or ended yet. Every challenge you stop is filed here with the days you actually completed.</div></div>`));
    return c;
  }
  hs.slice().reverse().forEach(x => c.appendChild(el(`<div class="set">
    <div class="t">${esc(x.name)} · ${x.outcome === 'completed' ? 'Completed' : 'Ended early'}</div>
    <div class="h">Reached day ${x.reachedDay} of ${x.totalDays}. ${x.completeDays} full days, ${x.consistency}% of days complete.</div>
    <div class="amt">${shortD(x.start)} to ${shortD(x.end)}</div></div>`)));
  return c;
}

function pgSettings() {
  const out = [profileCard(), historyCard()], r = R();

  const modes = el(`<div class="card"><div class="head"><h2>Challenge</h2><span class="meta">${esc(r.name)} · ${TOTAL} days</span></div>
    <div class="set"><div class="seg" id="md">${Object.keys(CHALLENGES).map(k => `<button type="button" data-m="${k}" aria-pressed="${challengeId() === k}">${CHALLENGES[k].name}</button>`).join('')}</div>
    <div class="h" style="margin-top:11px">${esc(CH().blurb)}<br><br>${esc(policyText())} Changing challenge changes the checks and the length, so do it between runs rather than mid-way.</div></div>
    ${(R().reqs || []).includes('recovery') ? `<div class="set"><div class="t">Recovery habit</div>
      <div class="h">Which one counts as your daily recovery check.</div>
      <div class="seg" id="rh">${Object.keys(RECOVERY_HABITS).map(k => `<button type="button" data-k="${k}" aria-pressed="${(state.recoveryHabit||'stretch')===k}">${RECOVERY_HABITS[k]}</button>`).join('')}</div></div>` : ''}
    ${(R().reqs || []).includes('nutrule') ? `<div class="set"><div class="t">Nutrition rule</div>
      <div class="h">Pick one and hold it for the whole 30 days.</div>
      <div class="seg" id="nr">${Object.keys(NUTRITION_RULES).map(k => `<button type="button" data-k="${k}" aria-pressed="${(state.nutRule||'protein')===k}">${NUTRITION_RULES[k]}</button>`).join('')}</div></div>` : ''}
    ${state.mode === 'custom' ? `<div class="set"><div class="t">Custom rules</div>
      <div class="grid4">
        <label class="f"><span>Sessions</span><input class="fld" id="cs" type="number" value="${r.sessions}"></label>
        <label class="f"><span>Minutes each</span><input class="fld" id="cm" type="number" value="${r.minutes}"></label>
        <label class="f"><span>Pages</span><input class="fld" id="cp" type="number" value="${r.pages}"></label>
        <label class="f"><span>Water ml</span><input class="fld" id="cw" type="number" value="${r.water}"></label>
      </div>
      <div class="seg" id="cflags">
        <button type="button" data-k="outdoor" aria-pressed="${!!r.outdoor}">Require outdoors</button>
        <button type="button" data-k="photo" aria-pressed="${!!r.photo}">Require photo</button>
        <button type="button" data-k="fiction" aria-pressed="${!!r.fiction}">Allow fiction</button>
        <button type="button" data-k="alcohol" aria-pressed="${!!r.alcohol}">Allow alcohol</button>
      </div>
      <div class="btnrow"><button class="act sm" id="csave">Save rules</button></div></div>` : ''}</div>`);
  modes.querySelectorAll('#rh button').forEach(b => b.onclick = () => { state.recoveryHabit = b.dataset.k; save(); render(); });
  modes.querySelectorAll('#nr button').forEach(b => b.onclick = () => { state.nutRule = b.dataset.k; save(); render(); });
  modes.querySelectorAll('#md button').forEach(b => b.onclick = () => {
    if (state.runStart && b.dataset.m !== challengeId()) {
      toast('End the current challenge on the Today tab first. Switching mid-run would rewrite what your logged days mean.', false);
      return;
    } state.challenge = b.dataset.m; syncChallenge(); if (b.dataset.m === 'custom' && !state.rules) state.rules = Object.assign({}, CHALLENGES.custom); save(); render(); });
  const cs = modes.querySelector('#csave');
  if (cs) {
    const flags = Object.assign({}, state.rules);
    modes.querySelectorAll('#cflags button').forEach(b => b.onclick = () => {
      flags[b.dataset.k] = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', flags[b.dataset.k]);
    });
    cs.onclick = () => {
      state.rules = Object.assign({}, CHALLENGES.custom, flags, {
        sessions: Math.max(1, +modes.querySelector('#cs').value || 1),
        minutes: Math.max(5, +modes.querySelector('#cm').value || 30),
        pages: Math.max(1, +modes.querySelector('#cp').value || 10),
        water: Math.max(1000, +modes.querySelector('#cw').value || 3000)
      });
      save(); render(); toast('Rules saved.', false);
    };
  }
  out.push(modes);

  const water = el(`<div class="card"><div class="head"><h2>Water and fuel</h2><span class="meta">${(waterTarget()/1000).toFixed(2)} L</span></div>
    <div class="set"><div class="t">Water target</div>
      <div class="h">Rule keeps the mode's fixed figure. By body weight uses 40 ml per kilogram, capped between 2 and 5 litres, which is the common practical range for active adults. It is a scaling heuristic, not medical guidance.</div>
      <div class="seg" id="wm">
        <button type="button" data-w="rule" aria-pressed="${state.waterMode==='rule'}">Rule (${(r.water/1000).toFixed(1)} L)</button>
        <button type="button" data-w="weight" aria-pressed="${state.waterMode==='weight'}">By body weight</button></div>
      <div class="h" style="margin-top:8px">Body weight comes from your profile above, currently ${P().weightKg ? P().weightKg + ' kg' : 'not set'}.</div></div>
    <div class="set"><div class="t">Fuel targets</div><div class="h">Reference figures for the Log tab. They do not gate a day.</div>
      <div class="grid2">
        <label class="f"><span>Protein g</span><input class="fld" id="pt" type="number" value="${state.proteinTarget}"></label>
        <label class="f"><span>Calories</span><input class="fld" id="ct" type="number" value="${state.calorieTarget}"></label>
      </div><div class="btnrow"><button class="act sm" id="fs">Save targets</button></div></div></div>`);
  water.querySelectorAll('#wm button').forEach(b => b.onclick = () => { state.waterMode = b.dataset.w; save(); render(); });
  water.querySelector('#fs').onclick = () => {
    state.proteinTarget = Math.max(20, +water.querySelector('#pt').value || 130);
    state.calorieTarget = Math.max(800, +water.querySelector('#ct').value || 2000);
    save(); render(); toast('Targets saved.', false);
  };
  out.push(water);

  const misc = el(`<div class="card"><div class="head"><h2>App</h2></div>
    <div class="set"><div class="t">Grace window</div>
      <div class="h">How long past midnight a day stays editable. None enforces a hard cut-off.</div>
      <div class="seg" id="gr">${[0,3,6,9].map(h=>`<button type="button" data-h="${h}" aria-pressed="${state.graceHours===h}">${h===0?'None':h+' hours'}</button>`).join('')}</div></div>
    <div class="set"><div class="t">Crew</div>
      <div class="h">${state.crew ? 'Your crew sees the name on your profile above.' : 'You are not in a crew.'}</div>
      ${state.crew ? '<div class="btnrow"><button class="act sm ghost" id="lv">Leave crew</button></div>' : ''}</div>
    <div class="set"><div class="t">Share my book list</div>
      <div class="h">When on, your crew can see the books you are reading and how far along you are. Pages, workouts, weight, and photos are never shared by this.</div>
      <div class="seg" id="sb">
        <button type="button" data-v="1" aria-pressed="${state.shareBooks !== false}">Shared</button>
        <button type="button" data-v="0" aria-pressed="${state.shareBooks === false}">Private</button></div></div>
    <div class="set"><div class="t">Add to home screen</div>
      <div class="h" id="ih">Installing gives the app its own icon and a full screen.</div>
      <div class="btnrow"><button class="act sm" id="ib">Install app</button></div></div>
    <div class="set"><div class="t">Start over at day 1</div>
      <div class="h">Clears the current run and logs a restart. Six seconds to undo. Photos and books are kept.</div>
      <div class="btnrow"><button class="act sm danger" id="rb">Start over</button></div></div>
    <div class="set"><div class="t">Wipe this device</div>
      <div class="h">Deletes everything stored here: the run, the log, plans, goals, photos, and any signed-in session. Nothing in Supabase is touched, so signing in again pulls your account back down. Use this on a device you were only testing on, or when a copy of the app is showing data that is not yours.
      ${window.__storageShim && location.protocol === 'file:' ? '<br><br>You are opening this as a local file. Every local copy shares one storage area, whatever the filename, which is why old test data follows you between downloads.' : ''}</div>
      <div class="btnrow"><button class="act sm danger" id="wipe">Wipe this device</button></div></div></div>`);
  misc.querySelectorAll('#gr button').forEach(b => b.onclick = () => { state.graceHours = +b.dataset.h; save(); render(); });
  misc.querySelectorAll('#sb button').forEach(b => b.onclick = async () => {
    state.shareBooks = b.dataset.v === '1';
    await save();
    if (cloudOn()) { try { await rest(`profiles?id=eq.${cloud.uid}`, { method: 'PATCH',
      headers: { Prefer: 'return=minimal' }, body: { share_books: state.shareBooks } }); } catch (e) {} }
    render();
  });
  const lv = misc.querySelector('#lv');
  if (lv) lv.onclick = async () => { await leaveCrew(); toast('You left the crew.', false); };
  misc.querySelector('#ib').onclick = () => {
    if (installPrompt) { installPrompt.prompt(); installPrompt = null; return; }
    misc.querySelector('#ih').textContent = /iPad|iPhone|iPod/.test(navigator.userAgent)
      ? 'On iPhone, tap Share in Safari, then Add to Home Screen.'
      : 'Open the browser menu and choose Install app. This needs the app served from a real address rather than a preview frame.';
  };
  const rb = misc.querySelector('#rb');
  rb.disabled = !state.runStart;
  rb.onclick = () => resetRun(dayOf(today()));
  misc.querySelector('#wipe').onclick = async () => {
    if (!confirm('Wipe everything stored on this device? Your Supabase account is untouched, so signing in again brings your data back. This cannot be undone locally.')) return;
    if (!confirm('Last check. Delete the local run, log, plans, goals, and photos?')) return;
    try {
      const keys = await S.keys('');
      for (const k of keys) await S.del(k);
      const shared = await S.keys('', true);
      for (const k of shared) await S.del(k, true);
      if (window.localStorage) localStorage.clear();
    } catch (e) {}
    location.reload();
  };
  out.push(helpCard());
  out.push(misc);
  return out;
}


function cloudCard() {
  const on = cloudOn();
  const dot = { off: 'var(--line-2)', busy: 'var(--amber)', ok: 'var(--brand)', err: 'var(--red)' }[syncState] || 'var(--line-2)';
  const c = el(`<div class="card" id="cloudAnchor"><div class="head"><h2>Sign in or create an account</h2>
    <span class="meta"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${dot};margin-right:6px"></span>${on ? esc(syncMsg || 'Connected') : 'This device only'}</span></div>
    ${on ? `<div class="set"><div class="t">Signed in</div>
      <div class="h">${esc(cloud.email)}<br>Your log, crew, and photos sync to Supabase and follow you to any device.</div>
      <div class="btnrow"><button class="act sm ghost" id="rl">Reload from cloud</button>
      <button class="act sm ghost" id="so">Sign out</button></div></div>`
    : `<div class="set"><div class="t">Connect to Supabase</div>
      <div class="h">The project is already connected. Create an account or sign in, and your log, crew, and photos follow you to any device.</div>
      <details style="margin-top:11px"><summary style="font-size:12.5px;color:var(--muted);cursor:pointer">Project connection (already set)</summary>
      <label class="f" style="margin-top:9px"><span>Project URL</span><input class="fld" id="u" value="${esc(cloud.url || '')}"></label>
      <label class="f" style="margin-top:9px"><span>Anon public key</span><input class="fld" id="k" value="${esc(cloud.key || '')}"></label></details>
      <div class="grid2">
        <label class="f"><span>Email</span><input class="fld" id="e" type="email" autocomplete="username"></label>
        <label class="f"><span>Password</span><input class="fld" id="p" type="password" autocomplete="current-password"></label>
      </div>
      <div class="btnrow"><button class="act sm" id="si">Sign in</button>
      <button class="act sm ghost" id="su">Create account</button></div>
      <div class="h" id="er" style="color:var(--red);margin-top:10px"></div></div>`}
    </div>`);

  if (on) {
    c.querySelector('#rl').onclick = async () => { await pull(); await pullPhotos(); await loadCrew(); render(); };
    c.querySelector('#so').onclick = async () => { await signOut(); render(); toast('Signed out. Your log stays on this device.', false); };
    return c;
  }
  const go = async kind => {
    const url = c.querySelector('#u').value.trim(), key = c.querySelector('#k').value.trim();
    const email = c.querySelector('#e').value.trim(), pw = c.querySelector('#p').value;
    const err = c.querySelector('#er');
    if (!url || !key) { err.textContent = 'Project URL and anon key are both needed.'; return; }
    if (!email) { err.textContent = 'Enter your email address.'; return; }
    if (!EMAIL_RE.test(email)) { err.textContent = 'That is not an email address. It needs an @ and a domain.'; return; }
    if (!pw) { err.textContent = 'Enter a password.'; return; }
    if (pw.length < 6) { err.textContent = 'Password needs at least 6 characters.'; return; }
    err.textContent = '';
    try {
      await auth(kind, url, key, email, pw, state.name);
      const local = JSON.parse(JSON.stringify(state));
      await pull();
      if (!state.runStart && local.runStart) {
        state = Object.assign(state, local);
        Object.keys(state.log).forEach(d => dirty.add(d));
        booksDirty = true;
        await push();
        toast('Uploaded the run from this device.', false);
      }
      await pullPhotos(); await loadCrew(); render();
    } catch (e) { err.textContent = e.message; }
  };
  c.querySelector('#si').onclick = () => go('in');
  c.querySelector('#su').onclick = () => go('up');
  return c;
}

/* ---------- wiring ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = async () => {
  tab = b.dataset.tab;
  viewUid = null; memberData = null; editDate = null;
  if (tab === 'crew') { await loadCrew(); await loadFeed(null); }
  if (tab === 'inbox') await loadInbox();
  render();
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
setInterval(() => { if (cloud.refresh) ensureSession(); }, 20 * 60 * 1000);
setInterval(async () => {
  if (!state.crew) return;
  await loadCrew(); await loadInbox();
  if (tab === 'crew' || tab === 'inbox' || inboxUnread) render();
}, 25000);

(async () => {
  await loadCloudCfg();
  if (cloud.refresh) await ensureSession();
  await load();
  if (state.name && state.onboarded === undefined) state.onboarded = true;
  await loadPhotos();
  render();
  if (cloudOn()) { await pull(); await pullPhotos(); }
  await loadCrew();
  await loadInbox();
  await loadFeed(null);
  await publish();
  render();
})();
</script>
