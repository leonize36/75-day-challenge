<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --canvas: #F4F5F7; --card: #FFFFFF; --line: #E4E7EC; --line-2: #CFD4DC;
    --text: #14161A; --muted: #6E7480;
    --brand: #0E7C7B; --brand-soft: #E4F1F1; --brand-mid: #8CBFBE;
    --red: #C6564A; --red-soft: #FBECEA; --amber: #B4790C; --amber-soft: #FBF1DF;
    --violet: #5B4B8A; --violet-soft: #EDEAF5;
    --r: 18px; --shadow: 0 1px 2px rgba(20,22,26,.05), 0 6px 20px rgba(20,22,26,.05);
  }
  * { box-sizing: border-box; }
  .app { background: var(--canvas); color: var(--text); font-family: "Inter", system-ui, sans-serif;
    padding: 16px 16px 0; max-width: 760px; margin: 0 auto; min-height: 100%; -webkit-font-smoothing: antialiased; }
  .app h1, .app h2, .app h3 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; }

  .topbar { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }
  .topbar .id { font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .topbar .track { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .topbar .fill { height: 100%; background: var(--brand); width: 0; transition: width 300ms ease; }

  /* dashboard */
  .dash { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .ring { position: relative; width: 118px; height: 118px; flex: 0 0 auto; }
  .ring svg { transform: rotate(-90deg); }
  .ring .bgc { stroke: var(--line); }
  .ring .fgc { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset 500ms cubic-bezier(.2,.8,.3,1); }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .mid b { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -.03em; line-height: 1; }
  .ring .mid span { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 3px; }
  .dash .say { flex: 1; min-width: 0; }
  .dash .say h1 { font-size: clamp(19px, 5.4vw, 25px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .dash .say p { margin: 7px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; overflow: hidden; position: relative; box-shadow: var(--shadow); }
  .card.warn { border-color: #EBD9B4; }
  .card > .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px 17px 13px; }
  .card > .head h2 { font-weight: 700; font-size: 16.5px; letter-spacing: -.015em; }
  .card > .head .meta { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); text-align: right; }

  .chip { display: inline-flex; align-items: center; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 6px 12px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
  .chip.amber { background: var(--amber-soft); color: var(--amber); }
  .chip.red { background: var(--red-soft); color: var(--red); }
  .chip.pop { animation: pop 420ms cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }

  .row { display: flex; align-items: center; gap: 13px; width: 100%; padding: 14px 17px; border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background 150ms ease; }
  .row:hover { background: #FAFBFC; }
  .row:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .row[disabled] { cursor: default; opacity: .55; }
  .row .txt { flex: 1; min-width: 0; }
  .row .lab { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .row .spec { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .row .mark { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; transition: background 160ms ease, border-color 160ms ease; }
  .row .mark svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 3.2; fill: none; opacity: 0; transform: scale(.5); transition: opacity 160ms, transform 220ms cubic-bezier(.2,1.5,.4,1); }
  .row.on .mark { background: var(--brand); border-color: var(--brand); }
  .row.on .mark svg { opacity: 1; transform: scale(1); }
  .row.on .lab { color: var(--muted); }
  .row.auto .mark { border-style: dashed; }

  .prog { display: flex; gap: 3px; margin-top: 7px; }
  .prog span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); transition: background 180ms ease; }
  .prog span.on { background: var(--brand); }
  .stepper { display: flex; gap: 6px; flex: 0 0 auto; }
  .stepper button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card); color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; line-height: 1; }
  .stepper button.plus { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .amt { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); margin-top: 6px; display: block; }

  /* generic sections */
  .set { padding: 14px 17px; border-top: 1px solid var(--line); }
  .set:first-child { border-top: 0; }
  .set .t { font-weight: 600; font-size: 14.5px; }
  .set .h { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .seg { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .seg button { font: inherit; font-size: 13px; font-weight: 500; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  @media (min-width: 520px) { .grid4 { grid-template-columns: repeat(4, 1fr); } }
  label.f { display: block; }
  label.f span { font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  input.fld, select.fld, textarea.fld { font: inherit; font-size: 15px; width: 100%; margin-top: 5px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 11px; background: var(--card); color: var(--text); }
  input.fld:focus, select.fld:focus, textarea.fld:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
  input.code { font-family: "JetBrains Mono", monospace; letter-spacing: .3em; text-transform: uppercase; }
  .codebox { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; background: var(--brand-soft); border-radius: 12px; padding: 12px 15px; }
  .codebox b { font-family: "JetBrains Mono", monospace; font-size: 19px; letter-spacing: .26em; color: var(--brand); }

  /* calendar */
  .cal { padding: 6px 17px 16px; }
  .cal .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal .wk.hd span { font-family: "JetBrains Mono", monospace; font-size: 9.5px; color: var(--muted); text-align: center; padding-bottom: 6px; letter-spacing: .06em; }
  .cell { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--line); background: var(--card); display: grid; place-content: center; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); cursor: default; position: relative; }
  .cell.out { border-color: transparent; background: transparent; color: transparent; }
  .cell.perfect { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 500; }
  .cell.part { background: var(--amber-soft); border-color: #EBD9B4; color: var(--amber); }
  .cell.missed { background: var(--red-soft); border-color: #F0D3CF; color: var(--red); }
  .cell.today { box-shadow: 0 0 0 2px var(--brand); }
  .cal .mnav { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 12px; }
  .cal .mnav b { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 15px; }
  .cal .mnav button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card); cursor: pointer; color: var(--text); font-size: 14px; line-height: 1; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 17px 15px; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* bars / sparkline */
  .bars { display: flex; align-items: flex-end; gap: 1.5px; height: 56px; padding: 0 17px; }
  .bar { flex: 1 1 0; min-width: 0; position: relative; height: 100%; display: flex; align-items: flex-end; }
  .bar i { display: block; width: 100%; border-radius: 2px 2px 0 0; height: 2px; background: var(--brand-mid); }
  .bar.empty i { background: var(--line); }
  .bar.miss i { background: var(--red); }
  .bar.full i { background: var(--brand); }
  .axis { display: flex; justify-content: space-between; padding: 13px 17px 15px; font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--muted); }

  .dots { display: flex; gap: 4px; }
  .dots i { width: 9px; height: 9px; border-radius: 2px; background: var(--line); }
  .dots i.on { background: var(--brand); }
  .dots i.off { background: var(--red); }

  /* crew */
  .mrow { display: flex; align-items: center; gap: 12px; padding: 13px 17px; border-top: 1px solid var(--line); }
  .av { width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 14px; background: var(--brand-soft); color: var(--brand); }
  .av.me { background: var(--brand); color: #fff; }
  .mrow .who { flex: 1; min-width: 0; }
  .mrow .nm { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mrow .nm em { font-style: normal; font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .mrow .dots { margin-top: 7px; }
  .mrow .day { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 21px; letter-spacing: -.02em; flex: 0 0 auto; text-align: right; }
  .mrow .day small { display: block; font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 400; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .pill { font: inherit; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--brand); cursor: pointer; flex: 0 0 auto; }
  .pill:disabled { color: var(--muted); opacity: .5; cursor: default; }

  /* stats + badges */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); }
  .stat { padding: 14px 8px 15px 17px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat .v { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 23px; letter-spacing: -.02em; }
  .stat .k { font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
  @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } .stat:nth-child(2) { border-right: 0 } }

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(102px, 1fr)); gap: 9px; padding: 14px 17px 16px; }
  .badge { border: 1px solid var(--line); border-radius: 13px; padding: 12px 10px; text-align: center; background: #FAFBFC; }
  .badge.got { background: var(--violet-soft); border-color: #D8D1EC; }
  .badge .ic { font-size: 22px; line-height: 1; filter: grayscale(1) opacity(.4); }
  .badge.got .ic { filter: none; }
  .badge .bn { font-weight: 600; font-size: 12px; margin-top: 7px; letter-spacing: -.01em; }
  .badge .bd { font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }

  /* photos */
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 14px 17px 16px; }
  .shot { flex: 0 0 auto; width: 78px; border-radius: 11px; overflow: hidden; border: 2px solid transparent; background: var(--line); cursor: pointer; position: relative; }
  .shot.sel { border-color: var(--brand); }
  .shot img { width: 100%; height: 104px; object-fit: cover; display: block; }
  .shot b { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(20,22,26,.62); color: #fff; font-family: "JetBrains Mono", monospace; font-size: 9px; padding: 3px 0; text-align: center; font-weight: 400; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 17px 16px; }
  .compare figure { margin: 0; }
  .compare img { width: 100%; border-radius: 12px; display: block; }
  .compare figcaption { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--muted); margin-top: 6px; text-align: center; }

  /* coach */
  .coach { padding: 4px 17px 16px; }
  .coach .bubble { background: var(--violet-soft); border-radius: 14px; padding: 14px 15px; font-size: 13.5px; line-height: 1.55; color: #33294F; }
  .coach .bubble.err { background: var(--red-soft); color: var(--red); }

  .notice { padding: 4px 17px 18px; }
  .notice h3 { font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
  .notice.bad h3 { color: var(--red); }
  .notice p { margin: 8px 0 15px; font-size: 13.5px; line-height: 1.55; color: var(--muted); max-width: 46ch; }

  button.act { font-family: "Inter", sans-serif; font-weight: 600; font-size: 13.5px; background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 11px 20px; cursor: pointer; transition: filter 150ms, transform 150ms; }
  button.act:hover { filter: brightness(1.1); }
  button.act:active { transform: scale(.97); }
  button.act:disabled { opacity: .4; cursor: default; }
  button.act.ghost { background: var(--card); color: var(--muted); border: 1px solid var(--line-2); }
  button.act.danger { background: var(--red-soft); color: var(--red); }
  button.act.sm { padding: 9px 15px; font-size: 12.5px; margin-top: 10px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .lock { position: absolute; inset: 0; z-index: 3; background: rgba(255,255,255,.9); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; }
  .lock .notice { background: var(--red-soft); border-radius: 14px; padding: 16px; }

  .tabs { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
    background: rgba(244,245,247,.93); backdrop-filter: blur(8px); border-top: 1px solid var(--line); margin: 4px -16px 0; padding: 7px 4px 11px; }
  .tabs button { font: inherit; font-size: 8.5px; font-weight: 600; letter-spacing: -.02em; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: 0; border-radius: 11px; padding: 7px 2px; color: var(--muted); cursor: pointer; }
  .tabs button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button[aria-current="true"] { color: var(--brand); background: var(--brand-soft); }
  .tabs .badgeN { position: absolute; top: 3px; right: 50%; margin-right: -16px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(12px); background: var(--text); color: #fff; border-radius: 999px; padding: 11px 16px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 26px rgba(20,22,26,.28); opacity: 0; pointer-events: none; transition: opacity 180ms, transform 180ms; z-index: 20; max-width: 92vw; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { font: inherit; font-weight: 600; color: #7FD4D3; background: none; border: 0; cursor: pointer; padding: 0; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line-2); border-top-color: var(--brand); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

<script>
/* Browser storage shim.
   Inside a Claude artifact window.storage exists and is used as is.
   On any real domain it does not, so this maps the same API onto localStorage. */
window.__storageShim = false;
if (!window.storage) {
  window.__storageShim = true;
  const ns = shared => (shared ? 's:' : 'p:');
  window.storage = {
    async get(key, shared) {
      const v = localStorage.getItem(ns(shared) + key);
      if (v === null) throw new Error('Key not found: ' + key);
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(ns(shared) + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(ns(shared) + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = ns(shared) + (prefix || ''), keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(p)) keys.push(k.slice(2));
      }
      return { keys, prefix: prefix || '', shared: !!shared };
    }
  };
}
</script>

<script>
/* ============================================================
   75 tracker — data model
   ============================================================ */
let TOTAL = 75;
const KEY = 'sf:state', PKEY = d => `sf:photo:${d}`;

let state = {
  profile: null,
  challenge: null, mode: 'hard', rules: null, vision: '', history: [],
  recoveryHabit: 'stretch', nutRule: 'protein',
  runStart: null, log: {}, books: [], resets: 0, longest: 0,
  graceHours: 6, waterMode: 'rule', weightKg: null,
  proteinTarget: 130, calorieTarget: 2000,
  name: null, crew: null, coach: {}, seenBadges: [], onboarded: false, shareBooks: true, goals: [], nutrition: null, training: null
};

let tab = 'today', broken = null, wasComplete = false;
let crew = [], myNudges = [], photos = {}, undoSnap = null, toastTimer = null, installPrompt = null;
let calMonth = null, cmp = [], reportText = null;

/* ---------- dates ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const between = (a,b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
const today = () => iso(new Date());
const pretty = s => fromIso(s).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
const shortD = s => fromIso(s).toLocaleDateString(undefined, { day:'numeric', month:'short' });
const ago = ts => { const m = Math.floor((Date.now()-ts)/60000);
  if (m < 2) return 'just now'; if (m < 60) return `${m} min ago`;
  const h = Math.floor(m/60); return h < 24 ? `${h} h ago` : `${Math.floor(h/24)} d ago`; };

/* ============================================================
   CHALLENGES — the commitment is data, the engines are shared.
   restart:  'restart'  one miss and the run returns to day 1
             'continue' a missed day stays missed, the run goes on
             'passes'   a fixed number of missed days are forgiven
   ============================================================ */
const CHALLENGES = {
  hard75: {
    name: '75 Hard', days: 75, difficulty: 'hard', restart: 'restart',
    tag: 'Strict discipline. No margin.',
    blurb: 'The original, unchanged. Six checks a day for 75 days, and one missed check sends you back to day 1. It is a mental toughness challenge that happens to involve training, not a fitness programme.',
    water: 3800, sessions: 2, minutes: 45, outdoor: true, pages: 10,
    photo: 'daily', alcohol: false, fiction: false,
    reqs: ['diet', 'sessions', 'outdoor', 'water', 'read', 'photo']
  },
  balanced75: {
    name: '75 Balanced', days: 75, difficulty: 'moderate', restart: 'continue',
    tag: 'Structured, without all or nothing.',
    blurb: 'The same 75 days and the same habits, without the restart. A missed day is marked missed and the run continues, because for most people quitting on day 12 is the real failure, not the day itself.',
    water: 3000, sessions: 1, minutes: 45, outdoor: false, pages: 10,
    photo: 'weekly', alcohol: true, fiction: true,
    moveMinutes: 30, learnMinutes: 10, recovery: true,
    reqs: ['diet', 'sessions', 'movement', 'water', 'learn', 'recovery', 'photoweek']
  },
  starter30: {
    name: '30-Day Starter', days: 30, difficulty: 'starter', restart: 'passes', passes: 3,
    tag: 'Build the habit before the hard version.',
    blurb: 'Thirty days, one activity, one nutrition rule, and three recovery passes. Made for proving to yourself that you turn up, which is the thing every longer challenge depends on.',
    water: 2500, sessions: 1, minutes: 20, outdoor: false, pages: 0,
    photo: 'weekly', alcohol: true, fiction: true,
    steps: 7000, learnMinutes: 5,
    reqs: ['nutrule', 'sessions', 'steps', 'water', 'learn', 'checkin']
  },
  custom: {
    name: 'Custom', days: 75, difficulty: 'moderate', restart: 'continue',
    tag: 'Your rules, your length.',
    blurb: 'Set the checks yourself. Useful once you know which habits actually stick for you.',
    water: 3000, sessions: 1, minutes: 30, outdoor: false, pages: 10,
    photo: 'daily', alcohol: true, fiction: true,
    reqs: ['diet', 'sessions', 'water', 'read', 'photo']
  }
};

const RECOVERY_HABITS = {
  sleep: '7 hours of sleep', stretch: '10 minutes stretching', meditate: '10 minutes meditation',
  journal: 'Write a few lines', screens: 'An hour screen free', early: 'In bed by your target time'
};
const NUTRITION_RULES = {
  protein: 'Hit your protein target', veg: 'Vegetables at two meals', nosugar: 'No sugary drinks',
  track: 'Log everything you eat', cook: 'Cook one balanced meal', range: 'Stay in your calorie range'
};

function challengeId() {
  if (state.challenge) return state.challenge;
  // Older saves used mode. Map them across so nothing is lost.
  return state.mode === 'soft' ? 'balanced75' : state.mode === 'custom' ? 'custom' : 'hard75';
}
function CH() { return CHALLENGES[challengeId()] || CHALLENGES.hard75; }
function syncChallenge() { TOTAL = CH().days; }

function R() {
  const base = CH();
  return Object.assign({}, base, challengeId() === 'custom' ? (state.rules || {}) : {});
}

function tasks() {
  const r = R(), t = [];
  (r.reqs || []).forEach(k => {
    if (k === 'diet') t.push({ id: 'diet', kind: 'bool', label: 'Diet',
      spec: r.alcohol ? 'Follow your plan. Alcohol only socially.' : 'No cheat meals. No alcohol.' });
    if (k === 'nutrule') t.push({ id: 'nutrule', kind: 'bool', label: 'Nutrition rule',
      spec: NUTRITION_RULES[state.nutRule || 'protein'] + '.' });
    if (k === 'sessions') t.push({ id: 'sessions', kind: 'sessions',
      label: r.sessions > 1 ? `${r.sessions} workouts` : 'Workout',
      spec: `${r.sessions} × ${r.minutes} min or more.` });
    if (k === 'outdoor') t.push({ id: 'outdoor', kind: 'outdoor', label: 'One outdoors', spec: 'One session must be outside.' });
    if (k === 'movement') t.push({ id: 'movement', kind: 'movement', label: 'Movement',
      spec: `${r.moveMinutes} min walking or light movement, on top of the workout.` });
    if (k === 'steps') t.push({ id: 'steps', kind: 'steps', label: 'Steps', spec: `${r.steps.toLocaleString()} steps.` });
    if (k === 'water') t.push({ id: 'water', kind: 'water', label: 'Water', spec: '' });
    if (k === 'read') t.push({ id: 'read', kind: 'pages', label: 'Read',
      spec: `${r.pages} pages${r.fiction ? '' : ', non-fiction'}.` });
    if (k === 'learn') t.push({ id: 'learn', kind: 'learn', label: 'Read or learn',
      spec: `${r.learnMinutes} minutes. A book, a course, anything deliberate.` });
    if (k === 'recovery') t.push({ id: 'recovery', kind: 'bool', label: 'Recovery habit',
      spec: RECOVERY_HABITS[state.recoveryHabit || 'stretch'] + '.' });
    if (k === 'checkin') t.push({ id: 'checkin', kind: 'checkin', label: 'Check in',
      spec: 'Mood, energy, and sleep. One tap each.' });
    if (k === 'photo') t.push({ id: 'photo', kind: 'photo', label: 'Progress photo', spec: 'One shot, every day.' });
    if (k === 'photoweek') t.push({ id: 'photoweek', kind: 'photoweek', label: 'Progress photo', spec: 'One a week is enough.' });
  });
  return t;
}

/* ---------- restart policy ---------- */
function policyText() {
  const r = R();
  if (r.restart === 'restart') return 'One missed check sends the run back to day 1.';
  if (r.restart === 'passes') return `${r.passes} missed days are forgiven. After that the run continues, but the record shows it.`;
  return 'A missed day stays missed. The run continues either way.';
}
function missedDays() {
  if (!state.runStart) return [];
  const out = [], c = cutoff();
  for (let i = 0; i < TOTAL; i++) {
    const d = addDays(state.runStart, i);
    if (between(d, c) <= 0) break;
    if (!complete(d)) out.push(d);
  }
  return out;
}
function consistency() {
  if (!state.runStart) return 0;
  const n = Math.max(1, Math.min(dayOf(today()) - 1, TOTAL));
  let done = 0;
  for (let i = 0; i < n; i++) if (complete(addDays(state.runStart, i))) done++;
  return Math.round(done / n * 100);
}

/* ---------- challenge recommendation ---------- */
function recommendChallenge(a) {
  const reasons = [];
  let pick = 'balanced75';

  const trained = a.trains === 'often' || a.trains === 'some';
  if (a.minutes >= 100 && a.strict === 'strict' && trained && a.restartOk) {
    pick = 'hard75';
    reasons.push('You have over 100 minutes a day, which two 45 minute sessions actually need.');
    reasons.push('You said you want strict rules and you accept the restart.');
    if (a.trains === 'often') reasons.push('You already train regularly, so the volume is not a step into the dark.');
  } else if (a.trains === 'never' || a.minutes < 45 || a.miss === 'quit') {
    pick = 'starter30';
    if (a.trains === 'never') reasons.push('You are not training regularly yet, so 30 days of turning up is worth more than 75 days of restarting.');
    if (a.minutes < 45) reasons.push('Under 45 minutes a day rules out the longer challenges honestly.');
    if (a.miss === 'quit') reasons.push('You said missing a day usually ends it for you. Recovery passes exist for exactly that.');
  } else {
    reasons.push(`About ${a.minutes} minutes a day fits one structured session plus movement.`);
    reasons.push('You want structure without a restart wiping seven weeks of work.');
    if (a.trains === 'some') reasons.push('Training some weeks is the pattern this is built to make consistent.');
  }

  if (a.blocked && pick === 'hard75') {
    pick = 'balanced75';
    reasons.length = 0;
    reasons.push('You reported something that needs looking at before hard training, so the strict version is not on the table yet.');
  }
  const alt = pick === 'hard75' ? 'balanced75' : pick === 'starter30' ? 'balanced75' : 'starter30';
  return { pick, alt, reasons };
}

function waterTarget() {
  const r = R(), w = P().weightKg;
  if (state.waterMode === 'weight' && w) return Math.round(Math.max(2000, Math.min(5000, w * 40)) / 250) * 250;
  return r.water;
}

/* ============================================================
   PROFILE — one source of truth
   Everything that describes the person lives here. The wizards
   are editors of this object, not owners of their own copies.
   ============================================================ */
const PROFILE_GOALS = {
  fat:        { n: 'Lose fat',        nut: 'fat',        tr: 'fat' },
  muscle:     { n: 'Build muscle',    nut: 'muscle',     tr: 'muscle' },
  strength:   { n: 'Build strength',  nut: 'muscle',     tr: 'strength' },
  fitness:    { n: 'Improve fitness', nut: 'fitness',    tr: 'cardio' },
  health:     { n: 'General health',  nut: 'health',     tr: 'health' },
  energy:     { n: 'More energy',     nut: 'energy',     tr: 'health' },
  bloodsugar: { n: 'Blood sugar',     nut: 'bloodsugar', tr: 'health' },
  heart:      { n: 'Heart health',    nut: 'heart',      tr: 'cardio' }
};

function P() { return state.profile || (state.profile = {}); }
const profileComplete = () => { const p = P(); return !!(p.sex && p.age && p.heightCm && p.weightKg); };
const nutGoal = () => (PROFILE_GOALS[P().goal] || PROFILE_GOALS.health).nut;
const trGoal  = () => (PROFILE_GOALS[P().goal] || PROFILE_GOALS.health).tr;

/* Older saves kept the same facts in three places. Pull them into
   one object once, then never read the old locations again. */
function migrateProfile() {
  const p = P();
  const n = state.nutrition || {}, t = state.training || {};
  if (p.name == null && state.name) p.name = state.name;
  if (p.sex == null) p.sex = n.sex || 'f';
  if (p.age == null && n.age) p.age = n.age;

  switch (t.kind) {

    case 'outdoor': return sessions(d).some(s => s.outdoor && s.minutes >= r.minutes);
    case 'movement': return sessions(d).reduce((a, s) => a + (s.minutes || 0), 0) >= (r.minutes + (r.moveMinutes || 0));
    case 'steps': return (D(d).steps || 0) >= r.steps;
    case 'pages': return pagesRead(d) >= r.pages;

/* Two payloads. The full one carries the plans and goals. The reduced
   one is only the columns that existed in the original schema, so a
   database that has not had the later patches applied still saves the
   basics rather than rejecting everything. */
function profileRow(reduced) {
  const core = {
    id: cloud.uid, display_name: P().name || state.name || 'You', mode: state.mode,
    rules: challengeId() === 'custom' ? (state.rules || null) : null,

    calorie_target: state.calorieTarget, run_start: state.runStart,
    resets: state.resets, longest: state.longest,
    updated_at: new Date().toISOString()
  };
  if (reduced) return core;
  return Object.assign(core, {
    goals: state.goals || [], challenge: challengeId(), vision: state.vision || '',
    profile: P(), history: state.history || [],
    nutrition: state.nutrition || null, training: state.training || null
  });
}
async function pushProfile(reduced) {
  await rest('profiles?on_conflict=id', {
    method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: [profileRow(reduced)]
  });
}

async function push() {
  if (!cloudOn()) return;
  syncState = 'busy'; syncMsg = 'Saving';
  const dates = Array.from(dirty);
  try {
    try {
      await pushProfile();
    } catch (e) {
      // A missing column rejects the whole row. Save what the schema
      // does have, and say plainly which patch is missing.
      const msg = String(e.message || '');
      const col = (msg.match(/column "?([a-z_]+)"? of relation/) || msg.match(/'([a-z_]+)' column/) || [])[1];
      await pushProfile(true);
      syncState = 'err';
      syncMsg = col
        ? `Your database is missing the "${col}" column, so plans and goals are not syncing. Run the latest SQL patch in Supabase.`
        : 'Some settings are not syncing. Run the latest SQL patch in Supabase.';
      throw new Error('schema');
    }
    if (booksDirty) {
      for (const b of state.books || []) {
        if (b.id) {
          await rest(`books?id=eq.${b.id}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' },
            body: { title: b.title, total_pages: b.pages || 0 } });
        } else {
          const [row] = await rest('books', { method: 'POST', headers: { Prefer: 'return=representation' },
            body: [{ user_id: cloud.uid, title: b.title, total_pages: b.pages || 0 }] });
          if (row) b.id = row.id;
        }
      }
      booksDirty = false;
    }

    for (const d of dates) {
      const x = D(d);
      await rest('days?on_conflict=user_id,day', {
        method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: [{ user_id: cloud.uid, day: d, diet: !!x.diet, water_ml: x.waterMl || 0,
          protein_g: x.protein || 0, calories: x.calories || 0, mood: x.mood || null,
          weight_kg: x.weightKg || null, measurements: x.meas || {}, has_photo: !!x.photo,
          updated_at: new Date().toISOString() }]
      });
      await rest(`workouts?user_id=eq.${cloud.uid}&day=eq.${d}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
      const ws = (x.sessions || []).map(s => ({ user_id: cloud.uid, day: d, name: s.name || null, minutes: s.minutes, outdoor: !!s.outdoor }));
      if (ws.length) await rest('workouts', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: ws });

      await rest(`reads?user_id=eq.${cloud.uid}&day=eq.${d}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
      const rs = (x.reads || []).map(r => ({ user_id: cloud.uid, day: d,
        book_id: r.book >= 0 && state.books[r.book] ? state.books[r.book].id : null, pages: r.pages }));
      if (rs.length) await rest('reads', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: rs });
      dirty.delete(d);
    }
    await publish();
    syncState = 'ok'; syncMsg = 'Synced';
  } catch (e) {
    if (String(e.message) !== 'schema') { syncState = 'err'; syncMsg = 'Saved on this device. Will retry.'; }
  }
  if (tab === 'settings') render();
}

/* ---------- run integrity ---------- */
function audit() {
  broken = null;
  if (!state.runStart) return;
  // Only the strict policy stops a run. The others let it continue and
  // keep the record honest instead of pretending nothing happened.
  if (R().restart !== 'restart') return;
  const c = cutoff();
  for (let i = 0; i < TOTAL; i++) {
    const d = addDays(state.runStart, i);
    if (between(d, c) <= 0) break;
    if (!complete(d)) { broken = { date: d, day: i+1, missed: tasks().filter(t => !isDone(d, t)) }; return; }
  }
}
/* Ending a run archives it. Nothing is silently overwritten, because
   a challenge you quit on day 40 is still information worth keeping. */
function endChallenge(outcome) {
  if (!state.runStart) return;
  const n = Math.min(dayOf(today()), TOTAL);
  let done = 0;
  for (let i = 0; i < n; i++) if (complete(addDays(state.runStart, i))) done++;
  state.history = (state.history || []).concat([{
    challenge: challengeId(), name: CH().name, start: state.runStart, end: today(),
    reachedDay: n, totalDays: TOTAL, completeDays: done,
    consistency: n > 0 ? Math.round(done / n * 100) : 0, outcome
  }]);
  state.longest = Math.max(state.longest || 0, done);
  state.runStart = null; state.log = {}; reportText = null; wasComplete = false;
  save();
}

function startRun(from) { syncChallenge(); state.runStart = from; state.log = {}; reportText = null; state.onboarded = true; save(); render(); }
function resetRun(reached) {
  undoSnap = JSON.parse(JSON.stringify(state));
  state.longest = Math.max(state.longest || 0, reached || 0);
  state.resets = (state.resets || 0) + 1;
  wasComplete = false;
  startRun(today());
  toast(`Back to day 1. Day ${reached} logged as a restart.`);
}

        day: r.day_number, checks: r.checks || [], done: r.done, of: r.of_total,
        broken: r.broken, started: r.started, best: r.best, resets: r.resets,
        updated: new Date(r.updated_at).getTime() }))
        .sort((a, b) => b.day - a.day || a.name.localeCompare(b.name));
      const nd = await rest(`nudges?to_user=eq.${cloud.uid}&read_at=is.null&select=*&order=created_at.desc&limit=5`);
      myNudges = (nd || []).map(x => ({ id: x.id, v: { from: x.from_name, text: x.body, ts: new Date(x.created_at).getTime() } }));
    } catch (e) { /* keep whatever is on screen */ }
    return;
  }
  if (!state.crew) return;
  const keys = await S.keys(`sqd:${state.crew}:m:`, true);
  crew = (await Promise.all(keys.map(k => S.get(k, true)))).filter(Boolean)
    .sort((a, b) => b.day - a.day || a.name.localeCompare(b.name));
  const nk = await S.keys(`sqd:${state.crew}:n:${slug(state.name)}:`, true);
  myNudges = (await Promise.all(nk.map(async k => ({ k, v: await S.get(k, true) }))))
    .filter(x => x.v).sort((a, b) => b.v.ts - a.v.ts).slice(0, 5);
}

  if (!cloudOn()) {
    state.pendingCrew = code; await save();

  try {

function pickPhoto(date) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.onload = async () => {
      const max = 520, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/jpeg', 0.72);
      const ok = await savePhoto(date, data);
      if (!ok) return toast('Photo too large to save.', false);
      put(date, { photo: true });
      await save(); render();
    }; img.src = fr.result; };
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* ---------- streaks and week ---------- */
function currentStreak() {
  if (!state.runStart) return 0;
  let n = 0, d = complete(today()) ? today() : addDays(today(), -1);
  while (state.log[d] && complete(d) && between(state.runStart, d) >= 0) { n++; d = addDays(d, -1); }
  return n;
}
function weekStats() {
  const rows = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(today(), -i);
    rows.push({ d, done: countDone(d), of: tasks().length, water: waterMl(d),
      protein: D(d).protein || 0, calories: D(d).calories || 0,
      minutes: sessions(d).reduce((a, s) => a + (s.minutes||0), 0), pages: pagesRead(d),
      mood: D(d).mood || null, weight: D(d).weightKg || null });
  }
  return rows;
}

/* ---------- coach ---------- */
/* ============================================================
   COACH — computed from your own log. No API, no cost, instant,
   works offline. Every sentence below is derived from numbers
   already in the app.
   ============================================================ */

function weakestCheck() {
  const ts = tasks(), w = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(today(), -i);
    if (!state.runStart || between(state.runStart, d) < 0) continue;
    w.push(d);
  }
  if (!w.length) return null;
  let worst = null;
  ts.forEach(t => {
    const misses = w.filter(d => !isDone(d, t)).length;
    if (!worst || misses > worst.misses) worst = { task: t, misses, of: w.length };
  });
  return worst && worst.misses > 0 ? worst : null;
}

function localCoach() {
  const t = today(), n = dayOf(t), r = R(), ts = tasks();
  const hour = new Date().getHours();
  const open = ts.filter(x => !isDone(t, x));
  const done = ts.length - open.length;
  const streak = currentStreak();
  const lines = [];

  if (!state.runStart) return 'Nothing to read yet. Start day 1 and the first review lands after a few days of data.';

  if (broken) {
    return `The run broke on day ${broken.day} because ${broken.missed.map(x => x.label.toLowerCase()).join(' and ')} went unlogged. Day 1 starts again today. The thing that actually helps is logging each check the moment it is done rather than at bedtime.`;
  }

  /* what is still open, and how urgent that is */
  if (open.length === 0) {
    lines.push(`Day ${n} is closed with everything logged.`);
  } else {
    const names = open.map(x => x.label.toLowerCase());
    const outdoorOpen = open.some(x => x.kind === 'outdoor');
    const waterGap = waterTarget() - waterMl(t);
    if (hour >= 19 && open.length > 1) {
      lines.push(`It is ${hour}:00 and ${open.length} checks are still open: ${names.join(', ')}. Pick the one that takes longest and start it now.`);
    } else if (outdoorOpen && hour >= 16) {
      lines.push(`The outdoor session is still open and daylight is going. That is the check most runs die on.`);
    } else {
      lines.push(`${done} of ${ts.length} done. Still open: ${names.join(', ')}.`);
    }
    if (waterGap > 0 && hour >= 17) {
      lines.push(`Water is ${(waterGap/1000).toFixed(1)} litres short with a few hours left, which is about ${Math.ceil(waterGap/250)} glasses.`);
    }
  }

  /* the pattern across the week */
  const weak = weakestCheck();
  if (weak) {
    lines.push(`Across the last ${weak.of} days, ${weak.task.label.toLowerCase()} was the check you missed most, ${weak.misses} times. That is the one to plan around rather than hope for.`);
  }

  /* workout load */
  const w = weekStats();
  const mins = w.reduce((a, x) => a + x.minutes, 0);
  const need = r.sessions * r.minutes * 7;
  if (mins > 0 && mins < need * 0.8) {
    lines.push(`You logged ${mins} workout minutes this week against ${need} the rule asks for.`);
  }

  /* protein, only if being tracked */
  const pDays = w.filter(x => x.protein > 0);
  if (pDays.length >= 3) {
    const avg = Math.round(pDays.reduce((a, x) => a + x.protein, 0) / pDays.length);
    if (avg < state.proteinTarget * 0.85) {
      lines.push(`Protein averaged ${avg} g against your ${state.proteinTarget} g target. Two workouts a day on a shortfall is how strength stalls.`);
    }
  }

  /* streak framing */
  if (streak >= 7 && open.length === 0) lines.push(`${streak} clean days in a row.`);
  else if (n <= 3) lines.push(`Week one is where most runs end. Nothing matters yet except closing today.`);

  return lines.slice(0, 4).join(' ');
}

function runCoach() {
  state.coach = { date: today(), text: localCoach() };
  save(); render();
}

/* ---------- weekly review ---------- */
function localReport() {
  const w = weekStats(), of = tasks().length, r = R();
  const perfect = w.filter(x => x.done === of).length;
  const mins = w.reduce((a, x) => a + x.minutes, 0);
  const pages = w.reduce((a, x) => a + x.pages, 0);
  const waterHit = w.filter(x => x.water >= waterTarget()).length;
  const pDays = w.filter(x => x.protein > 0);
  const avgP = pDays.length ? Math.round(pDays.reduce((a, x) => a + x.protein, 0) / pDays.length) : null;
  const weights = w.filter(x => x.weight);
  const moods = w.filter(x => x.mood);
  const out = [];

  out.push(`${perfect} of the last 7 days were complete, with ${mins} workout minutes and ${pages} pages read.`);
  out.push(`Water hit target on ${waterHit} of 7 days.`);

  const weak = weakestCheck();
  if (weak) out.push(`${weak.task.label} was the weak check, missed ${weak.misses} times.`);
  else if (perfect === 7) out.push(`Nothing was missed.`);

  if (avgP !== null) {
    out.push(avgP >= state.proteinTarget
      ? `Protein averaged ${avgP} g, at or above your ${state.proteinTarget} g target.`
      : `Protein averaged ${avgP} g against a ${state.proteinTarget} g target, short by about ${state.proteinTarget - avgP} g a day.`);
  }

  if (weights.length >= 2) {
    const d = Math.round((weights[weights.length-1].weight - weights[0].weight) * 10) / 10;
    out.push(`Weight moved ${d > 0 ? 'up' : 'down'} ${Math.abs(d)} kg across ${weights.length} weigh-ins.`);
  }
  if (moods.length >= 3) {
    const avg = (moods.reduce((a, x) => a + x.mood, 0) / moods.length).toFixed(1);
    const low = moods.filter(x => x.mood <= 2).length;
    out.push(low >= 2
      ? `Mood averaged ${avg} out of 5 with ${low} low days, which usually tracks sleep and food rather than effort.`
      : `Mood averaged ${avg} out of 5.`);
  }

  /* one concrete adjustment */
  if (perfect === 7) out.push(`Nothing needs changing. Hold this pattern.`);
  else if (weak && weak.task.kind === 'outdoor') out.push(`Next week, fix the outdoor session by putting it in the morning, before the day fills up.`);
  else if (weak && weak.task.kind === 'water') out.push(`Next week, front-load water. Two litres before midday makes the rest trivial.`);
  else if (weak && weak.task.kind === 'pages') out.push(`Next week, read the ${r.pages} pages first thing rather than last thing.`);
  else if (weak) out.push(`Next week, schedule ${weak.task.label.toLowerCase()} at a fixed time instead of fitting it in.`);

  return out.join(' ');
}

function runReport() { reportText = localReport(); render(); }

/* ---------- goal plans ---------- */
function localGoalPlan(g) {
  const p = goalProgress(g), dl = daysLeft(g), r = R();
  const out = [];

  if (p.pct >= 1) return `Target already reached. Set a new one, or extend this deadline and push the number.`;
  if (dl === null) return `${p.line} Add a deadline and the required rate can be worked out.`;
  if (dl <= 0) return `${p.line} The deadline has passed. Move it and the pacing recalculates.`;

  out.push(p.line);
  if (p.sub) out.push(p.sub);

  if (g.type === 'weight') {
    const last = latestEntry(g);
    const perWeek = Math.abs((last ? last.value : g.start) - g.target) / Math.max(dl / 7, 0.15);
    if (perWeek > 1) out.push(`That rate is faster than 1 kg a week, which on two workouts a day usually costs muscle and energy. Moving the deadline out is the honest fix.`);
    else if (perWeek < 0.2) out.push(`That rate is gentle enough that consistency matters more than any diet change.`);
    else out.push(`That rate is sustainable alongside the challenge. Keep protein at ${state.proteinTarget} g and let the training do the rest.`);
    out.push(`Weigh in ${g.cadence === 7 ? 'weekly' : g.cadence === 14 ? 'fortnightly' : 'monthly'}, same time, same conditions. Daily numbers are mostly water.`);
  }

  if (g.type === 'book') {
    const b = state.books[g.bookIndex];
    const left = b ? Math.max(0, b.pages - b.read) : 0;
    const perDay = Math.ceil(left / dl);
    out.push(perDay <= r.pages
      ? `Your daily rule of ${r.pages} pages already clears this with room to spare.`
      : `That is ${perDay - r.pages} pages a day beyond the ${r.pages} the rule asks for, so add one longer sitting a week rather than stretching every day.`);
  }

  if (g.type === 'fitness') {
    const wks = Math.max(dl / 7, 0.15);
    const last = latestEntry(g), now = last ? last.value : g.start;
    if (!g.lowerIsBetter && now) {
      out.push(`Build the long one by about 10% a week and leave the rest easy. From ${Math.round(now * 10) / 10} ${g.unit || ''} that means ${Math.round(now * 1.1 * 10) / 10} next week, not a fixed amount added every day.`);
    } else {
      out.push(`Make one session a week the quality one, at or near target pace, and keep everything else easy. Speed comes from the easy volume underneath it, not from trying hard more often.`);
    }
    out.push(`With ${Math.floor(wks)} weeks left and two daily workouts already, recovery is the limit rather than effort. One hard session a day at most.`);
  }

  return out.join(' ');
}

function goalPlan(g) { g.plan = localGoalPlan(g); save(); render(); }

/* ---------- toast ---------- */
function toast(msg, undoable = true) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastAct').style.display = undoable && undoSnap ? '' : 'none';
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('on'); undoSnap = null; }, 6000);
}
document.getElementById('toastAct').onclick = () => {
  if (!undoSnap) return;
  state = undoSnap; undoSnap = null;
  document.getElementById('toast').classList.remove('on');
  save(); render();
};

function openMember(uid) {
  viewUid = uid; memberData = null; tab = 'member'; render();
  loadMember(uid).then(render);
}

/* ---------- pages ---------- */
function pgInbox() {
  const out = [];
  if (!cloudOn() || !state.crew) {
    out.push(el(`<div class="card"><div class="head"><h2>Inbox</h2></div>
      <div class="set"><div class="h">Nudges and messages arrive here once you are signed in and in a crew.</div></div></div>`));
    return out;
  }
  const c = el(`<div class="card"><div class="head"><h2>Inbox</h2>
    <span class="meta">${inboxUnread ? inboxUnread + ' unread' : 'All read'}</span></div></div>`);
  if (!inbox.length) {
    c.appendChild(el(`<div class="set"><div class="h">Nothing yet. Nudges and messages from your crew land here.</div></div>`));
  }
  inbox.forEach(x => {
    const label = x.kind === 'nudge' ? `${x.from.split(' ')[0]} ${x.body}`
      : x.kind === 'broadcast' ? `${x.from.split(' ')[0]} to the crew` : `${x.from.split(' ')[0]}`;
    const row = el(`<div class="mrow" style="${x.read ? 'opacity:.62' : ''}">
      <span class="av">${esc(x.from.slice(0,1).toUpperCase())}</span>
      <span class="who"><span class="nm">${esc(label)}${x.read ? '' : ' <em style="color:var(--brand)">new</em>'}</span>
      <span class="amt">${x.kind === 'nudge' ? '' : esc(x.body.slice(0, 90)) + ' · '}${ago(x.ts)}</span></span>
      <button class="pill">Open</button></div>`);
    row.querySelector('button').onclick = () => openMember(x.uid);
    c.appendChild(row);
  });
  if (inbox.length) {
    const f = el(`<div class="set"><div class="btnrow">
      <button class="act sm ghost" id="mr">Mark all read</button>
      <button class="act sm ghost" id="rf">Refresh</button></div></div>`);
    f.querySelector('#mr').onclick = markInboxRead;
    f.querySelector('#rf').onclick = async () => { await loadInbox(); render(); };
    c.appendChild(f);
  }
  out.push(c);

  const bc = el(`<div class="card"><div class="head"><h2>Message the crew</h2></div>
    <div class="set"><textarea class="fld" id="bm" rows="2" placeholder="Say something to everyone"></textarea>
    <div class="btnrow"><button class="act sm" id="bs">Send to crew</button></div></div></div>`);
  bc.querySelector('#bs').onclick = async () => {
    const v = bc.querySelector('#bm').value;
    if (!v.trim()) return;
    await sendMessage(null, v);
    bc.querySelector('#bm').value = '';
    toast('Sent to the crew.', false);
  };
  out.push(bc);
  return out;
}

function pgMember() {
  const out = [];
  const back = el(`<div class="btnrow" style="margin:0 0 12px"><button class="act sm ghost">Back to crew</button></div>`);
  back.querySelector('button').onclick = () => { tab = 'crew'; viewUid = null; memberData = null; render(); };
  out.push(back);

  if (!memberData) { out.push(el(`<div class="card"><div class="set"><div class="h"><span class="spin"></span> Loading.</div></div></div>`)); return out; }
  const st = memberData.status;
  const nm = st ? st.display_name : 'Member';
  const me = viewUid === cloud.uid;

  const head = el(`<div class="card"><div class="head"><h2>${esc(nm)}</h2>
    <span class="meta">${st ? esc(st.mode) : ''}</span></div>
    <div class="stats">
      <div class="stat"><div class="v">${st ? st.day_number : 0}</div><div class="k">Day</div></div>
      <div class="stat"><div class="v">${st ? st.streak : 0}</div><div class="k">Streak</div></div>
      <div class="stat"><div class="v">${st ? st.perfect_days : 0}</div><div class="k">Perfect</div></div>
      <div class="stat"><div class="v">${st ? st.resets : 0}</div><div class="k">Restarts</div></div>
      <div class="stat"><div class="v">${st ? st.total_minutes : 0}</div><div class="k">Workout min</div></div>
      <div class="stat"><div class="v">${st ? st.outdoor_count : 0}</div><div class="k">Outdoor</div></div>
      <div class="stat"><div class="v">${st ? st.total_pages : 0}</div><div class="k">Pages</div></div>
      <div class="stat"><div class="v">${st ? st.done + '/' + st.of_total : '0'}</div><div class="k">Today</div></div>
    </div>
    ${st && st.broken ? '<div class="set"><div class="h" style="color:var(--red)">Restarting after a broken run.</div></div>' : ''}
    ${st && st.run_start ? `<div class="set"><div class="h">Started ${pretty(st.run_start)}.</div></div>` : ''}</div>`);
  out.push(head);

  const bk = el(`<div class="card"><div class="head"><h2>Reading</h2>
    <span class="meta">${memberData.books.length} ${memberData.books.length === 1 ? 'book' : 'books'}</span></div></div>`);
  if (!memberData.books.length) bk.appendChild(el(`<div class="set"><div class="h">No books shared. Book sharing can be switched off in Settings, so an empty list may be a choice rather than an absence.</div></div>`));
  memberData.books.forEach(b => {
    const pct = b.total_pages ? Math.min(100, Math.round(b.pages_read / b.total_pages * 100)) : 0;
    bk.appendChild(el(`<div class="set"><div class="t">${esc(b.title)}${pct >= 100 ? ' 📚' : ''}</div>
      <div class="h">${b.pages_read} of ${b.total_pages} pages · ${pct}%</div>
      <div class="prog">${Array.from({length:20},(_,k)=>`<span class="${k < Math.round(pct/5)?'on':''}"></span>`).join('')}</div></div>`));
  });
  out.push(bk);

  const ph = el(`<div class="card"><div class="head"><h2>Shared photos</h2>
    <span class="meta">${feed.length} ${feed.length === 1 ? 'post' : 'posts'}</span></div></div>`);
  if (!feed.length) ph.appendChild(el(`<div class="set"><div class="h">Nothing shared yet. Progress photos stay private and never appear here. Only posts made from the Crew tab are visible.</div></div>`));
  feed.forEach(p => {
    const row = el(`<div class="set">
      <div class="t">${esc(p.name.split(' ')[0])} · ${esc(p.kind)}</div>
      <div class="h">${esc(p.caption || '')}${p.caption ? ' · ' : ''}${ago(p.ts)}</div>
      ${p.url ? `<img src="${p.url}" alt="Shared ${esc(p.kind)}" style="width:100%;border-radius:12px;margin-top:9px;display:block">` : ''}
      ${p.uid === cloud.uid ? '<div class="btnrow"><button class="act sm ghost">Delete</button></div>' : ''}</div>`);
    const d = row.querySelector('button');
    if (d) d.onclick = () => deletePost(p.id);
    ph.appendChild(row);
  });
  out.push(ph);

  if (!me) {
    const th = el(`<div class="card"><div class="head"><h2>Messages</h2>
      <span class="meta">${esc(nm.split(' ')[0])}</span></div></div>`);
    if (!memberData.thread.length) th.appendChild(el(`<div class="set"><div class="h">No messages yet.</div></div>`));
    memberData.thread.forEach(m => th.appendChild(el(`<div class="set" style="border-top:1px solid var(--line)">
      <div class="coach" style="padding:0"><div class="bubble" style="${m.mine ? 'background:var(--brand-soft);color:#0B3B3A' : ''}">${esc(m.body)}</div></div>
      <div class="amt">${m.mine ? 'You' : esc(m.from.split(' ')[0])} · ${ago(m.ts)}</div></div>`)));
    const f = el(`<div class="set"><textarea class="fld" id="mb" rows="2" placeholder="Write a message"></textarea>
      <div class="btnrow"><button class="act sm" id="ms">Send</button>
      <button class="act sm ghost" id="mn">Nudge instead</button></div></div>`);
    f.querySelector('#ms').onclick = async () => {
      const v = f.querySelector('#mb').value;
      if (!v.trim()) return;
      await sendMessage(viewUid, v);
      toast('Message sent.', false);
    };
    f.querySelector('#mn').onclick = () => nudge({ name: nm, uid: viewUid });
    th.appendChild(f);
    out.push(th);
  }
  return out;
}

function shareCard() {
  let pending = null, kind = 'meal';
  const c = el(`<div class="card"><div class="head"><h2>Share with your crew</h2>
    <span class="meta">${postBusy ? 'Posting' : 'Visible to members only'}</span></div>
    <div class="set">
      <div class="h">A meal, a workout, or a note. This is separate from your progress photos, which stay private to you.</div>
      <div class="seg" id="kd">
        <button type="button" data-k="meal" aria-pressed="true">Meal</button>
        <button type="button" data-k="workout" aria-pressed="false">Workout</button>
        <button type="button" data-k="progress" aria-pressed="false">Progress</button>
        <button type="button" data-k="note" aria-pressed="false">Note</button>
      </div>
      <input class="fld" id="cp" placeholder="Caption, optional" style="margin-top:10px">
      <div class="btnrow"><button class="act sm ghost" id="pk">Choose photo</button>
      <button class="act sm" id="sp">Share</button></div>
      <div class="h" id="st" style="margin-top:9px"></div>
    </div></div>`);
  c.querySelectorAll('#kd button').forEach(b => b.onclick = () => {
    kind = b.dataset.k;
    c.querySelectorAll('#kd button').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === kind));
  });
  c.querySelector('#pk').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const img = new Image(), fr = new FileReader();
      fr.onload = () => { img.onload = () => {
        const max = 720, sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        pending = cv.toDataURL('image/jpeg', 0.72);
        c.querySelector('#st').textContent = 'Photo ready. Add a caption and tap Share.';
      }; img.src = fr.result; };
      fr.readAsDataURL(f);
    };
    inp.click();
  };
  c.querySelector('#sp').onclick = async () => {
    const cap = c.querySelector('#cp').value.trim();
    if (!pending && !cap) { c.querySelector('#st').textContent = 'Add a photo or a caption first.'; return; }
    await sharePost(kind, cap, pending);
  };
  return c;
}

  return el(`<div style="margin-bottom:16px">

    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">

  const c = CHALLENGES[id];
  if (c.restart === 'restart') return 'One missed check sends the run back to day 1. Nothing carries over.';
  if (c.restart === 'passes') return `${c.passes} missed days are forgiven. Past that the run keeps going and the record shows what happened.`;
  return 'A missed day is marked missed. The run continues, and consistency is measured across the whole thing.';
}

        <div class="h" style="font-size:14px;margin-top:12px">Pick a challenge, commit to it for a fixed number of days, and let the app work out the training and the food around your life. Three to choose from, and one of them will suit you far better than the other two.</div>
      </div>
      <div class="set"><div class="t">75 Hard</div>
        <div class="h">Six checks a day for 75 days. One missed check and you start again at day 1. Strict on purpose.</div></div>
      <div class="set"><div class="t">75 Balanced</div>
        <div class="h">The same length, the same habits, no restart. A missed day is marked missed and the run carries on.</div></div>
      <div class="set"><div class="t">30-Day Starter</div>
        <div class="h">Thirty days, one activity, three recovery passes. For proving you turn up before committing to anything longer.</div></div>
      <div class="set"><div class="t">What the app does either way</div>
        <div class="h">Builds your training from what you can sustain and what equipment you have, works out your calories and protein, plans meals and a shopping list, and holds you to whichever rules you chose.</div>
        <div class="btnrow"><button class="act" id="n">Get started</button></div></div></div>`);
    c.querySelector('#n').onclick = () => { obStep = 1; render(); };
    out.push(c);
    return out;
  }

  /* ---------- 1. account ---------- */
  if (obStep === 1) {
    const on = cloudOn();
    const c = el(`<div class="card"><div class="head"><h2>Sign in or create an account</h2>
      <span class="meta">${on ? 'Signed in' : 'Needed for a crew'}</span></div>
      ${on ? `<div class="set"><div class="t">Signed in as ${esc(cloud.email)}</div>
        <div class="h">Your log, crew, and photos now follow you to any device.</div>
        <div class="btnrow"><button class="act" id="n">Continue</button>
        <button class="act sm ghost" id="so">Use a different account</button></div></div>`
      : `<div class="set">
        <div class="h">New here or coming back, same two boxes. An account syncs your plans across devices and is what lets a crew see each other.</div>
        <label class="f" style="margin-top:10px"><span>Email address</span>
          <input class="fld" id="e" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com"></label>
        <label class="f" style="margin-top:9px"><span>Password</span>
          <input class="fld" id="p" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>
        <div class="btnrow"><button class="act" id="su">Create account</button>
        <button class="act" id="si" style="background:var(--card);color:var(--brand);border:1px solid var(--brand)">Sign in</button></div>
        ${obErr ? `<div class="h" style="color:var(--red);margin-top:10px">${esc(obErr)}</div>` : ''}
        ${obBusy ? '<div class="h" style="margin-top:10px"><span class="spin"></span> Connecting.</div>' : ''}
        <div class="h" style="margin-top:14px">Or <button class="act sm ghost" id="skip" style="margin:0;padding:6px 12px">carry on without an account</button> and add one later. A crew will not work until you do.</div>
      </div>`}
      </div>`);

    if (on) {
      c.querySelector('#n').onclick = () => { obStep = 2; render(); };
      c.querySelector('#so').onclick = async () => { await signOut(); render(); };
      out.push(c);
      return out;
    }
    const go = async kind => {
      const email = c.querySelector('#e').value.trim(), pw = c.querySelector('#p').value;
      if (!email) { obErr = 'Enter your email address.'; render(); return; }
      if (!EMAIL_RE.test(email)) { obErr = 'That is not an email address. It needs an @ and a domain, like you@gmail.com.'; render(); return; }
      if (!pw) { obErr = 'Enter a password.'; render(); return; }
      if (pw.length < 6) { obErr = 'Password needs at least 6 characters.'; render(); return; }
      obErr = ''; obBusy = true; render();
      try {
        await auth(kind, cloud.url, cloud.key, email, pw, state.name);
        await pull(); await pullPhotos();
        obBusy = false; obStep = 2; render();
      } catch (e) { obBusy = false; obErr = e.message.slice(0, 140); render(); }
    };
    c.querySelector('#su').onclick = () => go('up');
    c.querySelector('#si').onclick = () => go('in');
    c.querySelector('#skip').onclick = () => { obStep = 2; render(); };
    out.push(c);
    return out;
  }

  /* ---------- 2. you ---------- */
  if (obStep === 2) {
    const c = el(`<div class="card"><div class="head"><h2>About you</h2></div>
      <div class="set"><div class="t">Your name</div>
        <div class="h">Shown to your crew next to your day count.</div>
        <input class="fld" id="nm" placeholder="Your name" value="${esc(P().name || state.name || '')}" autocomplete="off"></div>
      <div class="set"><div class="t">Body weight</div>
        <div class="h">Optional. Only used to scale the water target at 40 ml per kilogram. Leave it blank to use the fixed rule figure.</div>
        <input class="fld" id="wt" type="number" inputmode="decimal" placeholder="kg" value="${P().weightKg || ''}"></div>
      <div class="set"><div class="t">Mode</div>
        <div class="h">75 Hard is the strict original, six checks a day. 75 Soft relaxes it to one workout, 3 litres, any book, and social drinking, four checks a day. Custom lets you set your own.</div>
        <div class="seg" id="md">${Object.keys(CHALLENGES).map(k => `<button type="button" data-m="${k}" aria-pressed="${challengeId() === k}">${CHALLENGES[k].name}</button>`).join('')}</div>
        <div class="btnrow"><button class="act" id="n">Continue</button>
        <button class="act ghost" id="b">Back</button></div></div></div>`);
    c.querySelectorAll('#md button').forEach(b => b.onclick = () => {
      state.challenge = b.dataset.m; syncChallenge();
      c.querySelectorAll('#md button').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === challengeId()));
    });
    c.querySelector('#n').onclick = async () => {
      const v = c.querySelector('#nm').value.trim();
      if (!v) { c.querySelector('#nm').focus(); toast('Enter your name.', false); return; }
      setName(v);
      const w = parseFloat(c.querySelector('#wt').value);
      if (w > 25 && w < 300) { setWeight(w); state.waterMode = 'weight'; }
      await save();
      obStep = 3; render();
    };
    c.querySelector('#b').onclick = () => { obStep = 1; render(); };
    out.push(c);
    return out;
  }

  /* ---------- 3. challenge ---------- */
  if (obStep === 3) {
    if (!obPick) {
      const c = el(`<div class="card"><div class="head"><h2>Which challenge</h2>
        <span class="meta">5 questions</span></div>
        <div class="set"><div class="t">How much time a day, realistically</div>
          <div class="seg" id="q1">${[[30,'Under 45 min'],[60,'About an hour'],[100,'Around 100 min'],[140,'Two hours or more']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${obAns.minutes===v}">${l}</button>`).join('')}</div></div>
        <div class="set"><div class="t">How often do you train now</div>
          <div class="seg" id="q2">${[['never','Rarely or never'],['some','Some weeks'],['often','Most weeks']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${obAns.trains===v}">${l}</button>`).join('')}</div></div>
        <div class="set"><div class="t">Strict rules or flexibility</div>
          <div class="seg" id="q3">${[['strict','Strict, no exceptions'],['balanced','Structured but forgiving'],['flexible','As flexible as possible']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${obAns.strict===v}">${l}</button>`).join('')}</div></div>
        <div class="set"><div class="t">When you miss a day, what usually happens</div>
          <div class="seg" id="q4" style="flex-direction:column;align-items:stretch">${[['continue','I pick it up the next day'],['wobble','It takes me a few days to get back'],['quit','That is usually the end of it']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${obAns.miss===v}" style="text-align:left">${l}</button>`).join('')}</div></div>
        <div class="set"><div class="t">Could you accept starting over at day 1 after one slip</div>
          <div class="seg" id="q5">${[[1,'Yes'],[0,'No']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${obAns.restartOk===!!v}">${l}</button>`).join('')}</div>
          <div class="btnrow"><button class="act" id="go">Show me the fit</button>
          <button class="act ghost" id="sk">Let me just choose</button></div></div></div>`);
      const bind = (sel, key, num) => c.querySelectorAll(sel + ' button').forEach(b => b.onclick = () => {
        obAns[key] = num ? (key === 'restartOk' ? b.dataset.v === '1' : +b.dataset.v) : b.dataset.v;
        c.querySelectorAll(sel + ' button').forEach(x => x.setAttribute('aria-pressed',
          num ? (key === 'restartOk' ? (x.dataset.v === '1') === obAns.restartOk : +x.dataset.v === obAns[key]) : x.dataset.v === obAns[key]));
      });
      bind('#q1', 'minutes', true); bind('#q2', 'trains'); bind('#q3', 'strict'); bind('#q4', 'miss'); bind('#q5', 'restartOk', true);
      c.querySelector('#go').onclick = () => {
        obAns.blocked = !!(state.training && state.training.program && state.training.program.blocked);
        obPick = recommendChallenge(obAns); render();
      };
      c.querySelector('#sk').onclick = () => { obPick = { pick: 'hard75', alt: 'balanced75', reasons: [] }; render(); };
      out.push(c);
      return out;
    }

    const rec = CHALLENGES[obPick.pick];
    const c = el(`<div class="card"><div class="head"><h2>Recommended: ${esc(rec.name)}</h2>
      <span class="meta">${rec.days} days</span></div>
      <div class="set"><div class="h">${esc(rec.blurb)}</div></div>
      ${obPick.reasons.length ? `<div class="set"><div class="t">Why this one</div>
        ${obPick.reasons.map(r => `<div class="h">· ${esc(r)}</div>`).join('')}</div>` : ''}
      <div class="set"><div class="t">The rule that matters</div><div class="h">${esc(policyPreview(obPick.pick))}</div></div>
      <div class="set"><div class="t">Choose any of them</div>
        <div class="h">The recommendation is a starting point, not a gate. Pick whichever you will actually finish.</div>
        <div class="seg" id="pk">${Object.keys(CHALLENGES).map(k => `<button type="button" data-k="${k}" aria-pressed="${state.challenge===k||(!state.challenge&&k===obPick.pick)}">${CHALLENGES[k].name}</button>`).join('')}</div>
        <div class="btnrow"><button class="act" id="n">Continue</button>
        <button class="act ghost" id="re">Answer again</button></div></div></div>`);
    if (!state.challenge) { state.challenge = obPick.pick; syncChallenge(); }
    c.querySelectorAll('#pk button').forEach(b => b.onclick = () => {
      state.challenge = b.dataset.k; syncChallenge(); save(); render();
    });
    c.querySelector('#n').onclick = () => { obStep = 4; render(); };
    c.querySelector('#re').onclick = () => { obPick = null; render(); };
    out.push(c);
    return out;
  }

  /* ---------- 4. crew ---------- */
  if (obStep === 4) {
    const on = cloudOn();
    const c = el(`<div class="card"><div class="head"><h2>Your crew</h2>
      <span class="meta">${state.crew ? esc(state.crew) : 'Optional'}</span></div>
      ${state.crew ? `<div class="set"><div class="t">You are in crew ${esc(state.crew)}</div>
        <div class="h">Share that code with the people you want holding you to it. They sign up, then enter it on their Crew tab.</div>
        <div class="codebox"><b>${esc(state.crew)}</b><button class="act ghost sm" id="cp" style="margin:0">Copy</button></div></div>`
      : on ? `<div class="set">
        <div class="h">Create a crew and share the code, or enter a code someone gave you. You can also skip this and join later from the Crew tab.</div>
        <input class="fld code" id="cd" placeholder="CODE" maxlength="5" autocomplete="off">
        <div class="btnrow"><button class="act" id="j">Join with code</button>
        <button class="act ghost" id="cr">Create a crew</button></div></div>`
      : `<div class="set"><div class="t">An account is needed first</div>
        <div class="h">Crews live in the cloud, so both people need accounts. Go back a step to create one, or carry on alone and add a crew later.</div>
        <div class="btnrow"><button class="act sm ghost" id="bk">Back to account</button></div></div>`}
      <div class="set"><div class="btnrow"><button class="act" id="n">Continue</button></div></div></div>`);
    const cp = c.querySelector('#cp');
    if (cp) cp.onclick = async () => {
      try { await navigator.clipboard.writeText(state.crew); toast('Code copied.', false); }
      catch (e) { toast(`Code is ${state.crew}.`, false); }
    };
    const j = c.querySelector('#j');
    if (j) j.onclick = async () => { await joinCrew(c.querySelector('#cd').value); render(); };
