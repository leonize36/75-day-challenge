<style>

    --text: #14161A; --muted: #6E7480;
    --brand: #0E7C7B; --brand-soft: #E4F1F1; --brand-mid: #8CBFBE;
    --red: #C6564A; --red-soft: #FBECEA; --amber: #B4790C; --amber-soft: #FBF1DF;
    --violet: #5B4B8A; --violet-soft: #EDEAF5;
    --r: 18px; --shadow: 0 1px 2px rgba(20,22,26,.05), 0 6px 20px rgba(20,22,26,.05);
  }
  * { box-sizing: border-box; }
  .app { background: var(--canvas); color: var(--text); font-family: "Inter", system-ui, sans-serif;
    padding: 16px 16px 0; max-width: 760px; margin: 0 auto; min-height: 100%; -webkit-font-smoothing: antialiased; }
  .app h1, .app h2, .app h3 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; }

  .topbar { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }

  /* dashboard */
  .dash { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .ring { position: relative; width: 118px; height: 118px; flex: 0 0 auto; }
  .ring svg { transform: rotate(-90deg); }
  .ring .bgc { stroke: var(--line); }
  .ring .fgc { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset 500ms cubic-bezier(.2,.8,.3,1); }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .mid b { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -.03em; line-height: 1; }
  .ring .mid span { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 3px; }
  .dash .say { flex: 1; min-width: 0; }
  .dash .say h1 { font-size: clamp(19px, 5.4vw, 25px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .dash .say p { margin: 7px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; overflow: hidden; position: relative; box-shadow: var(--shadow); }
  .card.warn { border-color: #EBD9B4; }
  .card > .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px 17px 13px; }
  .card > .head h2 { font-weight: 700; font-size: 16.5px; letter-spacing: -.015em; }

  .chip { display: inline-flex; align-items: center; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 6px 12px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
  .chip.amber { background: var(--amber-soft); color: var(--amber); }
  .chip.red { background: var(--red-soft); color: var(--red); }

  .row { display: flex; align-items: center; gap: 13px; width: 100%; padding: 14px 17px; border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background 150ms ease; }
  .row:hover { background: #FAFBFC; }
  .row:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }

  .row.on .mark { background: var(--brand); border-color: var(--brand); }

  .badge { border: 1px solid var(--line); border-radius: 13px; padding: 12px 10px; text-align: center; background: #FAFBFC; }

  .badge .ic { font-size: 22px; line-height: 1; filter: grayscale(1) opacity(.4); }

  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 14px 17px 16px; }

  .shot.sel { border-color: var(--brand); }

  .shot b { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(20,22,26,.62); color: #fff; font-family: "JetBrains Mono", monospace; font-size: 9px; padding: 3px 0; text-align: center; font-weight: 400; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 17px 16px; }
  .compare figure { margin: 0; }

  .coach { padding: 4px 17px 16px; }

  button.act.danger { background: var(--red-soft); color: var(--red); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

<script>
/* Browser storage shim.
   Inside a Claude artifact window.storage exists and is used as is.
   On any real domain it does not, so this maps the same API onto localStorage. */
window.__storageShim = false;
if (!window.storage) {
  window.__storageShim = true;
  const ns = shared => (shared ? 's:' : 'p:');
  window.storage = {
    async get(key, shared) {
      const v = localStorage.getItem(ns(shared) + key);
      if (v === null) throw new Error('Key not found: ' + key);
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(ns(shared) + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(ns(shared) + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = ns(shared) + (prefix || ''), keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(p)) keys.push(k.slice(2));
      }
      return { keys, prefix: prefix || '', shared: !!shared };
    }
  };
}
</script>

const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const between = (a,b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
const today = () => iso(new Date());
const pretty = s => fromIso(s).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
const shortD = s => fromIso(s).toLocaleDateString(undefined, { day:'numeric', month:'short' });
const ago = ts => { const m = Math.floor((Date.now()-ts)/60000);
  if (m < 2) return 'just now'; if (m < 60) return `${m} min ago`;
  const h = Math.floor(m/60); return h < 24 ? `${h} h ago` : `${Math.floor(h/24)} d ago`; };

/* ---------- rules ---------- */
function R() { return Object.assign({}, MODES[state.mode], state.mode === 'custom' ? (state.rules || {}) : {}); }
function waterTarget() {
  const r = R();
  if (state.waterMode === 'weight' && state.weightKg) return Math.round(Math.max(2000, Math.min(5000, state.weightKg * 40)) / 250) * 250;
  return r.water;
}
function tasks() {
  const r = R(), t = [];
  t.push({ id: 'diet', kind: 'bool', label: 'Diet', spec: r.alcohol ? 'Follow your plan. Alcohol only socially.' : 'No cheat meals. No alcohol.' });
  t.push({ id: 'sessions', kind: 'sessions', label: r.sessions > 1 ? `${r.sessions} workouts` : 'Workout',
    spec: `${r.sessions} × ${r.minutes} min or more.` });
  if (r.outdoor) t.push({ id: 'outdoor', kind: 'outdoor', label: 'One outdoors', spec: 'One session must be outside.' });
  t.push({ id: 'water', kind: 'water', label: 'Water', spec: '' });
  t.push({ id: 'read', kind: 'pages', label: 'Read', spec: `${r.pages} pages${r.fiction ? '' : ', non-fiction'}.` });
  if (r.photo) t.push({ id: 'photo', kind: 'photo', label: 'Progress photo', spec: 'One shot, every day.' });
  return t;
}

/* ---------- day accessors ---------- */
const D = d => state.log[d] || {};
const put = (d, patch) => { state.log[d] = Object.assign({}, state.log[d], patch); dirty.add(d); };
const waterMl = d => { const x = D(d); return typeof x.waterMl === 'number' ? x.waterMl : (x.water ? waterTarget() : 0); };
const sessions = d => D(d).sessions || [];
const pagesRead = d => (D(d).reads || []).reduce((a, r) => a + (r.pages || 0), 0);
const hasPhoto = d => !!D(d).photo || !!D(d).photoManual;

function isDone(d, t) {
  const r = R();
  switch (t.kind) {
    case 'water': return waterMl(d) >= waterTarget();
    case 'sessions': return sessions(d).filter(s => s.minutes >= r.minutes).length >= r.sessions;
    case 'outdoor': return sessions(d).some(s => s.outdoor && s.minutes >= r.minutes);
    case 'pages': return pagesRead(d) >= r.pages;
    case 'photo': return hasPhoto(d);
    default: return !!D(d)[t.id];
  }
}
const countDone = d => tasks().filter(t => isDone(d, t)).length;
const complete = d => countDone(d) === tasks().length;
const dayOf = d => state.runStart ? between(state.runStart, d) + 1 : null;
const slug = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20) || 'me';

const inGrace = () => state.graceHours > 0 && new Date().getHours() < state.graceHours;
function graceDate() {
  if (!state.runStart || !inGrace()) return null;
  const y = addDays(today(), -1);
  if (between(state.runStart, y) < 0 || complete(y)) return null;
  return y;
}
const cutoff = () => inGrace() ? addDays(today(), -1) : today();

  async get(k, sh) { try { const r = await window.storage.get(k, !!sh); return r ? JSON.parse(r.value) : null; } catch (e) { return null; } },
  async raw(k) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch (e) { return null; } },
  async set(k, v, sh) { try { await window.storage.set(k, JSON.stringify(v), !!sh); return true; } catch (e) { return false; } },
  async setRaw(k, v) { try { await window.storage.set(k, v); return true; } catch (e) { return false; } },
  async del(k, sh) { try { await window.storage.delete(k, !!sh); } catch (e) {} },
  async keys(p, sh) { try { const r = await window.storage.list(p, !!sh);
    return (r && r.keys ? r.keys : []).map(k => typeof k === 'string' ? k : k.key).filter(Boolean); } catch (e) { return []; } }
};

function apiHeaders(json) {

async function rest(path, opts = {}, retry = true) {
  const res = await fetch(`${cloud.url}/rest/v1/${path}`, {
    method: opts.method || 'GET',
    headers: Object.assign(apiHeaders(true), opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401 && retry && cloud.refresh) {
    const ok = await refreshToken();
    if (ok) return rest(path, opts, false);
  }
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function refreshToken() {
  try {
    const res = await fetch(`${cloud.url}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST', headers: { apikey: cloud.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: cloud.refresh })
    });
    if (!res.ok) return false;
    const d = await res.json();
    cloud.token = d.access_token; cloud.refresh = d.refresh_token;
    cloud.tokenAt = Date.now();
    await saveCloudCfg();
    return true;
  } catch (e) { return false; }
}

/* Access tokens last about an hour. Refreshing on boot when the stored
   one is old keeps the session alive indefinitely, so signing in once
   is enough. Without this, every visit after an hour fell back to
   local-only without saying so. */
async function ensureSession() {
  if (!cloud.refresh) return false;
  const age = Date.now() - (cloud.tokenAt || 0);
  if (cloud.token && age < 45 * 60 * 1000) return true;
  const ok = await refreshToken();
  if (!ok) { syncState = 'err'; syncMsg = 'Session expired. Sign in again under Settings.'; cloud.token = null; await saveCloudCfg(); }
  return ok;
}

async function auth(kind, url, key, email, password, name) {
  const base = url.replace(/\/+$/, '');
  const ep = kind === 'up' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
  const body = kind === 'up'
    ? { email, password, data: { display_name: name || email.split('@')[0] } }
    : { email, password };
  const res = await fetch(base + ep, {
    method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const d = await res.json();
  if (!res.ok) throw new Error(d.msg || d.error_description || d.message || 'Sign in failed');
  if (!d.access_token) throw new Error('Check your email to confirm the account, then sign in.');
  cloud = { url: base, key, token: d.access_token, refresh: d.refresh_token,
    tokenAt: Date.now(), uid: d.user.id, email: d.user.email, crewId: null };
  await saveCloudCfg();
  return true;
}

/* ---------- push ---------- */
function schedulePush() {
  if (!cloudOn()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 700);
}

async function push() {
  if (!cloudOn()) return;
  syncState = 'busy'; syncMsg = 'Saving';
  const dates = Array.from(dirty);
  try {
    await rest('profiles?on_conflict=id', {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: [{ id: cloud.uid, display_name: state.name || 'You', mode: state.mode,
        rules: state.mode === 'custom' ? (state.rules || null) : null,
        grace_hours: state.graceHours, water_mode: state.waterMode,
        weight_kg: state.weightKg, protein_target: state.proteinTarget,
        calorie_target: state.calorieTarget, run_start: state.runStart,
        resets: state.resets, longest: state.longest, goals: state.goals || [],
        nutrition: state.nutrition || null, training: state.training || null,
        updated_at: new Date().toISOString() }]
    });

    if (booksDirty) {
      for (const b of state.books || []) {
        if (b.id) {
          await rest(`books?id=eq.${b.id}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' },
            body: { title: b.title, total_pages: b.pages || 0 } });
        } else {
          const [row] = await rest('books', { method: 'POST', headers: { Prefer: 'return=representation' },
            body: [{ user_id: cloud.uid, title: b.title, total_pages: b.pages || 0 }] });
          if (row) b.id = row.id;
        }
      }
      booksDirty = false;
    }

    for (const d of dates) {
      const x = D(d);
      await rest('days?on_conflict=user_id,day', {
        method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: [{ user_id: cloud.uid, day: d, diet: !!x.diet, water_ml: x.waterMl || 0,
          protein_g: x.protein || 0, calories: x.calories || 0, mood: x.mood || null,
          weight_kg: x.weightKg || null, measurements: x.meas || {}, has_photo: !!x.photo,
          updated_at: new Date().toISOString() }]
      });
      await rest(`workouts?user_id=eq.${cloud.uid}&day=eq.${d}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
      const ws = (x.sessions || []).map(s => ({ user_id: cloud.uid, day: d, name: s.name || null, minutes: s.minutes, outdoor: !!s.outdoor }));
      if (ws.length) await rest('workouts', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: ws });

      await rest(`reads?user_id=eq.${cloud.uid}&day=eq.${d}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
      const rs = (x.reads || []).map(r => ({ user_id: cloud.uid, day: d,
        book_id: r.book >= 0 && state.books[r.book] ? state.books[r.book].id : null, pages: r.pages }));
      if (rs.length) await rest('reads', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: rs });
      dirty.delete(d);
    }
    await publish();
    syncState = 'ok'; syncMsg = 'Synced';
  } catch (e) {
    syncState = 'err'; syncMsg = 'Saved on this device. Will retry.';
  }
  if (tab === 'settings') render();
}

async function savePhoto(date, dataUrl) {

      method: 'POST', headers: Object.assign(apiHeaders(false), { 'x-upsert': 'true', 'Content-Type': 'image/jpeg' }), body: blob
    });
  } catch (e) { /* local copy stands */ }

}

async function pullPhotos() {
  if (!cloudOn()) return;
  try {
    const list = await fetch(`${cloud.url}/storage/v1/object/list/progress`, {
      method: 'POST', headers: apiHeaders(true),
      body: JSON.stringify({ prefix: cloud.uid + '/', limit: 200, sortBy: { column: 'name', order: 'asc' } })
    }).then(r => r.json());
    for (const o of (list || [])) {
      const date = String(o.name).replace('.jpg', '');
      if (photos[date]) continue;
      const signed = await fetch(`${cloud.url}/storage/v1/object/sign/progress/${cloud.uid}/${o.name}`, {
        method: 'POST', headers: apiHeaders(true), body: JSON.stringify({ expiresIn: 3600 })
      }).then(r => r.json());
      if (signed && signed.signedURL) photos[date] = cloud.url + '/storage/v1' + signed.signedURL;
    }
  } catch (e) { /* offline, local photos still show */ }
}

/* ---------- run integrity ---------- */
function audit() {
  broken = null;
  if (!state.runStart) return;
  const c = cutoff();
  for (let i = 0; i < TOTAL; i++) {
    const d = addDays(state.runStart, i);
    if (between(d, c) <= 0) break;
    if (!complete(d)) { broken = { date: d, day: i+1, missed: tasks().filter(t => !isDone(d, t)) }; return; }
  }
}
function startRun(from) { state.runStart = from; state.log = {}; reportText = null; state.onboarded = true; save(); render(); }
function resetRun(reached) {
  undoSnap = JSON.parse(JSON.stringify(state));
  state.longest = Math.max(state.longest || 0, reached || 0);
  state.resets = (state.resets || 0) + 1;
  wasComplete = false;
  startRun(today());
  toast(`Back to day 1. Day ${reached} logged as a restart.`);
}

async function loadCrew() {

async function joinCrew(code) {
  code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { toast('A crew code is 5 characters.', false); return false; }
  if (!cloudOn()) {
    state.pendingCrew = code; await save();
    toast('Saved. Sign in under Settings and the code is applied automatically.', false);
    return false;
  }
  try {
    const rows = await rest('rpc/join_crew', { method: 'POST', body: { join_code: code } });
    const row = Array.isArray(rows) ? rows[0] : rows;
    if (!row || !row.crew_id) throw new Error('No crew with that code.');
    cloud.crewId = row.crew_id; state.crew = row.crew_code; state.pendingCrew = null;
    await saveCloudCfg(); await save(); await publish(); await loadCrew();
    toast(`Joined crew ${row.crew_code}.`, false);
    return true;
  } catch (e) {
    const m = /No crew with code|5 characters|Not signed in/.test(e.message)
      ? e.message.replace(/^.*?(No crew with code|A crew code|Not signed in)/, '$1').split('"')[0]
      : 'Could not join. Check the code, and that the crew patch SQL has been run.';
    toast(m.slice(0, 120), false);
    return false;
  }
}

async function leaveCrew() {

function pickPhoto(date) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.onload = async () => {
      const max = 520, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/jpeg', 0.72);
      const ok = await savePhoto(date, data);
      if (!ok) return toast('Photo too large to save.', false);
      put(date, { photo: true });
      await save(); render();
    }; img.src = fr.result; };
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* ---------- streaks and week ---------- */
function currentStreak() {
  if (!state.runStart) return 0;
  let n = 0, d = complete(today()) ? today() : addDays(today(), -1);
  while (state.log[d] && complete(d) && between(state.runStart, d) >= 0) { n++; d = addDays(d, -1); }
  return n;
}
function weekStats() {
  const rows = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(today(), -i);
    rows.push({ d, done: countDone(d), of: tasks().length, water: waterMl(d),
      protein: D(d).protein || 0, calories: D(d).calories || 0,
      minutes: sessions(d).reduce((a, s) => a + (s.minutes||0), 0), pages: pagesRead(d),
      mood: D(d).mood || null, weight: D(d).weightKg || null });
  }
  return rows;
}

/* ---------- coach ---------- */
/* ============================================================
   COACH — computed from your own log. No API, no cost, instant,
   works offline. Every sentence below is derived from numbers
   already in the app.
   ============================================================ */

function weakestCheck() {
  const ts = tasks(), w = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(today(), -i);
    if (!state.runStart || between(state.runStart, d) < 0) continue;
    w.push(d);
  }
  if (!w.length) return null;
  let worst = null;
  ts.forEach(t => {
    const misses = w.filter(d => !isDone(d, t)).length;
    if (!worst || misses > worst.misses) worst = { task: t, misses, of: w.length };
  });
  return worst && worst.misses > 0 ? worst : null;
}

function localCoach() {
  const t = today(), n = dayOf(t), r = R(), ts = tasks();
  const hour = new Date().getHours();
  const open = ts.filter(x => !isDone(t, x));
  const done = ts.length - open.length;
  const streak = currentStreak();
  const lines = [];

  if (!state.runStart) return 'Nothing to read yet. Start day 1 and the first review lands after a few days of data.';

  if (broken) {
    return `The run broke on day ${broken.day} because ${broken.missed.map(x => x.label.toLowerCase()).join(' and ')} went unlogged. Day 1 starts again today. The thing that actually helps is logging each check the moment it is done rather than at bedtime.`;
  }

  /* what is still open, and how urgent that is */
  if (open.length === 0) {
    lines.push(`Day ${n} is closed with everything logged.`);
  } else {
    const names = open.map(x => x.label.toLowerCase());
    const outdoorOpen = open.some(x => x.kind === 'outdoor');
    const waterGap = waterTarget() - waterMl(t);
    if (hour >= 19 && open.length > 1) {
      lines.push(`It is ${hour}:00 and ${open.length} checks are still open: ${names.join(', ')}. Pick the one that takes longest and start it now.`);
    } else if (outdoorOpen && hour >= 16) {
      lines.push(`The outdoor session is still open and daylight is going. That is the check most runs die on.`);
    } else {
      lines.push(`${done} of ${ts.length} done. Still open: ${names.join(', ')}.`);
    }
    if (waterGap > 0 && hour >= 17) {
      lines.push(`Water is ${(waterGap/1000).toFixed(1)} litres short with a few hours left, which is about ${Math.ceil(waterGap/250)} glasses.`);
    }
  }

  /* the pattern across the week */
  const weak = weakestCheck();
  if (weak) {
    lines.push(`Across the last ${weak.of} days, ${weak.task.label.toLowerCase()} was the check you missed most, ${weak.misses} times. That is the one to plan around rather than hope for.`);
  }

  /* workout load */
  const w = weekStats();
  const mins = w.reduce((a, x) => a + x.minutes, 0);
  const need = r.sessions * r.minutes * 7;
  if (mins > 0 && mins < need * 0.8) {
    lines.push(`You logged ${mins} workout minutes this week against ${need} the rule asks for.`);
  }

  /* protein, only if being tracked */
  const pDays = w.filter(x => x.protein > 0);
  if (pDays.length >= 3) {
    const avg = Math.round(pDays.reduce((a, x) => a + x.protein, 0) / pDays.length);
    if (avg < state.proteinTarget * 0.85) {
      lines.push(`Protein averaged ${avg} g against your ${state.proteinTarget} g target. Two workouts a day on a shortfall is how strength stalls.`);
    }
  }

  /* streak framing */
  if (streak >= 7 && open.length === 0) lines.push(`${streak} clean days in a row.`);
  else if (n <= 3) lines.push(`Week one is where most runs end. Nothing matters yet except closing today.`);

  return lines.slice(0, 4).join(' ');
}

function runCoach() {
  state.coach = { date: today(), text: localCoach() };
  save(); render();
}

/* ---------- weekly review ---------- */
function localReport() {
  const w = weekStats(), of = tasks().length, r = R();
  const perfect = w.filter(x => x.done === of).length;
  const mins = w.reduce((a, x) => a + x.minutes, 0);
  const pages = w.reduce((a, x) => a + x.pages, 0);
  const waterHit = w.filter(x => x.water >= waterTarget()).length;
  const pDays = w.filter(x => x.protein > 0);
  const avgP = pDays.length ? Math.round(pDays.reduce((a, x) => a + x.protein, 0) / pDays.length) : null;
  const weights = w.filter(x => x.weight);
  const moods = w.filter(x => x.mood);
  const out = [];

  out.push(`${perfect} of the last 7 days were complete, with ${mins} workout minutes and ${pages} pages read.`);
  out.push(`Water hit target on ${waterHit} of 7 days.`);

  const weak = weakestCheck();
  if (weak) out.push(`${weak.task.label} was the weak check, missed ${weak.misses} times.`);
  else if (perfect === 7) out.push(`Nothing was missed.`);

  if (avgP !== null) {
    out.push(avgP >= state.proteinTarget
      ? `Protein averaged ${avgP} g, at or above your ${state.proteinTarget} g target.`
      : `Protein averaged ${avgP} g against a ${state.proteinTarget} g target, short by about ${state.proteinTarget - avgP} g a day.`);
  }

  if (weights.length >= 2) {
    const d = Math.round((weights[weights.length-1].weight - weights[0].weight) * 10) / 10;
    out.push(`Weight moved ${d > 0 ? 'up' : 'down'} ${Math.abs(d)} kg across ${weights.length} weigh-ins.`);
  }
  if (moods.length >= 3) {
    const avg = (moods.reduce((a, x) => a + x.mood, 0) / moods.length).toFixed(1);
    const low = moods.filter(x => x.mood <= 2).length;
    out.push(low >= 2
      ? `Mood averaged ${avg} out of 5 with ${low} low days, which usually tracks sleep and food rather than effort.`
      : `Mood averaged ${avg} out of 5.`);
  }

  /* one concrete adjustment */
  if (perfect === 7) out.push(`Nothing needs changing. Hold this pattern.`);
  else if (weak && weak.task.kind === 'outdoor') out.push(`Next week, fix the outdoor session by putting it in the morning, before the day fills up.`);
  else if (weak && weak.task.kind === 'water') out.push(`Next week, front-load water. Two litres before midday makes the rest trivial.`);
  else if (weak && weak.task.kind === 'pages') out.push(`Next week, read the ${r.pages} pages first thing rather than last thing.`);
  else if (weak) out.push(`Next week, schedule ${weak.task.label.toLowerCase()} at a fixed time instead of fitting it in.`);

  return out.join(' ');
}

function runReport() { reportText = localReport(); render(); }

/* ---------- goal plans ---------- */
function localGoalPlan(g) {
  const p = goalProgress(g), dl = daysLeft(g), r = R();
  const out = [];

  if (p.pct >= 1) return `Target already reached. Set a new one, or extend this deadline and push the number.`;
  if (dl === null) return `${p.line} Add a deadline and the required rate can be worked out.`;
  if (dl <= 0) return `${p.line} The deadline has passed. Move it and the pacing recalculates.`;

  out.push(p.line);
  if (p.sub) out.push(p.sub);

  if (g.type === 'weight') {
    const last = latestEntry(g);
    const perWeek = Math.abs((last ? last.value : g.start) - g.target) / Math.max(dl / 7, 0.15);
    if (perWeek > 1) out.push(`That rate is faster than 1 kg a week, which on two workouts a day usually costs muscle and energy. Moving the deadline out is the honest fix.`);
    else if (perWeek < 0.2) out.push(`That rate is gentle enough that consistency matters more than any diet change.`);
    else out.push(`That rate is sustainable alongside the challenge. Keep protein at ${state.proteinTarget} g and let the training do the rest.`);
    out.push(`Weigh in ${g.cadence === 7 ? 'weekly' : g.cadence === 14 ? 'fortnightly' : 'monthly'}, same time, same conditions. Daily numbers are mostly water.`);
  }

  if (g.type === 'book') {
    const b = state.books[g.bookIndex];
    const left = b ? Math.max(0, b.pages - b.read) : 0;
    const perDay = Math.ceil(left / dl);
    out.push(perDay <= r.pages
      ? `Your daily rule of ${r.pages} pages already clears this with room to spare.`
      : `That is ${perDay - r.pages} pages a day beyond the ${r.pages} the rule asks for, so add one longer sitting a week rather than stretching every day.`);
  }

  if (g.type === 'fitness') {
    const wks = Math.max(dl / 7, 0.15);
    out.push(`With ${Math.floor(wks)} weeks left, make one of your two daily sessions the quality one. The other stays easy, because you are training twice a day and recovery is the limit, not effort.`);
    out.push(`Log an attempt every two to three weeks rather than weekly. Testing too often eats the training that produces the improvement.`);
  }

  return out.join(' ');
}

function goalPlan(g) { g.plan = localGoalPlan(g); save(); render(); }

function toast(msg, undoable = true) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastAct').style.display = undoable && undoSnap ? '' : 'none';
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('on'); undoSnap = null; }, 6000);
}
document.getElementById('toastAct').onclick = () => {

  state = undoSnap; undoSnap = null;

};

  const ph = el(`<div class="card"><div class="head"><h2>Shared photos</h2>
    <span class="meta">${feed.length} ${feed.length === 1 ? 'post' : 'posts'}</span></div></div>`);

  feed.forEach(p => {
    const row = el(`<div class="set">

      <div class="h">${esc(p.caption || '')}${p.caption ? ' · ' : ''}${ago(p.ts)}</div>

    const d = row.querySelector('button');
    if (d) d.onclick = () => deletePost(p.id);
    ph.appendChild(row);
  });
  out.push(ph);

  if (!me) {
    const th = el(`<div class="card"><div class="head"><h2>Messages</h2>
      <span class="meta">${esc(nm.split(' ')[0])}</span></div></div>`);
    if (!memberData.thread.length) th.appendChild(el(`<div class="set"><div class="h">No messages yet.</div></div>`));
    memberData.thread.forEach(m => th.appendChild(el(`<div class="set" style="border-top:1px solid var(--line)">
      <div class="coach" style="padding:0"><div class="bubble" style="${m.mine ? 'background:var(--brand-soft);color:#0B3B3A' : ''}">${esc(m.body)}</div></div>
      <div class="amt">${m.mine ? 'You' : esc(m.from.split(' ')[0])} · ${ago(m.ts)}</div></div>`)));
    const f = el(`<div class="set"><textarea class="fld" id="mb" rows="2" placeholder="Write a message"></textarea>
      <div class="btnrow"><button class="act sm" id="ms">Send</button>
      <button class="act sm ghost" id="mn">Nudge instead</button></div></div>`);
    f.querySelector('#ms').onclick = async () => {
      const v = f.querySelector('#mb').value;
      if (!v.trim()) return;
      await sendMessage(viewUid, v);
      toast('Message sent.', false);
    };
    f.querySelector('#mn').onclick = () => nudge({ name: nm, uid: viewUid });
    th.appendChild(f);
    out.push(th);
  }
  return out;
}

function shareCard() {
  let pending = null, kind = 'meal';
  const c = el(`<div class="card"><div class="head"><h2>Share with your crew</h2>
    <span class="meta">${postBusy ? 'Posting' : 'Visible to members only'}</span></div>
    <div class="set">
      <div class="h">A meal, a workout, or a note. This is separate from your progress photos, which stay private to you.</div>
      <div class="seg" id="kd">
        <button type="button" data-k="meal" aria-pressed="true">Meal</button>
        <button type="button" data-k="workout" aria-pressed="false">Workout</button>
        <button type="button" data-k="progress" aria-pressed="false">Progress</button>
        <button type="button" data-k="note" aria-pressed="false">Note</button>
      </div>
      <input class="fld" id="cp" placeholder="Caption, optional" style="margin-top:10px">
      <div class="btnrow"><button class="act sm ghost" id="pk">Choose photo</button>
      <button class="act sm" id="sp">Share</button></div>
      <div class="h" id="st" style="margin-top:9px"></div>
    </div></div>`);
  c.querySelectorAll('#kd button').forEach(b => b.onclick = () => {
    kind = b.dataset.k;
    c.querySelectorAll('#kd button').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === kind));
  });
  c.querySelector('#pk').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const img = new Image(), fr = new FileReader();
      fr.onload = () => { img.onload = () => {
        const max = 720, sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        pending = cv.toDataURL('image/jpeg', 0.72);
        c.querySelector('#st').textContent = 'Photo ready. Add a caption and tap Share.';
      }; img.src = fr.result; };
      fr.readAsDataURL(f);
    };
    inp.click();
  };
  c.querySelector('#sp').onclick = async () => {
    const cap = c.querySelector('#cp').value.trim();
    if (!pending && !cap) { c.querySelector('#st').textContent = 'Add a photo or a caption first.'; return; }
    await sharePost(kind, cap, pending);
  };
  return c;
}

const foodById = id => FOODS.find(f => f.id === id);

/* Allergies are hard exclusions, not preferences. */
function allowed(f, prefs, dislikes) {
  const p = prefs || {};
  if (dislikes && dislikes.includes(f.id)) return false;
  if (p.nutAllergy && f.t.includes('nut')) return false;
  if (p.vegan && !f.t.includes('vg')) return false;
  if (p.vegetarian && !f.t.includes('v')) return false;
  if (p.pescatarian && !f.t.includes('v') && !f.t.includes('fish')) return false;
  if (p.glutenFree && !f.t.includes('gf')) return false;
  if (p.dairyFree && !f.t.includes('df')) return false;
  if (p.halal && !f.t.includes('h')) return false;
  if (p.kosher && !f.t.includes('k')) return false;
  if (p.noPork && f.t.includes('pork')) return false;
  if (p.noRedMeat && f.t.includes('red')) return false;
  if (p.budget && f.cost > 2) return false;
  if (p.noCook && f.cook > 1) return false;
  return true;
}

/* ---------- targets ---------- */
function nutriTargets(n) {
  if (!n || !n.weightKg || !n.heightCm || !n.age) return null;
  const s = n.sex === 'f' ? -161 : 5;
  const bmr = Math.round(10 * n.weightKg + 6.25 * n.heightCm - 5 * n.age + s);
  const tdee = Math.round(bmr * (n.activity || 1.375));
  const g = NGOALS[n.goal] || NGOALS.health;
  let kcal = Math.round(tdee * (1 + g.adj) / 10) * 10;

  // Floors. A deficit below these on two workouts a day stops
  // being a diet and starts being a hole.
  const floor = n.sex === 'f' ? 1400 : 1700;
  const capped = kcal < floor;
  if (capped) kcal = floor;

  const protein = Math.round(n.weightKg * g.protein);
  const fat = Math.round(kcal * 0.28 / 9);
  const carb = Math.max(50, Math.round((kcal - protein * 4 - fat * 9) / 4));

  return { bmr, tdee, kcal, protein, fat, carb, capped, floor,
    pattern: n.pattern || (n.prefs && n.prefs.vegan ? 'plant' : g.pattern) };
}

/* ---------- meal building ---------- */
function buildDay(t, prefs, dislikes, meals, seed, away) {
  const cfg = MEAL_SPLITS[meals] || MEAL_SPLITS[3];
  const awayList = away || [];
  const round = (x, step) => Math.round(x / step) * step;

  const BREAKFAST_P = ['yog', 'eggs', 'cottage', 'whey', 'maas', 'soyyog'];
  const BREAKFAST_C = ['oats', 'bread'];
  const BREAKFAST_V = ['berry', 'banana', 'apple', 'orange'];

  const usedToday = [];
  const poolFor = (c, mealName) => FOODS.filter(f => {
    if (f.c !== c || !allowed(f, prefs, dislikes)) return false;
    // A meal eaten away from a kitchen only uses things that travel.
    if (awayList.includes(mealName) && (!f.port || f.cook > 1)) return false;
    return true;
  });
  const pick = (c, i, mealName, prefer) => {
    let p = poolFor(c, mealName);
    if (!p.length) return null;
    if (prefer) { const m = p.filter(f => prefer.includes(f.id)); if (m.length) p = m; }
    const fresh = p.filter(f => !usedToday.includes(f.id));
    const from = fresh.length ? fresh : p;
    const f = from[(seed * 3 + i * 7) % from.length];
    usedToday.push(f.id);
    return f;
  };

  return cfg.split.map((share, i) => {
    const name = cfg.names[i];
    const kcalT = t.kcal * share, protT = t.protein * share;
    const first = i === 0, snack = /snack/i.test(name);
    const items = [];
    const kcalNow = () => items.reduce((a, x) => a + x.f.kcal * x.mult, 0);
    const protNow = () => items.reduce((a, x) => a + x.f.p * x.mult, 0);

    // 1. protein, capped at a sensible portion for that food
    const P = pick('protein', i + 1, name, first ? BREAKFAST_P : null);
    if (P) items.push({ f: P, mult: Math.max(0.5, Math.min(P.max, round(protT / P.p, 0.25))) });

    // 2. a second protein when one food cannot carry the meal
    if (protT - protNow() > 10) {
      const P2 = pick('protein', i + 11, name);
      if (P2) {
        const need = protT - protNow();
        items.push({ f: P2, mult: Math.max(0.5, Math.min(P2.max, round(need / P2.p, 0.25))) });
      }
    }

    // 3. vegetables. Two in main meals, because one serving is not enough fibre.
    if (!snack) {
      const V = pick('veg', i + 2, name, first ? BREAKFAST_V : null);
      if (V) items.push({ f: V, mult: 1 });
      if (!first && kcalT - kcalNow() > 150) {
        const V2 = pick('veg', i + 5, name);
        if (V2) items.push({ f: V2, mult: 1 });
      }
    }

    // 4. fat, a small fixed amount so it never disappears
    let room = kcalT - kcalNow();
    if (room > 120) {
      const F = pick('fat', i + 3, name);
      if (F) items.push({ f: F, mult: Math.max(0.5, Math.min(F.max, round(Math.min(room * 0.3, 170) / F.kcal, 0.5))) });
    }

    // 5. carbohydrate fills whatever is genuinely left, or nothing
    room = kcalT - kcalNow();
    if (room > 60) {
      const C = pick('carb', i + 4, name, first ? BREAKFAST_C : null);
      if (C) {
        const mult = round(room / C.kcal, 0.25);
        if (mult >= 0.25) items.push({ f: C, mult: Math.min(C.max, mult) });
      }
    }

    // 6. top up. Portion caps mean one round of picks cannot fill a
    //    large meal, which is what happens on two meals a day.
    for (let pass = 0; pass < 4; pass++) {
      room = kcalT - kcalNow();
      if (room < 120) break;
      const cat = pass % 2 === 0 ? 'carb' : 'fat';
      const X = pick(cat, i + 20 + pass * 3, name);
      if (!X) break;
      const mult = Math.max(0.5, Math.min(X.max, round(Math.min(room * 0.7, X.kcal * X.max) / X.kcal, 0.25)));
      items.push({ f: X, mult });
    }

    return { name, kcal: Math.round(kcalNow()), protein: Math.round(protNow()), items,
      away: awayList.includes(name) };
  });
}

function groceryList(t, prefs, dislikes, meals, away) {
  const tally = {};
  for (let d = 0; d < 7; d++) {
    buildDay(t, prefs, dislikes, meals, d, away).forEach(m =>
      m.items.forEach(x => { tally[x.f.id] = (tally[x.f.id] || 0) + x.mult; }));
  }
  const byCat = { protein: [], carb: [], veg: [], fat: [] };
  Object.keys(tally).forEach(id => {
    const f = foodById(id);
    byCat[f.c].push({ f, n: Math.round(tally[id] * 10) / 10 });
  });
  Object.keys(byCat).forEach(k => byCat[k].sort((a, b) => b.n - a.n));
  return byCat;
}

function swapsFor(f, prefs, dislikes) {
  return FOODS.filter(x => x.c === f.c && x.id !== f.id && allowed(x, prefs, dislikes)).slice(0, 6);
}

/* Build an ordered method for a meal. The longest item starts
   first, everything shorter runs alongside it, and the timing
   reflects that rather than adding every step end to end. */
function mealMethod(meal) {
  const parts = meal.items
    .map(x => ({ f: x.f, mult: x.mult, p: PREP[x.f.id] || [1, 1, 'Prepare the ' + x.f.n.toLowerCase()] }))
    .filter(x => x.p[1] > 0);
  if (!parts.length) return { steps: ['Assemble and serve.'], total: 2, active: 2 };

  const sorted = parts.slice().sort((a, b) => b.p[1] - a.p[1]);
  const longest = sorted[0];
  const activeSum = sorted.reduce((a, x) => a + x.p[0], 0);
  const total = Math.max(longest.p[1], activeSum);

  const steps = [];
  const say = x => x.p[2] + (x.mult !== 1 ? ` (${x.mult} × ${x.f.s})` : ` (${x.f.s})`) + '.';

  steps.push('Start with the longest thing. ' + say(longest));

  const rest = sorted.slice(1);
  const cooked = rest.filter(x => x.p[1] > 3);
  const cold = rest.filter(x => x.p[1] <= 3);

  cooked.forEach((x, i) => steps.push((i === 0 ? 'While that cooks, ' : 'Then ') + say(x).charAt(0).toLowerCase() + say(x).slice(1)));
  if (cold.length) {
    const lower = s => s.charAt(0).toLowerCase() + s.slice(1);
    const bits = cold.map(x => lower(say(x).replace(/\.$/, '')));
    steps.push('No cooking needed for the rest: ' + bits.join(', then ') + '.');
  }
  steps.push('Plate it together and season. Salt, pepper, lemon, or chilli, whichever suits.');

  return { steps, total: Math.round(total), active: Math.round(activeSum) };
}

/* Which proteins repeat across the week, so they can be cooked once. */
function batchHints(t, prefs, dislikes, meals, away) {
  const tally = {};
  for (let d = 0; d < 7; d++) {
    buildDay(t, prefs, dislikes, meals, d, away).forEach(m =>
      m.items.forEach(x => {
        if (x.f.c !== 'protein' && x.f.c !== 'carb') return;
        if ((PREP[x.f.id] || [0, 0])[1] < 10) return;
        tally[x.f.id] = (tally[x.f.id] || 0) + 1;
      }));
  }
  return Object.keys(tally)
    .filter(id => tally[id] >= 2)
    .map(id => ({ f: foodById(id), days: tally[id] }))
    .sort((a, b) => b.days - a.days)
    .slice(0, 4);
}

/* Warnings the plan itself should raise, computed from the plan. */
function planWarnings(t, n) {
  const w = [];
  const meals = n.meals || 3;
  const perMeal = Math.round(t.protein / meals);
  if (perMeal > 55) w.push(`${meals} meals means about ${perMeal} g of protein each. Past roughly 50 g in a sitting most people struggle, so a shake or an extra snack is usually easier than a bigger plate.`);
  if (meals === 2 && t.kcal > 2400) w.push(`${t.kcal} kcal across two meals is a lot of food at once. Three meals is easier to actually finish.`);
  const day = buildDay(t, n.prefs || {}, n.dislikes || [], meals, 0, n.away || []);
  const short = day.filter(m => m.kcal < t.kcal * 0.6 / meals);
  if (short.length) w.push(`Your exclusions leave ${short.map(m => m.name.toLowerCase()).join(' and ')} hard to fill. Allowing a few more foods would open the plan up.`);
  if ((n.prefs || {}).vegan) w.push('On a plant-based plan, vitamin B12 needs a supplement or fortified foods. Iron and omega-3 are worth paying attention to as well.');
  return w;
}

/* ---------- safety gate ---------- */
const RED_FLAGS = [
  ['chestPain', 'Chest pain or pressure, at rest or during activity'],
  ['faint', 'Fainting or losing consciousness'],
  ['breath', 'Unexplained shortness of breath'],
  ['heart', 'Irregular or racing heartbeat'],
  ['dizzy', 'Severe or repeated dizziness'],
  ['neuro', 'New numbness, weakness, or loss of coordination'],
  ['surgery', 'Surgery in the last 3 months without clearance'],
  ['told', 'Been told by a doctor not to exercise without supervision']
];
const AMBER_FLAGS = [
  ['condition', 'A managed condition such as blood pressure, diabetes, or asthma'],
  ['meds', 'Medication that affects heart rate or blood pressure'],
  ['preg', 'Pregnant or within 6 months postpartum'],
  ['inactive', 'Not exercised at all in the last year']
];

function safetyStatus(tr) {
  const f = tr.flags || {};
  if (RED_FLAGS.some(([k]) => f[k])) return 'clearance';
  // Pain is asked once, at the pain step. Severe pain routes the same
  // way a red flag does, rather than producing a careful programme.
  if (f.painSevere) return 'clearance';
  if (AMBER_FLAGS.some(([k]) => f[k])) return 'restricted';
  if (f.painOngoing) return 'restricted';
  return 'cleared';
}

/* ---------- experience, from facts not opinion ---------- */
function experienceScore(h) {
  let s = 0;
  const m = h.monthsConsistent || 0;
  s += m === 0 ? 0 : m <= 3 ? 1 : m <= 8 ? 2 : 3;
  const w = h.sessionsPerWeek || 0;
  s += w === 0 ? 0 : w === 1 ? 1 : w <= 3 ? 2 : 3;
  s += (h.technique || 0);
  const b = h.breakWeeks || 0;
  s += b > 24 ? -2 : b >= 12 ? -1 : 0;
  return Math.max(0, s);
}
function trainingStatus(h) {
  const s = experienceScore(h);
  return s <= 2 ? 'novice' : s <= 6 ? 'developing' : 'experienced';
}
const STATUS_LABEL = { novice: 'Starting out', developing: 'Building', experienced: 'Experienced' };

const DOSE = {
  novice:      { sets: 2, exercises: [4, 6], rir: 3, skill: 2 },
  developing:  { sets: 3, exercises: [5, 7], rir: 2, skill: 3 },
  experienced: { sets: 3, exercises: [5, 8], rir: 2, skill: 3 }
};

/* ---------- split by days ---------- */
function splitFor(days, status) {
  if (days <= 1) return ['full'];
  if (days === 2) return ['full', 'full'];
  if (days === 3) return status === 'experienced' ? ['upper', 'lower', 'full'] : ['full', 'full', 'full'];
  if (days === 4) return ['upper', 'lower', 'upper', 'lower'];
  if (days === 5) return ['upper', 'lower', 'full', 'upper', 'lower'];
  return ['upper', 'lower', 'full', 'upper', 'lower', 'full'].slice(0, days);
}
const SESSION_PATTERNS = {
  full:  ['squat', 'hpush', 'hpull', 'hinge', 'core', 'carry'],
  upper: ['hpush', 'hpull', 'vpush', 'vpull', 'core'],
  lower: ['squat', 'hinge', 'lunge', 'core', 'carry']
};

/* ---------- exercise selection ---------- */
/* Your own body is always available, so 'none' is always in the
   equipment set. Without this, buying dumbbells removed press-ups. */
const equipSet = tr => Array.from(new Set(['none'].concat(tr.equipment || [])));

function eligible(tr) {
  const eq = equipSet(tr);
  const hurt = tr.areas || [];
  const maxSkill = DOSE[trainingStatus(tr.history || {})].skill;
  const restricted = safetyStatus(tr) === 'restricted';
  return EX.filter(e => {
    if (!e.eq.some(x => eq.includes(x))) return false;
    if (e.skill > maxSkill) return false;
    if ((e.care || []).some(a => hurt.includes(a))) return false;
    if (restricted && e.impact > 0) return false;
    return true;
  });
}

function pickForPattern(pool, pat, used, seed) {
  const opts = pool.filter(e => e.pat === pat && !used.includes(e.id));
  if (!opts.length) return null;
  // Rank by how demanding the exercise is, then rotate only among the
  // top few. Rotating across the whole pool gives variety but hands a
  // gym user wall push-ups, which is worse than no variety at all.
  opts.sort((a, b) => b.skill - a.skill || a.id.localeCompare(b.id));
  const top = opts.slice(0, Math.min(3, opts.length));
  const e = top[seed % top.length];
  used.push(e.id);
  return e;
}

/* ---------- session time budget ---------- */
function timeBudget(mins) {
  if (mins <= 20) return { warm: 3, main: 14, cardio: 0, cool: 3 };
  if (mins <= 30) return { warm: 4, main: 20, cardio: 4, cool: 2 };
  if (mins <= 45) return { warm: 5, main: 30, cardio: 7, cool: 3 };
  if (mins <= 60) return { warm: 7, main: 40, cardio: 10, cool: 3 };
  return { warm: 8, main: 55, cardio: 15, cool: 4 };
}

/* ---------- generator ---------- */
function generateProgram(tr) {
  const status = trainingStatus(tr.history || {});
  const dose = DOSE[status];
  const goal = TGOALS[tr.goal] || TGOALS.health;
  const days = Math.max(1, Math.min(6, tr.days || 3));
  const mins = tr.minutes || 45;
  const budget = timeBudget(mins);
  const pool = eligible(tr);
  const split = splitFor(days, status);
  const restricted = safetyStatus(tr) === 'restricted';

  // High-impact cardio needs a base first. Prescribing a jog to
  // someone who has not trained in six months is how people get hurt
  // in week one and never come back.
  const noImpact = restricted || status === 'novice';
  const cardioPool = CARDIO.filter(c => {
    if (!c.eq.some(x => equipSet(tr).includes(x))) return false;
    if ((c.care || []).some(a => (tr.areas || []).includes(a))) return false;
    if (noImpact && c.impact > 1) return false;
    return true;
  }).sort((a, b) => {
    // Equipment you actually own comes first. Otherwise a treadmill,
    // a spin bike, and a rower sit unused while the plan says "walk".
    const owned = c => (c.eq.includes('none') ? 0 : 1);
    return owned(b) - owned(a);
  });

  const maxEx = Math.max(3, Math.min(dose.exercises[1], Math.floor(budget.main / (dose.sets * 2.2))));
  const warnings = [];

  const sessions = split.map((kind, di) => {
    const used = [];
    const wanted = SESSION_PATTERNS[kind].slice(0, maxEx);
    const items = [];
    wanted.forEach((pat, i) => {
      const e = pickForPattern(pool, pat, used, di * 2 + i);
      if (e) items.push({ e, sets: dose.sets, reps: e.reps || goal.reps, rir: dose.rir, rest: goal.rest });
      else if (!warnings.some(w => w.includes(PATTERNS_T[pat]))) {
        warnings.push(`${PATTERNS_T[pat]} left out. Nothing in your equipment and limits covers it.`);
      }
    });
    const c = cardioPool.length ? cardioPool[di % cardioPool.length] : null;
    return { day: di + 1, kind, items,
      cardio: budget.cardio && c ? { n: c.n, mins: budget.cardio, effort: 'Easy to moderate, able to talk' } : null,
      budget };
  });

  const weeklyCardio = sessions.reduce((a, s) => a + (s.cardio ? s.cardio.mins : 0), 0);
  return { status, goalName: goal.name, days, mins, sessions, warnings, weeklyCardio, restricted,
    generated: today() };
}

/* ---------- 75 Hard pairing ---------- */
function dailyPair(prog, weekday) {
  if (!prog) return null;
  const idx = prog.sessions.length ? (weekday % prog.sessions.length) : 0;
  const trainDay = prog.days >= 6 ? true : (weekday % 7) < prog.days;
  const s = trainDay ? prog.sessions[idx] : null;
  const easy = { n: 'Outdoor walk', mins: 45, effort: 'Easy. Conversation pace the whole way.' };
  return { hard: s, easy,
    note: s ? 'One programmed session and one easy outdoor session. Two 45 minute workouts is the rule. Two hard workouts is not.'
            : 'No programmed session today, so both workouts stay easy. Walk, cycle, or mobility.' };
}

/* ---------- progression ---------- */
function progressOf(id) { return (state.training && state.training.progress && state.training.progress[id]) || { hits: 0, level: 0 }; }

function logProgress(id) {
  state.training.progress = state.training.progress || {};
  const p = progressOf(id);
  p.hits = (p.hits || 0) + 1;
  if (p.hits >= 2) { p.hits = 0; p.level = (p.level || 0) + 1; }
  state.training.progress[id] = p;
  save();
}

function progressionAdvice(item) {
  const p = progressOf(item.e.id);
  if (p.level === 0 && p.hits === 0) return `Start at ${item.sets} sets of ${item.reps}, stopping with about ${item.rir} good repetitions left in you.`;
  if (p.hits === 1) return `Hit the top of the range once. Do it again with the same control and the load goes up.`;
  const steps = ['same load, more reps', 'small load increase', 'add a set', 'harder variation'];
  return `Level ${p.level}. Next step: ${steps[Math.min(p.level, steps.length - 1)]}. Only when the top of the range comes with ${item.rir} left in reserve and clean form.`;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* ---------- shared pieces ---------- */
function ringEl(done, of, n) {
  const pct = of ? done / of : 0, C = 2 * Math.PI * 52;
  return el(`<div class="ring">
    <svg width="118" height="118" viewBox="0 0 118 118">
      <circle class="bgc" cx="59" cy="59" r="52" fill="none" stroke-width="9"/>
      <circle class="fgc" cx="59" cy="59" r="52" fill="none" stroke-width="9"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}"/>
    </svg>
    <div class="mid"><b>${n === null ? '—' : String(n).padStart(2,'0')}</b><span>${done} of ${of}</span></div></div>`);
}
function motivate(n, done, of, streak) {
  if (!state.runStart) return { h: 'Nothing logged yet', p: 'Pick a mode in Settings, then start day 1.' };
  if (broken) return { h: 'The run ended', p: 'Acknowledge the break below and day 1 starts again today.' };
  if (n > TOTAL) return { h: '75 for 75', p: 'Every check, every day. Start another run whenever you want.' };
  if (done === of) return { h: `Day ${n} is closed`, p: streak > 1 ? `${streak} clean days in a row.` : 'First one down.' };
  const left = of - done;
  const pctThrough = Math.round((n / TOTAL) * 100);
  if (n <= 3) return { h: `Day ${n}, ${left} to go today`, p: 'The first week is the whole fight. Clear today and nothing else matters yet.' };
  if (left === 1) return { h: 'One check left', p: 'Finish it and the day is banked.' };
  return { h: `Day ${n}, ${left} left today`, p: `${pctThrough}% through the run. Streak at ${streak}.` };
}

/* ---------- Today ---------- */
/* ============================================================
   TODAY — everything for the day in one place.
   Rows expand in place. Nothing sends you to another tab.
   ============================================================ */
let panels = {}, editDate = null;
const togglePanel = k => { panels[k] = !panels[k]; render(); };

function chev(open) {
  return `<span class="mark" style="border:0;width:20px">
    <svg viewBox="0 0 24 24" style="opacity:1;transform:rotate(${open ? 180 : 0}deg);stroke:var(--muted);stroke-width:2.4;width:15px;height:15px;transition:transform 180ms ease">
    <path d="M5 9l7 7 7-7"/></svg></span>`;
}

function pgToday(t, n, fin) {
  const out = [];
  const ts = tasks(), done = state.runStart ? countDone(t) : 0;
  const m = motivate(n, done, ts.length, currentStreak());
  const dash = el(`<div class="dash"></div>`);
  dash.appendChild(ringEl(done, ts.length, state.runStart ? (fin ? TOTAL : n) : null));
  dash.appendChild(el(`<div class="say"><h1>${esc(m.h)}</h1><p>${esc(m.p)}</p></div>`));
  out.push(dash);

  if (!state.runStart) {
    const c = el(`<div class="card"><div class="head"><h2>${esc(R().name)}</h2><span class="meta">${ts.length} checks a day</span></div>
      <div class="notice"><h3>${ts.length} checks, 75 days, no gaps</h3>
      <p>Miss one check on one day and the run returns to day 1. A day stays editable for ${state.graceHours} hours past midnight.</p>
      <div class="btnrow"><button class="act" id="now">Start day 1 today</button>
      <button class="act ghost" id="earlier">I started earlier</button></div>
      <div id="bd" style="display:none">
        <div class="h" style="margin-top:12px">Pick the day you actually began. Everything from then until yesterday opens for logging, and the run counts from that date.</div>
        <div class="grid2"><label class="f"><span>Day 1 was</span>
          <input class="fld" id="sd" type="date" max="${today()}" min="${addDays(today(), -74)}" value="${addDays(today(), -7)}"></label></div>
        <div class="btnrow"><button class="act sm" id="godate">Start from that date</button></div>
      </div></div></div>`);
    c.querySelector('#now').onclick = () => startRun(today());
    c.querySelector('#earlier').onclick = () => { const b = c.querySelector('#bd'); b.style.display = b.style.display === 'none' ? '' : 'none'; };
    c.querySelector('#godate').onclick = () => {
      const v = c.querySelector('#sd').value;
      if (!v) return toast('Pick a date.', false);
      const n = between(v, today()) + 1;
      if (n < 1 || n > TOTAL) return toast('That date is outside a 75 day run.', false);
      startRun(v);
      toast(`Started on ${pretty(v)}. That makes today day ${n}.`, false);
    };
    out.push(c);
    out.push(helpCard());
    return out;
  }

  if (fin) {
    const c = el(`<div class="card"><div class="head"><h2>Run complete</h2><span class="meta">${pretty(t)}</span></div>
      <div class="notice"><h3>Finished</h3><p>Started ${pretty(state.runStart)}. ${statsAll().perfect} perfect days.</p>
      <button class="act">Run it again from today</button></div></div>`);
    c.querySelector('button').onclick = () => resetRun(TOTAL);
    out.push(c);
    out.push(badgeCard());
    return out;
  }

  if (myNudges.length) {
    const c = el(`<div class="card"><div class="head"><h2>From your crew</h2><button class="pill">Clear</button></div></div>`);
    myNudges.forEach(x => c.appendChild(el(`<div class="mrow"><span class="av">${esc(x.v.from.slice(0,1).toUpperCase())}</span>
      <span class="who"><span class="nm">${esc(x.v.from.split(' ')[0])} ${esc(x.v.text)}</span>
      <span class="amt">${ago(x.v.ts)}</span></span></div>`)));
    c.querySelector('.pill').onclick = markInboxRead;
    out.push(c);
  }

  if (editDate) {
    const back = el(`<div class="btnrow" style="margin:0 0 12px"><button class="act sm ghost">Back to today</button></div>`);
    back.querySelector('button').onclick = () => { editDate = null; render(); };
    out.push(back);
    out.push(el(`<div class="card warn"><div class="set"><div class="t">Filling in ${pretty(editDate)}</div>
      <div class="h">Day ${dayOf(editDate)} of the run. Log only what you actually did. The whole point of the restart rule is that the record is true, and nobody else can check it for you.</div></div></div>`));
    out.push(dayCard(editDate, dayOf(editDate), pretty(editDate), false, 'e'));
    return out;
  }

  const g = graceDate();
  if (g && !broken) out.push(dayCard(g, dayOf(g), `Yesterday, open until ${('0'+state.graceHours+':00').slice(-5)}`, true));

  const target = g && !broken ? g : t;
  out.push(dayCard(t, n, pretty(t), false));

  // Days still open behind you, so a late start can be caught up.
  const gaps = [];
  for (let i = 0; i < TOTAL; i++) {
    const d = addDays(state.runStart, i);
    if (between(d, cutoff()) <= 0) break;
    if (!complete(d)) gaps.push(d);
  }
  if (gaps.length) {
    const gc = el(`<div class="card warn"><div class="head"><h2>Earlier days to fill in</h2>
      <span class="meta">${gaps.length} open</span></div>
      <div class="set"><div class="h">These are inside your run and not complete. Fill them in if you did the work and simply were not using the app yet.</div></div></div>`);
    gaps.slice(0, 10).forEach(d => {
      const row = el(`<div class="hrow"><span class="n">${dayOf(d)}</span><span class="d">${shortD(d)}</span>
        <span class="dots">${tasks().map(x => `<i class="${isDone(d, x) ? 'on' : 'off'}"></i>`).join('')}</span>
        <button class="pill">Fill in</button></div>`);
      row.querySelector('button').onclick = () => { editDate = d; render(); };
      gc.appendChild(row);
    });
    out.push(gc);
  }

  if (broken) {
    const lock = el(`<div class="lock"><div class="notice bad"><h3>Run broken on day ${broken.day}</h3>
      <p>${pretty(broken.date)} closed with ${broken.missed.length} unlogged: ${broken.missed.map(x => x.label.toLowerCase()).join(', ')}. Day 1 starts again today.</p>
      <button class="act">Start over at day 1</button></div></div>`);
    lock.querySelector('button').onclick = () => resetRun(broken.day);
    out[out.length-1].appendChild(lock);
  }

  out.push(fuelCard(target));
  out.push(bodyCard(target));
  out.push(coachCard());
  return out;
}

function dayCard(date, n, metaText, isGrace, prefix) {
  const ts = tasks(), done = countDone(date), r = R();
  const card = el(`<div class="card ${isGrace ? 'warn' : ''}">
    <div class="head"><h2>${isGrace ? `Day ${n} carry-over` : `Day ${n}`}</h2><span class="meta">${esc(metaText)}</span></div></div>`);
  if (done === ts.length) {
    card.querySelector('.head').lastElementChild.outerHTML =
      `<span class="chip ${isGrace ? 'amber' : ''} ${wasComplete || isGrace ? '' : 'pop'}">Day cleared</span>`;
    if (!isGrace) wasComplete = true;
  } else if (!isGrace) wasComplete = false;

  const pfx = prefix || (isGrace ? 'y' : 'd');

  ts.forEach(task => {
    if (task.kind === 'water') { card.appendChild(waterRow(date)); return; }

    const on = isDone(date, task);
    const expandable = task.kind === 'sessions' || task.kind === 'outdoor' || task.kind === 'pages';
    const key = pfx + (task.kind === 'pages' ? 'read' : task.kind === 'bool' || task.kind === 'photo' ? task.id : 'work');
    const open = !!panels[key];

    const b = document.createElement('button');
    b.className = 'row' + (on ? ' on' : '');
    b.type = 'button';
    b.innerHTML = `<span class="txt"><span class="lab">${task.label}</span><span class="spec">${esc(subSpec(date, task))}</span></span>
      ${expandable ? chev(open) : ''}
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5"/></svg></span>`;
    b.onclick = () => {
      if (task.kind === 'bool') { put(date, { [task.id]: !D(date)[task.id] }); save(); render(); }
      else if (task.kind === 'photo') pickPhoto(date);
      else togglePanel(key);
    };
    card.appendChild(b);

    if (expandable && open) {
      card.appendChild(task.kind === 'pages' ? readingPanel(date) : workoutPanel(date));
    }
  });
  return card;
}

function subSpec(date, task) {
  const r = R();
  if (task.kind === 'sessions') {
    const qual = sessions(date).filter(s => s.minutes >= r.minutes).length;
    return `${qual} of ${r.sessions} sessions of ${r.minutes} min or more. Tap to open.`;
  }
  if (task.kind === 'outdoor') {
    const has = sessions(date).some(s => s.outdoor && s.minutes >= r.minutes);
    return has ? 'Outdoor session logged.' : 'No outdoor session yet. Tap to open.';
  }
  if (task.kind === 'pages') return `${pagesRead(date)} of ${r.pages} pages. Tap to open.`;
  if (task.kind === 'photo') return hasPhoto(date) ? 'Photo saved.' : 'Tap to add a photo.';
  return task.spec;
}

function waterRow(date) {
  const target = waterTarget(), ml = waterMl(date);
  const step = 250, slots = Math.ceil(target / step), filled = Math.round(ml / step);
  const row = el(`<div class="row" style="cursor:default">
    <div class="txt"><span class="lab">Water</span>
      <div class="prog">${Array.from({length: slots}, (_,i) => `<span class="${i<filled?'on':''}"></span>`).join('')}</div>
      <span class="amt">${(ml/1000).toFixed(2)} of ${(target/1000).toFixed(2)} L${state.waterMode==='weight'&&state.weightKg?` · 40 ml per kg at ${state.weightKg} kg`:''}</span></div>
    <div class="stepper"><button type="button" id="m">&minus;</button><button type="button" class="plus" id="p">+</button></div></div>`);
  const mb = row.querySelector('#m'), pb = row.querySelector('#p');
  mb.disabled = ml <= 0; pb.disabled = ml >= target;
  mb.onclick = () => { put(date, { waterMl: Math.max(0, ml - step) }); save(); render(); };
  pb.onclick = () => { put(date, { waterMl: Math.min(target, ml + step) }); save(); render(); };
  return row;
}

/* ============================================================
   GOALS — a target, a deadline, and the rate needed to get there
   ============================================================ */
let goalForm = null;

const GOAL_TYPES = {
  fitness: { name: 'Fitness', ic: '🏃' },
  book:    { name: 'Book',    ic: '📚' },
  weight:  { name: 'Weight',  ic: '⚖️' }
};

const goals = () => state.goals || (state.goals = []);
const goalById = id => goals().find(g => g.id === id);
const entriesOf = g => (g.entries || []).slice().sort((a, b) => a.date.localeCompare(b.date));
const latestEntry = g => { const e = entriesOf(g); return e.length ? e[e.length - 1] : null; };

function daysLeft(g) { return g.deadline ? between(today(), g.deadline) : null; }

/* Progress as a 0..1 fraction, plus the sentence that says what to do next. */
function goalProgress(g) {
  const dl = daysLeft(g);
  const wksLeft = dl != null ? Math.max(dl / 7, 0.15) : null;

  if (g.type === 'weight') {
    const last = latestEntry(g);
    const start = g.start != null ? g.start : (last ? last.value : null);
    const now = last ? last.value : start;
    if (now == null || g.target == null) return { pct: 0, line: 'Log your first weigh-in to start tracking.', sub: '' };
    const total = start - g.target, moved = start - now;
    const pct = total === 0 ? 1 : Math.max(0, Math.min(1, moved / total));
    const remain = Math.round((now - g.target) * 10) / 10;
    const dir = total > 0 ? 'to lose' : 'to gain';
    const perWeek = wksLeft ? Math.abs(remain) / wksLeft : null;
    const line = Math.abs(remain) < 0.15
      ? `Target reached at ${now} kg.`
      : `${Math.abs(remain)} kg ${dir}, from ${now} kg to ${g.target} kg.`;
    const sub = perWeek && Math.abs(remain) >= 0.15
      ? `That is ${perWeek.toFixed(2)} kg a week for the ${dl} days left. Above 1 kg a week is aggressive and usually costs muscle.`
      : '';
    return { pct, line, sub, now };
  }

  if (g.type === 'book') {
    const b = g.bookIndex != null && state.books[g.bookIndex] ? state.books[g.bookIndex] : null;
    const total = b ? b.pages : (g.target || 0);
    const read = b ? b.read : (latestEntry(g) ? latestEntry(g).value : 0);
    const pct = total ? Math.max(0, Math.min(1, read / total)) : 0;
    const left = Math.max(0, total - read);
    const perDay = dl != null && dl > 0 ? Math.ceil(left / dl) : null;
    const line = left === 0 ? `Finished all ${total} pages.` : `${read} of ${total} pages, ${left} to go.`;
    const sub = perDay ? `${perDay} pages a day to finish by ${shortD(g.deadline)}. Your daily rule already covers ${R().pages}.` : '';
    return { pct, line, sub };
  }

  // fitness: lower is better for a time, higher is better for a distance
  const last = latestEntry(g);
  const start = g.start != null ? g.start : (last ? last.value : null);
  const now = last ? last.value : start;
  if (now == null || g.target == null) return { pct: 0, line: 'Log your first attempt to start tracking.', sub: '' };
  const lower = g.lowerIsBetter;
  const total = lower ? start - g.target : g.target - start;
  const moved = lower ? start - now : now - start;
  const pct = total === 0 ? 1 : Math.max(0, Math.min(1, moved / total));
  const gap = Math.round(Math.abs(now - g.target) * 100) / 100;
  const done = lower ? now <= g.target : now >= g.target;
  const line = done ? `Target hit at ${now} ${esc(g.unit || '')}.`
    : `${now} ${esc(g.unit || '')} now, ${gap} ${esc(g.unit || '')} ${lower ? 'faster' : 'more'} needed.`;
  const sub = !done && wksLeft
    ? `About ${(gap / wksLeft).toFixed(2)} ${esc(g.unit || '')} a week for the ${dl} days left.`
    : '';
  return { pct, line, sub };
}

function goalStatus(g) {
  const dl = daysLeft(g), p = goalProgress(g);
  if (p.pct >= 1) return { txt: 'Reached', cls: 'chip' };
  if (dl == null) return { txt: 'No deadline', cls: 'chip amber' };
  if (dl < 0) return { txt: 'Deadline passed', cls: 'chip red' };
  const elapsed = g.created ? between(g.created, today()) : 0;
  const span = g.created && g.deadline ? Math.max(1, between(g.created, g.deadline)) : null;
  if (span && elapsed >= 7) {
    const expected = elapsed / span;
    if (p.pct + 0.1 < expected) return { txt: `${dl} days left`, cls: 'chip red' };
  }
  return { txt: `${dl} days left`, cls: 'chip' };
}

          <button type="button" data-v="severe" aria-pressed="${!!d.flags.painSevere}" style="text-align:left">Sharp, spreading down a limb, or stopping normal daily movement</button>
        </div></div>` : ''}
      <div class="set"><div class="btnrow"><button class="act" id="n">Build the plan</button><button class="act ghost" id="b">Back</button></div></div>`;
    body.querySelectorAll('#ar button').forEach(b => b.onclick = () => {
      d.areas = d.areas || [];
      d.areas = d.areas.includes(b.dataset.k) ? d.areas.filter(x => x !== b.dataset.k) : d.areas.concat([b.dataset.k]);

    body.querySelectorAll('#sv button').forEach(b => b.onclick = () => {
      d.flags.painOngoing = b.dataset.v === 'ongoing';

      body.querySelectorAll('#sv button').forEach(x => x.setAttribute('aria-pressed',
        (x.dataset.v === 'severe') === !!d.flags.painSevere && (x.dataset.v === 'ongoing') === !!d.flags.painOngoing));
      render();
    });
    body.querySelector('#n').onclick = () => {
      if (safetyStatus(d) === 'clearance') {

        trStep = null; trDraft = null; save(); render();

  foot.querySelector('#cx').onclick = () => { trStep = null; trDraft = null; render(); };

      <button class="act sm ghost" id="ap">Use these as my daily targets</button>
      <button class="act sm ghost" id="own">${n.useCustom ? 'Use the generated plan' : 'Use my own meals'}</button></div></div></div>`);
  head.querySelector('#ed').onclick = startNutri;
  head.querySelector('#own').onclick = () => {
    state.nutrition.useCustom = !state.nutrition.useCustom;
    save(); render();
  };
  head.querySelector('#ap').onclick = () => {
    state.proteinTarget = t.protein; state.calorieTarget = t.kcal;
    save(); render(); toast('Fuel targets updated.', false);
  };
  const warns = planWarnings(t, n);
  if (warns.length) {
    const wc = el(`<div class="card warn"><div class="head"><h2>Worth knowing</h2></div></div>`);
    warns.forEach(x => wc.appendChild(el(`<div class="set"><div class="h">${esc(x)}</div></div>`)));
    out.push(wc);
  }
  out.push(head);

  /* the day plan */
  if (n.useCustom) { out.push(customPlanCard(t, n)); out.push(kitCard()); return out; }

  const day = buildDay(t, n.prefs || {}, n.dislikes || [], n.meals || 3, planDay, n.away || []);
  const tot = day.reduce((a, m) => ({ kcal: a.kcal + m.kcal, protein: a.protein + m.protein }), { kcal: 0, protein: 0 });
  const dc = el(`<div class="card"><div class="head"><h2>Day ${planDay + 1} of 7</h2>
    <span class="meta">${tot.kcal} kcal · ${tot.protein} g</span></div>
    <div class="set" style="border-top:0"><div class="btnrow" style="margin:0">
      <button class="act sm ghost" id="pv">Previous day</button>
      <button class="act sm ghost" id="nx">Next day</button></div></div></div>`);
  dc.querySelector('#pv').onclick = () => { planDay = (planDay + 6) % 7; render(); };
  dc.querySelector('#nx').onclick = () => { planDay = (planDay + 1) % 7; render(); };

  day.forEach((m, mi) => {
    const mm = mealMethod(m);
    const mkey = `m${planDay}-${mi}`;
    const sec = el(`<div class="set"><div class="t">${m.name} · ${m.protein} g protein · ${m.kcal} kcal${m.away ? ' · packed' : ''}</div>
      <div class="h">${mm.total} min to the table, ${mm.active} min hands on.${m.away ? ' Built from things that travel and need no kitchen.' : ''}</div></div>`);
    m.items.forEach((x, ii) => {
      const key = `${planDay}-${mi}-${ii}`;
      const row = el(`<div class="hrow" style="padding-left:0;padding-right:0">
        <span class="n" style="width:auto;flex:1;font-size:14px">${esc(x.f.n)}</span>
        <span class="d" style="width:auto;text-align:right">${x.mult === 1 ? '' : x.mult + ' × '}${esc(x.f.s)}</span>
        <button class="pill">Swap</button></div>`);
      row.querySelector('button').onclick = () => { swapOpen = swapOpen === key ? null : key; render(); };
      sec.appendChild(row);
      if (swapOpen === key) {
        const opts = swapsFor(x.f, n.prefs || {}, n.dislikes || []);
        const box = el(`<div class="seg" style="margin-bottom:10px"></div>`);
        opts.forEach(o => {
          const b = el(`<button type="button">${esc(o.n)}</button>`);
          b.onclick = () => {
            state.nutrition.dislikes = (state.nutrition.dislikes || []).concat([x.f.id]);
            swapOpen = null; save(); render();
            toast(`${x.f.n} removed from your plan.`, false);
          };
          box.appendChild(b);
        });
        box.appendChild(el(`<span class="h" style="width:100%;margin-top:6px">Choosing one drops ${esc(x.f.n)} from every day and rebuilds the week around what is left.</span>`));
        sec.appendChild(box);
      }
    });
    const mb = el(`<div class="btnrow" style="margin-top:10px"><button class="act sm ghost">${panels[mkey] ? 'Hide method' : 'How to make it'}</button></div>`);
    mb.querySelector('button').onclick = () => togglePanel(mkey);
    sec.appendChild(mb);
    if (panels[mkey]) {
      const steps = el(`<div style="margin-top:10px"></div>`);
      mm.steps.forEach((s, si) => steps.appendChild(el(`<div class="hrow" style="padding:9px 0;align-items:flex-start">
        <span class="n" style="width:22px;flex:0 0 22px;color:var(--brand)">${si + 1}</span>
        <span class="h" style="margin:0;flex:1">${esc(s)}</span></div>`)));
      sec.appendChild(steps);
    }
    dc.appendChild(sec);
  });
  out.push(dc);

  const batch = batchHints(t, n.prefs || {}, n.dislikes || [], n.meals || 3, n.away || []);
  if (batch.length) {
    const bc = el(`<div class="card"><div class="head"><h2>Cook once, eat several times</h2>
      <span class="meta">${batch.length} items</span></div>
      <div class="set"><div class="h">These repeat across the week and take real time to cook. Doing them in one session on a Sunday removes most of the daily cooking, which is what makes the diet check survivable alongside two workouts a day.</div></div></div>`);
    batch.forEach(b => bc.appendChild(el(`<div class="hrow">
      <span class="n" style="width:auto;flex:1;font-size:14px">${esc(b.f.n)}</span>
      <span class="d" style="width:auto;text-align:right">${b.days} days · ${(PREP[b.f.id]||[0,0])[1]} min</span></div>`)));
    out.push(bc);
  }

  /* grocery list */
  const gl = groceryList(t, n.prefs || {}, n.dislikes || [], n.meals || 3, n.away || []);
  const labels = { protein: 'Protein', carb: 'Carbohydrate', veg: 'Vegetables and fruit', fat: 'Fats' };
  const gc = el(`<div class="card"><div class="head"><h2>Week's shopping</h2>
    <span class="meta">7 days</span></div></div>`);
  Object.keys(labels).forEach(k => {
    if (!gl[k].length) return;
    const sec = el(`<div class="set"><div class="t">${labels[k]}</div></div>`);
    gl[k].forEach(x => sec.appendChild(el(`<div class="hrow" style="padding-left:0;padding-right:0">
      <span class="n" style="width:auto;flex:1;font-size:14px">${esc(x.f.n)}</span>
      <span class="d" style="width:auto;text-align:right">${x.n} × ${esc(x.f.s)}</span></div>`)));
    gc.appendChild(sec);
  });
  gc.appendChild(el(`<div class="set"><div class="h">Quantities are servings across seven days, so round up at the shop. Buying the week at once removes the daily decision, which is the part that actually fails.</div></div>`));
  out.push(gc);

  out.push(kitCard());
  return out;
}

function customPlanCard(t, n) {
  const meals = n.customMeals || (n.customMeals = []);
  const tot = meals.reduce((a, m) => ({ kcal: a.kcal + (+m.kcal || 0), protein: a.protein + (+m.protein || 0) }), { kcal: 0, protein: 0 });
  const gapK = t.kcal - tot.kcal, gapP = t.protein - tot.protein;

  const c = el(`<div class="card"><div class="head"><h2>My own meals</h2>
    <span class="meta">${tot.kcal} kcal · ${tot.protein} g</span></div>
    <div class="set" style="border-top:0">
      <div class="h">Your plan, your food. The targets stay on screen so you can see where you land against them, but nothing is generated and nothing is swapped.
      ${meals.length ? `<br><br>Against your targets you are ${Math.abs(gapK)} kcal ${gapK > 0 ? 'short' : 'over'} and ${Math.abs(gapP)} g protein ${gapP > 0 ? 'short' : 'over'}.` : ''}</div></div></div>`);

  meals.forEach((m, i) => {
    const row = el(`<div class="set"><div class="t">${esc(m.name || 'Meal ' + (i + 1))}</div>
      <div class="h">${esc(m.text || '')}</div>
      <div class="amt">${m.kcal || 0} kcal · ${m.protein || 0} g protein</div>
      <div class="btnrow"><button class="act sm ghost">Remove</button></div></div>`);
    row.querySelector('button').onclick = () => {
      state.nutrition.customMeals.splice(i, 1); save(); render();
    };
    c.appendChild(row);
  });

  const f = el(`<div class="set"><div class="t">Add a meal</div>
    <div class="grid2">
      <label class="f"><span>Name</span><input class="fld" id="mn" placeholder="Breakfast"></label>
      <label class="f"><span>What is in it</span><input class="fld" id="mt" placeholder="Oats, yoghurt, berries"></label>
    </div>
    <div class="grid2">
      <label class="f"><span>Calories</span><input class="fld" id="mk" type="number" inputmode="numeric" placeholder="450"></label>
      <label class="f"><span>Protein g</span><input class="fld" id="mp" type="number" inputmode="numeric" placeholder="35"></label>
    </div>
    <div class="btnrow"><button class="act sm" id="add">Add meal</button></div>
    <div class="h" style="margin-top:10px">Items you type here also build the shopping list, so separate them with commas.</div></div>`);
  f.querySelector('#add').onclick = () => {
    const name = f.querySelector('#mn').value.trim();
    if (!name) return toast('Give the meal a name.', false);
    state.nutrition.customMeals = (state.nutrition.customMeals || []).concat([{
      name, text: f.querySelector('#mt').value.trim(),
      kcal: +f.querySelector('#mk').value || 0, protein: +f.querySelector('#mp').value || 0
    }]);
    save(); render(); toast('Meal added.', false);
  };
  c.appendChild(f);

  const items = [];
  meals.forEach(m => (m.text || '').split(',').map(x => x.trim()).filter(Boolean).forEach(x => {
    if (!items.some(y => y.toLowerCase() === x.toLowerCase())) items.push(x);
  }));
  if (items.length) {
    const g = el(`<div class="set"><div class="t">Shopping list</div>
      <div class="h">Everything named across your meals, once each.</div></div>`);
    items.forEach(x => g.appendChild(el(`<div class="hrow" style="padding-left:0;padding-right:0">
      <span class="n" style="width:auto;flex:1;font-size:14px">${esc(x)}</span></div>`)));
    c.appendChild(g);
  }
  return c;
}

    const books = state.books || [];
