<style>
  :root {
    --canvas: #F4F5F7; --card: #FFFFFF; --line: #E4E7EC; --line-2: #CFD4DC;
    --text: #14161A; --muted: #6E7480;
    --brand: #0E7C7B; --brand-soft: #E4F1F1; --brand-mid: #8CBFBE;
    --red: #C6564A; --red-soft: #FBECEA; --amber: #B4790C; --amber-soft: #FBF1DF;
    --violet: #5B4B8A; --violet-soft: #EDEAF5;
    --r: 18px; --shadow: 0 1px 2px rgba(20,22,26,.05), 0 6px 20px rgba(20,22,26,.05);
  }
  * { box-sizing: border-box; }
  .app { background: var(--canvas); color: var(--text); font-family: "Inter", system-ui, sans-serif;
    padding: 16px 16px 0; max-width: 760px; margin: 0 auto; min-height: 100%; -webkit-font-smoothing: antialiased; }
  .app h1, .app h2, .app h3 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; }

  .topbar { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }
  .topbar .id { font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .topbar .track { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .topbar .fill { height: 100%; background: var(--brand); width: 0; transition: width 300ms ease; }

  /* dashboard */
  .dash { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .ring { position: relative; width: 118px; height: 118px; flex: 0 0 auto; }
  .ring svg { transform: rotate(-90deg); }
  .ring .bgc { stroke: var(--line); }
  .ring .fgc { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset 500ms cubic-bezier(.2,.8,.3,1); }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .mid b { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -.03em; line-height: 1; }
  .ring .mid span { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 3px; }
  .dash .say { flex: 1; min-width: 0; }
  .dash .say h1 { font-size: clamp(19px, 5.4vw, 25px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .dash .say p { margin: 7px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; overflow: hidden; position: relative; box-shadow: var(--shadow); }
  .card.warn { border-color: #EBD9B4; }
  .card > .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px 17px 13px; }
  .card > .head h2 { font-weight: 700; font-size: 16.5px; letter-spacing: -.015em; }
  .card > .head .meta { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); text-align: right; }

  .chip { display: inline-flex; align-items: center; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 6px 12px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
  .chip.amber { background: var(--amber-soft); color: var(--amber); }
  .chip.red { background: var(--red-soft); color: var(--red); }
  .chip.pop { animation: pop 420ms cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }

  .row { display: flex; align-items: center; gap: 13px; width: 100%; padding: 14px 17px; border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background 150ms ease; }
  .row:hover { background: #FAFBFC; }
  .row:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .row[disabled] { cursor: default; opacity: .55; }
  .row .txt { flex: 1; min-width: 0; }
  .row .lab { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .row .spec { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .row .mark { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; transition: background 160ms ease, border-color 160ms ease; }
  .row .mark svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 3.2; fill: none; opacity: 0; transform: scale(.5); transition: opacity 160ms, transform 220ms cubic-bezier(.2,1.5,.4,1); }
  .row.on .mark { background: var(--brand); border-color: var(--brand); }
  .row.on .mark svg { opacity: 1; transform: scale(1); }
  .row.on .lab { color: var(--muted); }

  .prog { display: flex; gap: 3px; margin-top: 7px; }
  .prog span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); transition: background 180ms ease; }
  .prog span.on { background: var(--brand); }
  .stepper { display: flex; gap: 6px; flex: 0 0 auto; }
  .stepper button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card); color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; line-height: 1; }
  .stepper button.plus { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .amt { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); margin-top: 6px; display: block; }

  /* generic sections */
  .set { padding: 14px 17px; border-top: 1px solid var(--line); }
  .set:first-child { border-top: 0; }
  .set .t { font-weight: 600; font-size: 14.5px; }
  .set .h { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .seg { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .seg button { font: inherit; font-size: 13px; font-weight: 500; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }

  .cell { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--line); background: var(--card); display: grid; place-content: center; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); cursor: default; position: relative; }

  .cell.perfect { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 500; }
  .cell.part { background: var(--amber-soft); border-color: #EBD9B4; color: var(--amber); }
  .cell.missed { background: var(--red-soft); border-color: #F0D3CF; color: var(--red); }
  .cell.today { box-shadow: 0 0 0 2px var(--brand); }
  .cal .mnav { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 12px; }
  .cal .mnav b { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 15px; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 17px 15px; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* bars / sparkline */
  .bars { display: flex; align-items: flex-end; gap: 1.5px; height: 56px; padding: 0 17px; }
  .bar { flex: 1 1 0; min-width: 0; position: relative; height: 100%; display: flex; align-items: flex-end; }

  .dots i.on { background: var(--brand); }

  .av { width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 14px; background: var(--brand-soft); color: var(--brand); }
  .av.me { background: var(--brand); color: #fff; }
  .mrow .who { flex: 1; min-width: 0; }
  .mrow .nm { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .mrow .dots { margin-top: 7px; }

  .pill { font: inherit; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--brand); cursor: pointer; flex: 0 0 auto; }
  .pill:disabled { color: var(--muted); opacity: .5; cursor: default; }

  /* stats + badges */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); }
  .stat { padding: 14px 8px 15px 17px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat .v { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 23px; letter-spacing: -.02em; }
  .stat .k { font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
  @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } .stat:nth-child(2) { border-right: 0 } }

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(102px, 1fr)); gap: 9px; padding: 14px 17px 16px; }
  .badge { border: 1px solid var(--line); border-radius: 13px; padding: 12px 10px; text-align: center; background: #FAFBFC; }
  .badge.got { background: var(--violet-soft); border-color: #D8D1EC; }
  .badge .ic { font-size: 22px; line-height: 1; filter: grayscale(1) opacity(.4); }
  .badge.got .ic { filter: none; }
  .badge .bn { font-weight: 600; font-size: 12px; margin-top: 7px; letter-spacing: -.01em; }
  .badge .bd { font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }

  /* photos */
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 14px 17px 16px; }
  .shot { flex: 0 0 auto; width: 78px; border-radius: 11px; overflow: hidden; border: 2px solid transparent; background: var(--line); cursor: pointer; position: relative; }
  .shot.sel { border-color: var(--brand); }
  .shot img { width: 100%; height: 104px; object-fit: cover; display: block; }
  .shot b { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(20,22,26,.62); color: #fff; font-family: "JetBrains Mono", monospace; font-size: 9px; padding: 3px 0; text-align: center; font-weight: 400; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 17px 16px; }
  .compare figure { margin: 0; }
  .compare img { width: 100%; border-radius: 12px; display: block; }
  .compare figcaption { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--muted); margin-top: 6px; text-align: center; }

  /* coach */
  .coach { padding: 4px 17px 16px; }
  .coach .bubble { background: var(--violet-soft); border-radius: 14px; padding: 14px 15px; font-size: 13.5px; line-height: 1.55; color: #33294F; }
  .coach .bubble.err { background: var(--red-soft); color: var(--red); }

  .notice { padding: 4px 17px 18px; }
  .notice h3 { font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
  .notice.bad h3 { color: var(--red); }
  .notice p { margin: 8px 0 15px; font-size: 13.5px; line-height: 1.55; color: var(--muted); max-width: 46ch; }

  button.act { font-family: "Inter", sans-serif; font-weight: 600; font-size: 13.5px; background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 11px 20px; cursor: pointer; transition: filter 150ms, transform 150ms; }
  button.act:hover { filter: brightness(1.1); }
  button.act:active { transform: scale(.97); }
  button.act:disabled { opacity: .4; cursor: default; }
  button.act.ghost { background: var(--card); color: var(--muted); border: 1px solid var(--line-2); }
  button.act.danger { background: var(--red-soft); color: var(--red); }
  button.act.sm { padding: 9px 15px; font-size: 12.5px; margin-top: 10px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .lock { position: absolute; inset: 0; z-index: 3; background: rgba(255,255,255,.9); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; }
  .lock .notice { background: var(--red-soft); border-radius: 14px; padding: 16px; }

  .tabs { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px;
    background: rgba(244,245,247,.93); backdrop-filter: blur(8px); border-top: 1px solid var(--line); margin: 4px -16px 0; padding: 7px 8px 11px; }
  .tabs button { font: inherit; font-size: 9px; font-weight: 600; letter-spacing: -.01em; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: 0; border-radius: 11px; padding: 7px 2px; color: var(--muted); cursor: pointer; }
  .tabs button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button[aria-current="true"] { color: var(--brand); background: var(--brand-soft); }
  .tabs .badgeN { position: absolute; top: 3px; right: 50%; margin-right: -16px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(12px); background: var(--text); color: #fff; border-radius: 999px; padding: 11px 16px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 26px rgba(20,22,26,.28); opacity: 0; pointer-events: none; transition: opacity 180ms, transform 180ms; z-index: 20; max-width: 92vw; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { font: inherit; font-weight: 600; color: #7FD4D3; background: none; border: 0; cursor: pointer; padding: 0; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line-2); border-top-color: var(--brand); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

<script>
/* Browser storage shim.
   Inside a Claude artifact window.storage exists and is used as is.
   On any real domain it does not, so this maps the same API onto localStorage. */
window.__storageShim = false;
if (!window.storage) {
  window.__storageShim = true;
  const ns = shared => (shared ? 's:' : 'p:');
  window.storage = {
    async get(key, shared) {
      const v = localStorage.getItem(ns(shared) + key);
      if (v === null) throw new Error('Key not found: ' + key);
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(ns(shared) + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(ns(shared) + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = ns(shared) + (prefix || ''), keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(p)) keys.push(k.slice(2));
      }
      return { keys, prefix: prefix || '', shared: !!shared };
    }
  };
}
</script>

<script>
/* ============================================================
   75 tracker — data model
   ============================================================ */
const TOTAL = 75, KEY = 'sf:state', PKEY = d => `sf:photo:${d}`;

const MODES = {
  hard: { name: '75 Hard', water: 3800, sessions: 2, minutes: 45, outdoor: true, pages: 10,
    photo: true, alcohol: false, fiction: false },
  soft: { name: '75 Soft', water: 3000, sessions: 1, minutes: 45, outdoor: false, pages: 10,
    photo: false, alcohol: true, fiction: true },
  custom: { name: 'Custom', water: 3000, sessions: 1, minutes: 30, outdoor: false, pages: 10,
    photo: true, alcohol: true, fiction: true }
};

let state = {
  mode: 'hard', rules: null,
  runStart: null, log: {}, books: [], resets: 0, longest: 0,
  graceHours: 6, waterMode: 'rule', weightKg: null,
  proteinTarget: 130, calorieTarget: 2000,
  name: null, crew: null, coach: {}, seenBadges: [], onboarded: false, shareBooks: true, goals: []
};

let tab = 'today', broken = null, wasComplete = false;
let crew = [], myNudges = [], photos = {}, undoSnap = null, toastTimer = null, installPrompt = null;
let calMonth = null, cmp = [], coachBusy = false, reportText = null, reportBusy = false;

/* ---------- dates ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const between = (a,b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
const today = () => iso(new Date());
const pretty = s => fromIso(s).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });

  if (m < 2) return 'just now'; if (m < 60) return `${m} min ago`;

/* ---------- rules ---------- */
function R() { return Object.assign({}, MODES[state.mode], state.mode === 'custom' ? (state.rules || {}) : {}); }
function waterTarget() {
  const r = R();
  if (state.waterMode === 'weight' && state.weightKg) return Math.round(Math.max(2000, Math.min(5000, state.weightKg * 40)) / 250) * 250;
  return r.water;
}
function tasks() {
  const r = R(), t = [];
  t.push({ id: 'diet', kind: 'bool', label: 'Diet', spec: r.alcohol ? 'Follow your plan. Alcohol only socially.' : 'No cheat meals. No alcohol.' });
  t.push({ id: 'sessions', kind: 'sessions', label: r.sessions > 1 ? `${r.sessions} workouts` : 'Workout',

  if (r.outdoor) t.push({ id: 'outdoor', kind: 'outdoor', label: 'One outdoors', spec: 'One session must be outside.' });
  t.push({ id: 'water', kind: 'water', label: 'Water', spec: '' });
  t.push({ id: 'read', kind: 'pages', label: 'Read', spec: `${r.pages} pages${r.fiction ? '' : ', non-fiction'}.` });
  if (r.photo) t.push({ id: 'photo', kind: 'photo', label: 'Progress photo', spec: 'One shot, every day.' });

}

/* ---------- day accessors ---------- */
const D = d => state.log[d] || {};
const put = (d, patch) => { state.log[d] = Object.assign({}, state.log[d], patch); dirty.add(d); };
const waterMl = d => { const x = D(d); return typeof x.waterMl === 'number' ? x.waterMl : (x.water ? waterTarget() : 0); };
const sessions = d => D(d).sessions || [];
const pagesRead = d => (D(d).reads || []).reduce((a, r) => a + (r.pages || 0), 0);
const hasPhoto = d => !!D(d).photo || !!D(d).photoManual;

function isDone(d, t) {
  const r = R();
  switch (t.kind) {
    case 'water': return waterMl(d) >= waterTarget();
    case 'sessions': return sessions(d).filter(s => s.minutes >= r.minutes).length >= r.sessions;
    case 'outdoor': return sessions(d).some(s => s.outdoor && s.minutes >= r.minutes);
    case 'pages': return pagesRead(d) >= r.pages;
    case 'photo': return hasPhoto(d);
    default: return !!D(d)[t.id];
  }
}
const countDone = d => tasks().filter(t => isDone(d, t)).length;
const complete = d => countDone(d) === tasks().length;
const dayOf = d => state.runStart ? between(state.runStart, d) + 1 : null;
const slug = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20) || 'me';

const inGrace = () => state.graceHours > 0 && new Date().getHours() < state.graceHours;
function graceDate() {
  if (!state.runStart || !inGrace()) return null;
  const y = addDays(today(), -1);
  if (between(state.runStart, y) < 0 || complete(y)) return null;
  return y;
}
const cutoff = () => inGrace() ? addDays(today(), -1) : today();

const S = {
  async get(k, sh) { try { const r = await window.storage.get(k, !!sh); return r ? JSON.parse(r.value) : null; } catch (e) { return null; } },
  async raw(k) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch (e) { return null; } },
  async set(k, v, sh) { try { await window.storage.set(k, JSON.stringify(v), !!sh); return true; } catch (e) { return false; } },
  async setRaw(k, v) { try { await window.storage.set(k, v); return true; } catch (e) { return false; } },
  async del(k, sh) { try { await window.storage.delete(k, !!sh); } catch (e) {} },
  async keys(p, sh) { try { const r = await window.storage.list(p, !!sh);
    return (r && r.keys ? r.keys : []).map(k => typeof k === 'string' ? k : k.key).filter(Boolean); } catch (e) { return []; } }
};

function apiHeaders(json) {
  const h = { apikey: cloud.key, Authorization: `Bearer ${cloud.token}` };
  if (json) { h['Content-Type'] = 'application/json'; }
  return h;
}

async function rest(path, opts = {}, retry = true) {
  const res = await fetch(`${cloud.url}/rest/v1/${path}`, {
    method: opts.method || 'GET',
    headers: Object.assign(apiHeaders(true), opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401 && retry && cloud.refresh) {
    const ok = await refreshToken();
    if (ok) return rest(path, opts, false);
  }
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function refreshToken() {

    const res = await fetch(`${cloud.url}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST', headers: { apikey: cloud.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: cloud.refresh })
    });
    if (!res.ok) return false;
    const d = await res.json();
    cloud.token = d.access_token; cloud.refresh = d.refresh_token;
    await saveCloudCfg();
    return true;
  } catch (e) { return false; }
}

async function auth(kind, url, key, email, password, name) {
  const base = url.replace(/\/+$/, '');
  const ep = kind === 'up' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
  const body = kind === 'up'
    ? { email, password, data: { display_name: name || email.split('@')[0] } }
    : { email, password };
  const res = await fetch(base + ep, {
    method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const d = await res.json();
  if (!res.ok) throw new Error(d.msg || d.error_description || d.message || 'Sign in failed');
  if (!d.access_token) throw new Error('Check your email to confirm the account, then sign in.');
  cloud = { url: base, key, token: d.access_token, refresh: d.refresh_token,
    uid: d.user.id, email: d.user.email, crewId: null };
  await saveCloudCfg();
  return true;
}

/* ---------- pull ---------- */
async function pull() {
  syncState = 'busy'; syncMsg = 'Loading from Supabase'; render();
  try {
    const [prof] = await rest(`profiles?id=eq.${cloud.uid}&select=*`);
    if (prof) {
      state.mode = prof.mode || 'hard';
      state.rules = prof.rules || null;
      state.graceHours = prof.grace_hours;
      state.waterMode = prof.water_mode;
      state.weightKg = prof.weight_kg ? +prof.weight_kg : null;
      state.proteinTarget = prof.protein_target;
      state.calorieTarget = prof.calorie_target;
      state.runStart = prof.run_start;
      state.resets = prof.resets;
      state.longest = prof.longest;
      state.name = prof.display_name;
      state.goals = prof.goals || [];
      state.shareBooks = prof.share_books !== false;
    }
    const [days, works, books, reads, mine] = await Promise.all([
      rest(`days?user_id=eq.${cloud.uid}&select=*`),
      rest(`workouts?user_id=eq.${cloud.uid}&select=*`),
      rest(`books?user_id=eq.${cloud.uid}&select=*&order=created_at`),
      rest(`reads?user_id=eq.${cloud.uid}&select=*`),
      rest('rpc/my_crew', { method: 'POST', body: {} })
    ]);
    state.books = (books || []).map(b => ({ id: b.id, title: b.title, pages: b.total_pages, read: 0 }));
    const byId = {}; state.books.forEach((b, i) => byId[b.id] = i);
    state.log = {};
    (days || []).forEach(d => {
      state.log[d.day] = { diet: d.diet, waterMl: d.water_ml, protein: d.protein_g,
        calories: d.calories, mood: d.mood || undefined, weightKg: d.weight_kg ? +d.weight_kg : undefined,
        meas: d.measurements || {}, photo: d.has_photo, sessions: [], reads: [] };
    });
    (works || []).forEach(w => {
      state.log[w.day] = state.log[w.day] || { sessions: [], reads: [] };
      (state.log[w.day].sessions = state.log[w.day].sessions || []).push({ name: w.name, minutes: w.minutes, outdoor: w.outdoor });
    });
    (reads || []).forEach(r => {
      state.log[r.day] = state.log[r.day] || { sessions: [], reads: [] };
      const bi = r.book_id != null && byId[r.book_id] != null ? byId[r.book_id] : -1;
      (state.log[r.day].reads = state.log[r.day].reads || []).push({ book: bi, pages: r.pages });
      if (bi >= 0) state.books[bi].read += r.pages;
    });
    const row = Array.isArray(mine) ? mine[0] : mine;
    if (row && row.crew_id) {
      cloud.crewId = row.crew_id; state.crew = row.crew_code; state.pendingCrew = null;
      await saveCloudCfg();
    } else {
      cloud.crewId = null; state.crew = null;
      if (state.pendingCrew) { const code = state.pendingCrew; state.pendingCrew = null; await joinCrew(code); }
    }
    dirty = new Set(); booksDirty = false;
    await S.set(KEY, state);
    syncState = 'ok'; syncMsg = 'Synced';
  } catch (e) {
    syncState = 'err'; syncMsg = 'Could not load. Working from this device.';
  }
  render();
}

/* ---------- push ---------- */
function schedulePush() {
  if (!cloudOn()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 700);
}

async function push() {
  if (!cloudOn()) return;
  syncState = 'busy'; syncMsg = 'Saving';
  const dates = Array.from(dirty);
  try {
    await rest('profiles?on_conflict=id', {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: [{ id: cloud.uid, display_name: state.name || 'You', mode: state.mode,
        rules: state.mode === 'custom' ? (state.rules || null) : null,
        grace_hours: state.graceHours, water_mode: state.waterMode,
        weight_kg: state.weightKg, protein_target: state.proteinTarget,
        calorie_target: state.calorieTarget, run_start: state.runStart,
        resets: state.resets, longest: state.longest, goals: state.goals || [],
        updated_at: new Date().toISOString() }]
    });

    if (booksDirty) {
      for (const b of state.books || []) {
        if (b.id) {
          await rest(`books?id=eq.${b.id}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' },
            body: { title: b.title, total_pages: b.pages || 0 } });
        } else {
          const [row] = await rest('books', { method: 'POST', headers: { Prefer: 'return=representation' },
            body: [{ user_id: cloud.uid, title: b.title, total_pages: b.pages || 0 }] });
          if (row) b.id = row.id;
        }
      }
      booksDirty = false;
    }

    for (const d of dates) {
      const x = D(d);
      await rest('days?on_conflict=user_id,day', {
        method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: [{ user_id: cloud.uid, day: d, diet: !!x.diet, water_ml: x.waterMl || 0,
          protein_g: x.protein || 0, calories: x.calories || 0, mood: x.mood || null,
          weight_kg: x.weightKg || null, measurements: x.meas || {}, has_photo: !!x.photo,
          updated_at: new Date().toISOString() }]
      });
      await rest(`workouts?user_id=eq.${cloud.uid}&day=eq.${d}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
      const ws = (x.sessions || []).map(s => ({ user_id: cloud.uid, day: d, name: s.name || null, minutes: s.minutes, outdoor: !!s.outdoor }));
      if (ws.length) await rest('workouts', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: ws });

      await rest(`reads?user_id=eq.${cloud.uid}&day=eq.${d}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
      const rs = (x.reads || []).map(r => ({ user_id: cloud.uid, day: d,
        book_id: r.book >= 0 && state.books[r.book] ? state.books[r.book].id : null, pages: r.pages }));
      if (rs.length) await rest('reads', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: rs });
      dirty.delete(d);
    }
    await publish();
    syncState = 'ok'; syncMsg = 'Synced';
  } catch (e) {
    syncState = 'err'; syncMsg = 'Saved on this device. Will retry.';
  }
  if (tab === 'settings') render();
}

async function savePhoto(date, dataUrl) {
  await S.setRaw(PKEY(date), dataUrl);
  photos[date] = dataUrl;
  if (!cloudOn()) return true;
  try {
    const blob = await (await fetch(dataUrl)).blob();
    await fetch(`${cloud.url}/storage/v1/object/progress/${cloud.uid}/${date}.jpg`, {
      method: 'POST', headers: Object.assign(apiHeaders(false), { 'x-upsert': 'true', 'Content-Type': 'image/jpeg' }), body: blob
    });
  } catch (e) { /* local copy stands */ }
  return true;
}

async function pullPhotos() {
  if (!cloudOn()) return;
  try {
    const list = await fetch(`${cloud.url}/storage/v1/object/list/progress`, {
      method: 'POST', headers: apiHeaders(true),
      body: JSON.stringify({ prefix: cloud.uid + '/', limit: 200, sortBy: { column: 'name', order: 'asc' } })
    }).then(r => r.json());
    for (const o of (list || [])) {
      const date = String(o.name).replace('.jpg', '');
      if (photos[date]) continue;
      const signed = await fetch(`${cloud.url}/storage/v1/object/sign/progress/${cloud.uid}/${o.name}`, {
        method: 'POST', headers: apiHeaders(true), body: JSON.stringify({ expiresIn: 3600 })
      }).then(r => r.json());
      if (signed && signed.signedURL) photos[date] = cloud.url + '/storage/v1' + signed.signedURL;
    }
  } catch (e) { /* offline, local photos still show */ }
}

/* ---------- run integrity ---------- */
function audit() {
  broken = null;
  if (!state.runStart) return;
  const c = cutoff();
  for (let i = 0; i < TOTAL; i++) {
    const d = addDays(state.runStart, i);
    if (between(d, c) <= 0) break;
    if (!complete(d)) { broken = { date: d, day: i+1, missed: tasks().filter(t => !isDone(d, t)) }; return; }
  }
}
function startRun(from) { state.runStart = from; state.log = {}; reportText = null; state.onboarded = true; save(); render(); }
function resetRun(reached) {
  undoSnap = JSON.parse(JSON.stringify(state));
  state.longest = Math.max(state.longest || 0, reached || 0);
  state.resets = (state.resets || 0) + 1;
  wasComplete = false;
  startRun(today());
  toast(`Back to day 1. Day ${reached} logged as a restart.`);
}

const mKey = (c, s) => `sqd:${c}:m:${s}`;
const nKey = (c, s, ts) => `sqd:${c}:n:${s}:${ts}`;

async function publish() {
  const t = today(), n = dayOf(t), ts = tasks();
  const st = statsAll();
  const card = {
    name: state.name, mode: R().name,
    streak: currentStreak(), perfect: st.perfect, minutes: st.minutes,
    pages: st.pages, outdoor: st.outdoor, runStart: state.runStart,
    day: state.runStart ? Math.min(n || 0, TOTAL) : 0,
    checks: state.runStart ? ts.map(x => isDone(t, x)) : ts.map(() => false),
    done: state.runStart ? countDone(t) : 0, of: ts.length,
    broken: !!broken, best: state.longest || 0, resets: state.resets || 0,
    started: !!state.runStart, updated: Date.now()
  };
  if (cloudOn() && cloud.crewId) {
    try {
      await rest('crew_status?on_conflict=user_id,crew_id', {
        method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: [{ user_id: cloud.uid, crew_id: cloud.crewId, display_name: card.name || 'You',
          mode: card.mode, day_number: card.day, checks: card.checks, done: card.done,
          of_total: card.of, broken: card.broken, started: card.started,
          best: card.best, resets: card.resets, streak: card.streak,

          total_pages: card.pages, outdoor_count: card.outdoor,
          run_start: card.runStart, updated_at: new Date().toISOString() }]
      });
    } catch (e) { /* retried on next push */ }
    return;
  }
  if (state.crew && state.name) await S.set(mKey(state.crew, slug(state.name)), card, true);
}

async function loadCrew() {
  crew = []; myNudges = [];
  if (cloudOn()) {
    if (!cloud.crewId) return;
    try {
      const rows = await rest(`crew_status?crew_id=eq.${cloud.crewId}&select=*`);
      crew = (rows || []).map(r => ({ uid: r.user_id, name: r.display_name, mode: r.mode,
        day: r.day_number, checks: r.checks || [], done: r.done, of: r.of_total,
        broken: r.broken, started: r.started, best: r.best, resets: r.resets,
        updated: new Date(r.updated_at).getTime() }))
        .sort((a, b) => b.day - a.day || a.name.localeCompare(b.name));
      const nd = await rest(`nudges?to_user=eq.${cloud.uid}&read_at=is.null&select=*&order=created_at.desc&limit=5`);
      myNudges = (nd || []).map(x => ({ id: x.id, v: { from: x.from_name, text: x.body, ts: new Date(x.created_at).getTime() } }));
    } catch (e) { /* keep whatever is on screen */ }
    return;
  }
  if (!state.crew) return;
  const keys = await S.keys(`sqd:${state.crew}:m:`, true);
  crew = (await Promise.all(keys.map(k => S.get(k, true)))).filter(Boolean)
    .sort((a, b) => b.day - a.day || a.name.localeCompare(b.name));
  const nk = await S.keys(`sqd:${state.crew}:n:${slug(state.name)}:`, true);
  myNudges = (await Promise.all(nk.map(async k => ({ k, v: await S.get(k, true) }))))
    .filter(x => x.v).sort((a, b) => b.v.ts - a.v.ts).slice(0, 5);
}

async function createCrew() {
  if (!cloudOn()) { toast('Connect to Supabase under Settings first. A crew needs an account on both sides.', false); return false; }
  try {
    const rows = await rest('rpc/create_crew', { method: 'POST', body: { crew_name: (state.name || 'My') + ' crew' } });
    const row = Array.isArray(rows) ? rows[0] : rows;
    if (!row || !row.crew_id) throw new Error('Supabase returned no crew. Run the crew patch SQL.');
    cloud.crewId = row.crew_id; state.crew = row.crew_code; state.pendingCrew = null;
    await saveCloudCfg(); await save(); await publish(); await loadCrew();
    toast(`Crew ${row.crew_code} created.`, false);
    return true;
  } catch (e) { toast(e.message.slice(0, 120), false); return false; }
}

async function joinCrew(code) {
  code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { toast('A crew code is 5 characters.', false); return false; }
  if (!cloudOn()) {
    state.pendingCrew = code; await save();
    toast('Saved. Sign in under Settings and the code is applied automatically.', false);
    return false;
  }
  try {
    const rows = await rest('rpc/join_crew', { method: 'POST', body: { join_code: code } });
    const row = Array.isArray(rows) ? rows[0] : rows;
    if (!row || !row.crew_id) throw new Error('No crew with that code.');
    cloud.crewId = row.crew_id; state.crew = row.crew_code; state.pendingCrew = null;
    await saveCloudCfg(); await save(); await publish(); await loadCrew();
    toast(`Joined crew ${row.crew_code}.`, false);
    return true;
  } catch (e) {
    const m = /No crew with code|5 characters|Not signed in/.test(e.message)
      ? e.message.replace(/^.*?(No crew with code|A crew code|Not signed in)/, '$1').split('"')[0]

function pickPhoto(date) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.onload = async () => {
      const max = 520, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/jpeg', 0.72);
      const ok = await savePhoto(date, data);
      if (!ok) return toast('Photo too large to save.', false);
      put(date, { photo: true });
      await save(); render();
    }; img.src = fr.result; };
    fr.readAsDataURL(f);
  };
  inp.click();
}

function statsAll() {
  const out = { perfect: 0, waterDays: 0, outdoor: 0, minutes: 0, photoDays: 0,
    resets: state.resets || 0, booksDone: (state.books || []).filter(b => b.read >= b.pages && b.pages > 0).length,
    protein: 0, calories: 0, pages: 0 };
  Object.keys(state.log).forEach(d => {
    if (complete(d)) out.perfect++;
    if (waterMl(d) >= waterTarget()) out.waterDays++;
    sessions(d).forEach(s => { out.minutes += s.minutes || 0; if (s.outdoor) out.outdoor++; });
    if (hasPhoto(d)) out.photoDays++;
    out.pages += pagesRead(d);
  });
  return out;
}

/* ---------- streaks and week ---------- */
function currentStreak() {
  if (!state.runStart) return 0;
  let n = 0, d = complete(today()) ? today() : addDays(today(), -1);
  while (state.log[d] && complete(d) && between(state.runStart, d) >= 0) { n++; d = addDays(d, -1); }
  return n;
}
function weekStats() {
  const rows = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(today(), -i);
    rows.push({ d, done: countDone(d), of: tasks().length, water: waterMl(d),
      protein: D(d).protein || 0, calories: D(d).calories || 0,
      minutes: sessions(d).reduce((a, s) => a + (s.minutes||0), 0), pages: pagesRead(d),
      mood: D(d).mood || null, weight: D(d).weightKg || null });
  }
  return rows;
}

/* ---------- AI coach ---------- */
async function ask(prompt, system) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000,
      messages: [{ role: 'user', content: (system ? system + '\n\n' : '') + prompt }] })
  });
  const data = await res.json();
  return (data.content || []).filter(x => x.type === 'text').map(x => x.text).join('\n').trim();
}
function contextBlob() {
  const t = today(), n = dayOf(t), r = R(), w = weekStats();
  const open = tasks().filter(x => !isDone(t, x)).map(x => x.label);
  return `Mode: ${r.name}. Day ${n || 0} of 75. Current streak ${currentStreak()} days. Restarts so far ${state.resets||0}.
Today ${countDone(t)} of ${tasks().length} checks done. Still open: ${open.join(', ') || 'nothing'}.
Water today ${(waterMl(t)/1000).toFixed(1)} of ${(waterTarget()/1000).toFixed(1)} L.
Last 7 days, checks completed per day: ${w.map(x => x.done + '/' + x.of).join(', ')}.
Workout minutes per day: ${w.map(x => x.minutes).join(', ')}. Pages per day: ${w.map(x => x.pages).join(', ')}.
Protein grams per day: ${w.map(x => x.protein).join(', ')} against a ${state.proteinTarget} g target.`;
}
const COACH_SYS = `You are a blunt, warm accountability coach inside a 75-day challenge app. Reply in at most 3 short sentences. Name the single biggest gap in the data and one concrete action for the next few hours. No lists, no emoji, no praise padding, no motivational cliches. Never give medical advice.`;
async function runCoach() {

}
const REPORT_SYS = `You write a weekly review inside a 75-day challenge app. Use 4 to 6 short sentences of plain prose. Lead with the strongest pattern in the numbers, name the weakest check, then one adjustment for next week. Quote specific figures from the data. No lists, no emoji, no medical advice.`;

/* ---------- toast ---------- */
function toast(msg, undoable = true) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastAct').style.display = undoable && undoSnap ? '' : 'none';
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('on'); undoSnap = null; }, 6000);
}
document.getElementById('toastAct').onclick = () => {

  state = undoSnap; undoSnap = null;

/* ============================================================
   render
   ============================================================ */
const el = h => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

let lastTab = null;
function render() {
  const keepY = window.scrollY;
  audit();
  const t = today(), n = dayOf(t);
  const fin = n !== null && n > TOTAL, cur = fin ? TOTAL : n;
  document.getElementById('topId').textContent = !state.runStart ? R().name + ' · not started'
    : broken ? 'Run broken' : fin ? 'Complete' : `${R().name} · day ${cur}`;
  document.getElementById('topFill').style.width = state.runStart ? `${Math.min(100, (cur/TOTAL)*100)}%` : '0%';

  const v = document.getElementById('view');
  v.innerHTML = '';

  if (!state.onboarded) {
    document.getElementById('tabs').style.display = 'none';
    document.querySelector('.topbar').style.display = 'none';
    v.append(...pgOnboard());
    if (lastTab !== 'onboard') { window.scrollTo({ top: 0 }); lastTab = 'onboard'; }
    else window.scrollTo({ top: keepY });
    return;
  }
  document.getElementById('tabs').style.display = '';
  document.querySelector('.topbar').style.display = '';

  if (tab === 'today') v.append(...pgToday(t, n, fin));
  if (tab === 'goals') v.append(...pgGoals());
  if (tab === 'progress') v.append(...pgProgress(t, n, fin));
  if (tab === 'crew') v.append(...pgCrew());
  if (tab === 'inbox') v.append(...pgInbox());
  if (tab === 'member') v.append(...pgMember());
  if (tab === 'settings') v.append(...pgSettings());

  if (lastTab !== tab) { window.scrollTo({ top: 0 }); lastTab = tab; }
  else window.scrollTo({ top: keepY });

  document.querySelectorAll('.tabs button').forEach(b => {
    b.setAttribute('aria-current', (b.dataset.tab === tab || (tab === 'member' && b.dataset.tab === 'crew')) ? 'true' : 'false');
    const o = b.querySelector('.badgeN'); if (o) o.remove();
    if (b.dataset.tab === 'inbox' && inboxUnread) b.appendChild(el(`<span class="badgeN">${inboxUnread}</span>`));
  });
}

/* ---------- shared pieces ---------- */
function ringEl(done, of, n) {
  const pct = of ? done / of : 0, C = 2 * Math.PI * 52;
  return el(`<div class="ring">
    <svg width="118" height="118" viewBox="0 0 118 118">
      <circle class="bgc" cx="59" cy="59" r="52" fill="none" stroke-width="9"/>
      <circle class="fgc" cx="59" cy="59" r="52" fill="none" stroke-width="9"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}"/>
    </svg>
    <div class="mid"><b>${n === null ? '—' : String(n).padStart(2,'0')}</b><span>${done} of ${of}</span></div></div>`);
}
function motivate(n, done, of, streak) {
  if (!state.runStart) return { h: 'Nothing logged yet', p: 'Pick a mode in Settings, then start day 1.' };
  if (broken) return { h: 'The run ended', p: 'Acknowledge the break below and day 1 starts again today.' };
  if (n > TOTAL) return { h: '75 for 75', p: 'Every check, every day. Start another run whenever you want.' };
  if (done === of) return { h: `Day ${n} is closed`, p: streak > 1 ? `${streak} clean days in a row.` : 'First one down.' };
  const left = of - done;
  const pctThrough = Math.round((n / TOTAL) * 100);
  if (n <= 3) return { h: `Day ${n}, ${left} to go today`, p: 'The first week is the whole fight. Clear today and nothing else matters yet.' };
  if (left === 1) return { h: 'One check left', p: 'Finish it and the day is banked.' };
  return { h: `Day ${n}, ${left} left today`, p: `${pctThrough}% through the run. Streak at ${streak}.` };
}

/* ---------- Today ---------- */
/* ============================================================
   TODAY — everything for the day in one place.
   Rows expand in place. Nothing sends you to another tab.
   ============================================================ */
let panels = {};
const togglePanel = k => { panels[k] = !panels[k]; render(); };

function chev(open) {
  return `<span class="mark" style="border:0;width:20px">
    <svg viewBox="0 0 24 24" style="opacity:1;transform:rotate(${open ? 180 : 0}deg);stroke:var(--muted);stroke-width:2.4;width:15px;height:15px;transition:transform 180ms ease">
    <path d="M5 9l7 7 7-7"/></svg></span>`;
}

function pgToday(t, n, fin) {
  const out = [];
  const ts = tasks(), done = state.runStart ? countDone(t) : 0;
  const m = motivate(n, done, ts.length, currentStreak());
  const dash = el(`<div class="dash"></div>`);
  dash.appendChild(ringEl(done, ts.length, state.runStart ? (fin ? TOTAL : n) : null));
  dash.appendChild(el(`<div class="say"><h1>${esc(m.h)}</h1><p>${esc(m.p)}</p></div>`));
  out.push(dash);

  if (!state.runStart) {
    const c = el(`<div class="card"><div class="head"><h2>${esc(R().name)}</h2><span class="meta">${ts.length} checks a day</span></div>
      <div class="notice"><h3>${ts.length} checks, 75 days, no gaps</h3>
      <p>Miss one check on one day and the run returns to day 1. A day stays editable for ${state.graceHours} hours past midnight.</p>
      <button class="act">Start day 1 today</button></div></div>`);
    c.querySelector('button').onclick = () => startRun(today());
    out.push(c);
    out.push(helpCard());
    return out;
  }

  if (fin) {
    const c = el(`<div class="card"><div class="head"><h2>Run complete</h2><span class="meta">${pretty(t)}</span></div>
      <div class="notice"><h3>Finished</h3><p>Started ${pretty(state.runStart)}. ${statsAll().perfect} perfect days.</p>
      <button class="act">Run it again from today</button></div></div>`);
    c.querySelector('button').onclick = () => resetRun(TOTAL);
    out.push(c);
    out.push(badgeCard());
    return out;
  }

  if (myNudges.length) {
    const c = el(`<div class="card"><div class="head"><h2>From your crew</h2><button class="pill">Clear</button></div></div>`);
    myNudges.forEach(x => c.appendChild(el(`<div class="mrow"><span class="av">${esc(x.v.from.slice(0,1).toUpperCase())}</span>
      <span class="who"><span class="nm">${esc(x.v.from.split(' ')[0])} ${esc(x.v.text)}</span>
      <span class="amt">${ago(x.v.ts)}</span></span></div>`)));
    c.querySelector('.pill').onclick = markInboxRead;
    out.push(c);
  }

  const g = graceDate();
  if (g && !broken) out.push(dayCard(g, dayOf(g), `Yesterday, open until ${('0'+state.graceHours+':00').slice(-5)}`, true));

  const target = g && !broken ? g : t;
  out.push(dayCard(t, n, pretty(t), false));

  if (broken) {
    const lock = el(`<div class="lock"><div class="notice bad"><h3>Run broken on day ${broken.day}</h3>
      <p>${pretty(broken.date)} closed with ${broken.missed.length} unlogged: ${broken.missed.map(x => x.label.toLowerCase()).join(', ')}. Day 1 starts again today.</p>
      <button class="act">Start over at day 1</button></div></div>`);
    lock.querySelector('button').onclick = () => resetRun(broken.day);
    out[out.length-1].appendChild(lock);
  }

  out.push(fuelCard(target));
  out.push(bodyCard(target));
  out.push(coachCard());
  return out;
}

function dayCard(date, n, metaText, isGrace) {
  const ts = tasks(), done = countDone(date), r = R();
  const card = el(`<div class="card ${isGrace ? 'warn' : ''}">
    <div class="head"><h2>${isGrace ? `Day ${n} carry-over` : `Day ${n}`}</h2><span class="meta">${esc(metaText)}</span></div></div>`);
  if (done === ts.length) {
    card.querySelector('.head').lastElementChild.outerHTML =
      `<span class="chip ${isGrace ? 'amber' : ''} ${wasComplete || isGrace ? '' : 'pop'}">Day cleared</span>`;
    if (!isGrace) wasComplete = true;
  } else if (!isGrace) wasComplete = false;

  const pfx = isGrace ? 'y' : 'd';

  ts.forEach(task => {
    if (task.kind === 'water') { card.appendChild(waterRow(date)); return; }

    const on = isDone(date, task);
    const expandable = task.kind === 'sessions' || task.kind === 'outdoor' || task.kind === 'pages';
    const key = pfx + (task.kind === 'pages' ? 'read' : task.kind === 'bool' || task.kind === 'photo' ? task.id : 'work');
    const open = !!panels[key];

    const b = document.createElement('button');
    b.className = 'row' + (on ? ' on' : '');
    b.type = 'button';
    b.innerHTML = `<span class="txt"><span class="lab">${task.label}</span><span class="spec">${esc(subSpec(date, task))}</span></span>
      ${expandable ? chev(open) : ''}
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5"/></svg></span>`;
    b.onclick = () => {
      if (task.kind === 'bool') { put(date, { [task.id]: !D(date)[task.id] }); save(); render(); }
      else if (task.kind === 'photo') pickPhoto(date);
      else togglePanel(key);
    };
    card.appendChild(b);

    if (expandable && open) {
      card.appendChild(task.kind === 'pages' ? readingPanel(date) : workoutPanel(date));
    }
  });
  return card;
}

/* ---------- workouts, inline ---------- */
function workoutPanel(date) {
  const r = R(), list = sessions(date);
  const wrap = el(`<div style="background:#FAFBFC;border-top:1px solid var(--line)"></div>`);

  if (!list.length) wrap.appendChild(el(`<div class="set" style="border-top:0"><div class="h">Nothing logged for ${shortD(date)}. A session counts toward the rule at ${r.minutes} minutes or more.</div></div>`));

  list.forEach((s, i) => {
    const row = el(`<div class="mrow" style="border-top:0"><span class="av">${s.outdoor ? '🌤' : '🏋'}</span>
      <span class="who"><span class="nm">${esc(s.name || (s.outdoor ? 'Outdoor session' : 'Gym session'))}
      ${s.minutes < r.minutes ? '<em>short of ' + r.minutes + ' min</em>' : ''}</span>
      <span class="amt">${s.minutes} min · ${s.outdoor ? 'outdoors' : 'indoors'}</span></span>
      <button class="pill">Remove</button></div>`);
    row.querySelector('button').onclick = () => {
      const arr = sessions(date).slice(); arr.splice(i, 1);
      put(date, { sessions: arr }); save(); render();
    };
    wrap.appendChild(row);
  });

  const f = el(`<div class="set">
    <div class="grid2">
      <label class="f"><span>What</span><input class="fld" id="wn" placeholder="Upper body, trail walk"></label>
      <label class="f"><span>Minutes</span><input class="fld" id="wm" type="number" inputmode="numeric" value="${r.minutes}"></label>
    </div>
    <div class="seg" id="wo"><button type="button" data-o="0" aria-pressed="true">Indoors</button>
    <button type="button" data-o="1" aria-pressed="false">Outdoors</button></div>
    <div class="btnrow"><button class="act sm" id="wadd">Add session</button></div></div>`);
  let outdoor = false;
  f.querySelectorAll('#wo button').forEach(b => b.onclick = () => {
    outdoor = b.dataset.o === '1';
    f.querySelectorAll('#wo button').forEach(x => x.setAttribute('aria-pressed', (x.dataset.o === '1') === outdoor));
  });
  f.querySelector('#wadd').onclick = () => {
    const mins = parseInt(f.querySelector('#wm').value, 10);
    if (!(mins > 0)) return toast('Enter the minutes.', false);
    put(date, { sessions: sessions(date).concat([{ name: f.querySelector('#wn').value.trim(), minutes: mins, outdoor }]) });
    save(); render(); toast('Session added.', false);
  };
  wrap.appendChild(f);
  return wrap;
}

function readingPanel(date) {

function subSpec(date, task) {
  const r = R();
  if (task.kind === 'sessions') {
    const qual = sessions(date).filter(s => s.minutes >= r.minutes).length;
    return `${qual} of ${r.sessions} sessions of ${r.minutes} min or more. Tap to open.`;

    const has = sessions(date).some(s => s.outdoor && s.minutes >= r.minutes);
    return has ? 'Outdoor session logged.' : 'No outdoor session yet. Tap to open.';

/* ============================================================
   GOALS — a target, a deadline, and the rate needed to get there
   ============================================================ */
let goalForm = null, goalPlanBusy = null;

const GOAL_TYPES = {
  fitness: { name: 'Fitness', ic: '🏃' },
  book:    { name: 'Book',    ic: '📚' },
  weight:  { name: 'Weight',  ic: '⚖️' }
};

const goals = () => state.goals || (state.goals = []);
const goalById = id => goals().find(g => g.id === id);
const entriesOf = g => (g.entries || []).slice().sort((a, b) => a.date.localeCompare(b.date));
const latestEntry = g => { const e = entriesOf(g); return e.length ? e[e.length - 1] : null; };

function daysLeft(g) { return g.deadline ? between(today(), g.deadline) : null; }

/* Progress as a 0..1 fraction, plus the sentence that says what to do next. */
function goalProgress(g) {
  const dl = daysLeft(g);
  const wksLeft = dl != null ? Math.max(dl / 7, 0.15) : null;

  if (g.type === 'weight') {
    const last = latestEntry(g);
    const start = g.start != null ? g.start : (last ? last.value : null);
    const now = last ? last.value : start;
    if (now == null || g.target == null) return { pct: 0, line: 'Log your first weigh-in to start tracking.', sub: '' };
    const total = start - g.target, moved = start - now;
    const pct = total === 0 ? 1 : Math.max(0, Math.min(1, moved / total));
    const remain = Math.round((now - g.target) * 10) / 10;
    const dir = total > 0 ? 'to lose' : 'to gain';
    const perWeek = wksLeft ? Math.abs(remain) / wksLeft : null;
    const line = Math.abs(remain) < 0.15
      ? `Target reached at ${now} kg.`
      : `${Math.abs(remain)} kg ${dir}, from ${now} kg to ${g.target} kg.`;
    const sub = perWeek && Math.abs(remain) >= 0.15
      ? `That is ${perWeek.toFixed(2)} kg a week for the ${dl} days left. Above 1 kg a week is aggressive and usually costs muscle.`
      : '';
    return { pct, line, sub, now };
  }

  if (g.type === 'book') {
    const b = g.bookIndex != null && state.books[g.bookIndex] ? state.books[g.bookIndex] : null;
    const total = b ? b.pages : (g.target || 0);
    const read = b ? b.read : (latestEntry(g) ? latestEntry(g).value : 0);
    const pct = total ? Math.max(0, Math.min(1, read / total)) : 0;
    const left = Math.max(0, total - read);
    const perDay = dl != null && dl > 0 ? Math.ceil(left / dl) : null;
    const line = left === 0 ? `Finished all ${total} pages.` : `${read} of ${total} pages, ${left} to go.`;
    const sub = perDay ? `${perDay} pages a day to finish by ${shortD(g.deadline)}. Your daily rule already covers ${R().pages}.` : '';
    return { pct, line, sub };
  }

  // fitness: lower is better for a time, higher is better for a distance
  const last = latestEntry(g);
  const start = g.start != null ? g.start : (last ? last.value : null);
  const now = last ? last.value : start;
  if (now == null || g.target == null) return { pct: 0, line: 'Log your first attempt to start tracking.', sub: '' };
  const lower = g.lowerIsBetter;
  const total = lower ? start - g.target : g.target - start;
  const moved = lower ? start - now : now - start;
  const pct = total === 0 ? 1 : Math.max(0, Math.min(1, moved / total));
  const gap = Math.round(Math.abs(now - g.target) * 100) / 100;
  const done = lower ? now <= g.target : now >= g.target;
  const line = done ? `Target hit at ${now} ${esc(g.unit || '')}.`
    : `${now} ${esc(g.unit || '')} now, ${gap} ${esc(g.unit || '')} ${lower ? 'faster' : 'more'} needed.`;
  const sub = !done && wksLeft
    ? `About ${(gap / wksLeft).toFixed(2)} ${esc(g.unit || '')} a week for the ${dl} days left.`
    : '';
  return { pct, line, sub };
}

function goalStatus(g) {
  const dl = daysLeft(g), p = goalProgress(g);
  if (p.pct >= 1) return { txt: 'Reached', cls: 'chip' };
  if (dl == null) return { txt: 'No deadline', cls: 'chip amber' };
  if (dl < 0) return { txt: 'Deadline passed', cls: 'chip red' };
  const elapsed = g.created ? between(g.created, today()) : 0;
  const span = g.created && g.deadline ? Math.max(1, between(g.created, g.deadline)) : null;
  if (span && elapsed >= 7) {
    const expected = elapsed / span;
    if (p.pct + 0.1 < expected) return { txt: `${dl} days left`, cls: 'chip red' };
  }
  return { txt: `${dl} days left`, cls: 'chip' };
}

async function goalPlan(g) {
  goalPlanBusy = g.id; render();
  const p = goalProgress(g);
  const hist = entriesOf(g).slice(-8).map(e => `${e.date}: ${e.value}`).join(', ') || 'none yet';
  const ctx = `Goal type: ${g.type}. Title: ${g.title}. Target: ${g.target} ${g.unit || ''}. Deadline: ${g.deadline || 'none'} (${daysLeft(g)} days away).
Current position: ${p.line} ${p.sub}
Entries so far: ${hist}
The person is also running a ${R().name} challenge: ${R().sessions} workouts of ${R().minutes} minutes a day, ${R().pages} pages of reading, ${(waterTarget()/1000).toFixed(1)} litres of water.`;
  const sys = `You are a coach. Give a concrete plan in at most 5 short sentences of plain prose. Say what to do weekly, using the numbers given. Account for the fact that the person is already training daily for a challenge, so do not simply add volume. No lists, no emoji, no medical advice, no disclaimers.`;
  try { g.plan = await ask(ctx, sys); } catch (e) { g.plan = 'Plan unavailable right now.'; }
  goalPlanBusy = null; await save(); render();
}

function goalCard(g) {
  const p = goalProgress(g), st = goalStatus(g), pct = Math.round(p.pct * 100);
  const c = el(`<div class="card"><div class="head"><h2>${GOAL_TYPES[g.type].ic} ${esc(g.title)}</h2>
    <span class="${st.cls}">${st.txt}</span></div>
    <div class="set" style="border-top:0">
      <div class="prog">${Array.from({length:20},(_,k)=>`<span class="${k < Math.round(pct/5)?'on':''}"></span>`).join('')}</div>
      <div class="t" style="margin-top:10px">${esc(p.line)}</div>
      ${p.sub ? `<div class="h">${esc(p.sub)}</div>` : ''}
      ${g.deadline ? `<div class="amt">${pct}% · due ${pretty(g.deadline)}</div>` : `<div class="amt">${pct}%</div>`}
    </div></div>`);

  if (g.type !== 'book') {
    const last = latestEntry(g);
    const due = last && g.cadence ? between(last.date, today()) >= g.cadence : true;
    const entry = el(`<div class="set">
      <div class="t">${g.type === 'weight' ? 'Weigh in' : 'Log an attempt'}</div>
      <div class="h">${g.type === 'weight'
        ? (last ? `Last weigh-in ${shortD(last.date)} at ${last.value} kg. ${g.cadence ? (due ? 'Due now.' : `Next one in ${g.cadence - between(last.date, today())} days.`) : ''}` : 'No weigh-ins yet.')
        : (last ? `Best so far ${last.value} ${esc(g.unit || '')} on ${shortD(last.date)}.` : 'No attempts logged.')}</div>
      <div class="grid2">
        <label class="f"><span>${g.type === 'weight' ? 'Weight kg' : 'Result ' + esc(g.unit || '')}</span>
          <input class="fld" id="v" type="number" inputmode="decimal"></label>
        <label class="f"><span>Date</span><input class="fld" id="d" type="date" value="${today()}"></label>
      </div>
      <div class="btnrow"><button class="act sm" id="lg">Log it</button></div></div>`);
    entry.querySelector('#lg').onclick = () => {
      const v = parseFloat(entry.querySelector('#v').value);
      if (isNaN(v)) return toast('Enter a number.', false);
      const d = entry.querySelector('#d').value || today();
      g.entries = (g.entries || []).filter(e => e.date !== d).concat([{ date: d, value: v }]);
      if (g.type === 'weight') { state.weightKg = v; put(d, { weightKg: v }); }
      save(); render(); toast('Logged.', false);
    };
    c.appendChild(entry);

    const hist = entriesOf(g).slice(-8).reverse();
    if (hist.length > 1) {
      const h = el(`<div class="set"><div class="t">History</div></div>`);
      hist.forEach((e, i) => {
        const prev = hist[i + 1];
        const delta = prev ? Math.round((e.value - prev.value) * 10) / 10 : null;
        h.appendChild(el(`<div class="hrow" style="padding-left:0;padding-right:0">
          <span class="d">${shortD(e.date)}</span>
          <span class="n" style="width:auto;flex:1">${e.value} ${esc(g.unit || '')}</span>
          <span class="amt" style="margin:0;color:${delta == null ? 'var(--muted)' : (g.lowerIsBetter || g.type === 'weight') ? (delta < 0 ? 'var(--brand)' : 'var(--red)') : (delta > 0 ? 'var(--brand)' : 'var(--red)')}">
            ${delta == null ? '' : (delta > 0 ? '+' : '') + delta}</span></div>`));
      });
      c.appendChild(h);
    }
  }

  const plan = el(`<div class="set">
    ${g.plan ? `<div class="coach" style="padding:0 0 10px"><div class="bubble">${esc(g.plan)}</div></div>` : ''}
    ${goalPlanBusy === g.id ? '<div class="h"><span class="spin"></span> Working out a plan.</div>' : ''}
    <div class="btnrow"><button class="act sm ghost" id="pl">${g.plan ? 'New plan' : 'Ask for a plan'}</button>
    <button class="act sm ghost" id="rm">Remove goal</button></div></div>`);
  plan.querySelector('#pl').disabled = !!goalPlanBusy;
  plan.querySelector('#pl').onclick = () => goalPlan(g);
  plan.querySelector('#rm').onclick = () => {
    state.goals = goals().filter(x => x.id !== g.id);
    save(); render(); toast('Goal removed.', false);
  };
  c.appendChild(plan);
  return c;
}

/* ---------- Progress tab ---------- */
function pgProgress(t, n, fin) {
  const out = [];
  if (!state.name) { state.onboarded = false; obStep = 0; return out; }
  out.push(calendarCard(t));
  out.push(recordCard(n, fin));
  out.push(weekCard());
  out.push(photoCard(t));
  out.push(badgeCard());
  return out;
}

function calendarCard(t) {
  if (!calMonth) calMonth = t.slice(0, 7);
  const [Y, M] = calMonth.split('-').map(Number);
  const first = new Date(Y, M-1, 1), start = (first.getDay() + 6) % 7;
  const days = new Date(Y, M, 0).getDate();
  const c = el(`<div class="card"><div class="head"><h2>Calendar</h2>
    <span class="meta">${statsAll().perfect} perfect days</span></div>
    <div class="cal"><div class="mnav"><button id="pv">‹</button>
      <b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button id="nx">›</button></div>
      <div class="wk hd">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="wk" id="grid"></div></div>
    <div class="legend"><span><i style="background:var(--brand)"></i>Perfect</span>
      <span><i style="background:var(--amber-soft);border:1px solid #EBD9B4"></i>Partial</span>
      <span><i style="background:var(--red-soft);border:1px solid #F0D3CF"></i>Missed</span>
      <span><i style="background:var(--card);border:1px solid var(--line)"></i>Outside the run</span></div></div>`);
  const grid = c.querySelector('#grid');
  for (let i = 0; i < start; i++) grid.appendChild(el(`<div class="cell out">0</div>`));
  for (let day = 1; day <= days; day++) {
    const ds = `${Y}-${String(M).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const inRun = state.runStart && between(state.runStart, ds) >= 0 && between(state.runStart, ds) < TOTAL;
    const past = between(ds, cutoff()) > 0;
    let cls = '';
    if (inRun) {
      const dn = countDone(ds);
      cls = dn === tasks().length ? 'perfect' : (past ? (dn === 0 ? 'missed' : 'part') : (dn > 0 ? 'part' : ''));
    }
    const cell = el(`<div class="cell ${cls} ${ds === t ? 'today' : ''}" title="${inRun ? `Day ${between(state.runStart, ds)+1} · ${countDone(ds)}/${tasks().length}` : shortD(ds)}">${day}</div>`);
    grid.appendChild(cell);
  }
  const shift = k => { const d = new Date(Y, M-1+k, 1); calMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; render(); };
  c.querySelector('#pv').onclick = () => shift(-1);
  c.querySelector('#nx').onclick = () => shift(1);
  return c;
}

function recordCard(n, fin) {
  const s = statsAll(), cur = state.runStart ? Math.min(n, TOTAL) : 0;
  const rows = [['Day', cur], ['Streak', currentStreak()], ['Perfect', s.perfect], ['Restarts', s.resets],
    ['Workout min', s.minutes], ['Outdoor', s.outdoor], ['Pages', s.pages], ['Photos', s.photoDays]];
  const c = el(`<div class="card"><div class="head"><h2>Record</h2>
    <span class="meta">${Math.max(state.longest||0, fin ? TOTAL : cur)} best run</span></div>
    <div class="bars" id="bars"></div><div class="axis"><span>Day 1</span><span>Day 38</span><span>Day 75</span></div>
    <div class="stats">${rows.map(r=>`<div class="stat"><div class="v">${r[1]}</div><div class="k">${r[0]}</div></div>`).join('')}</div></div>`);
  const bars = c.querySelector('#bars'), of = tasks().length;
  for (let i = 0; i < TOTAL; i++) {
    const d = state.runStart ? addDays(state.runStart, i) : null;
    const past = d ? between(d, cutoff()) > 0 : false, dn = d ? countDone(d) : 0;
    const b = document.createElement('div');
    b.className = 'bar' + (dn === of ? ' full' : dn > 0 ? '' : past ? ' miss' : ' empty');
    b.innerHTML = `<i style="height:${dn === 0 ? 3 : Math.round(dn/of*100)}%"></i>`;
    b.title = d ? `Day ${i+1} · ${shortD(d)} · ${dn}/${of}` : `Day ${i+1}`;
    bars.appendChild(b);
  }
  return c;
}

function weekCard() {
  const w = weekStats(), of = tasks().length;
  const perfect = w.filter(x => x.done === of).length;
  const avgP = Math.round(w.reduce((a,x)=>a+x.protein,0) / 7);
  const mins = w.reduce((a,x)=>a+x.minutes,0);
  const pages = w.reduce((a,x)=>a+x.pages,0);
  const weights = w.filter(x => x.weight);
  const moods = w.filter(x => x.mood);
  const c = el(`<div class="card"><div class="head"><h2>This week</h2><span class="meta">Last 7 days</span></div>
    <div class="stats">
      <div class="stat"><div class="v">${perfect}/7</div><div class="k">Perfect</div></div>
      <div class="stat"><div class="v">${mins}</div><div class="k">Workout min</div></div>
      <div class="stat"><div class="v">${avgP}</div><div class="k">Avg protein g</div></div>
      <div class="stat"><div class="v">${pages}</div><div class="k">Pages</div></div>
    </div>
    <div class="set"><div class="h">
      ${weights.length >= 2 ? `Weight moved from ${weights[0].weight} to ${weights[weights.length-1].weight} kg. ` : 'Log weight twice in a week to see the trend. '}
      ${moods.length ? `Average mood ${(moods.reduce((a,x)=>a+x.mood,0)/moods.length).toFixed(1)} out of 5.` : 'No mood entries this week.'}
    </div>
    ${reportBusy ? '<div class="h" style="margin-top:10px"><span class="spin"></span> Writing the review.</div>' : ''}
    ${reportText ? `<div class="coach" style="padding:12px 0 0"><div class="bubble">${esc(reportText)}</div></div>` : ''}
    <div class="btnrow"><button class="act sm ghost" id="rp">${reportText ? 'Rewrite the review' : 'Write a weekly review'}</button></div></div></div>`);
  const b = c.querySelector('#rp');
  b.disabled = reportBusy;
  b.onclick = runReport;
  return c;
}

function photoCard(t) {
  const dates = Object.keys(photos).sort();
  const c = el(`<div class="card"><div class="head"><h2>Photo timeline</h2>
    <span class="meta">${dates.length} ${dates.length === 1 ? 'photo' : 'photos'}</span></div></div>`);
  if (!dates.length) {
    c.appendChild(el(`<div class="set"><div class="h">No photos yet. Photos are stored on this device only and never shared with your crew.</div>
      <div class="btnrow"><button class="act sm" id="ad">Add today's photo</button></div></div>`));
    c.querySelector('#ad').onclick = () => pickPhoto(t);
    return c;
  }
  const strip = el(`<div class="strip"></div>`);
  dates.forEach(d => {
    const s = el(`<div class="shot ${cmp.includes(d) ? 'sel' : ''}"><img src="${photos[d]}" alt="Progress photo ${shortD(d)}"><b>${state.runStart && between(state.runStart, d) >= 0 ? 'D' + (between(state.runStart, d)+1) : shortD(d)}</b></div>`);
    s.onclick = () => {
      if (cmp.includes(d)) cmp = cmp.filter(x => x !== d);
      else cmp = cmp.concat([d]).slice(-2);
      render();
    };
    strip.appendChild(s);
  });
  c.appendChild(strip);
  if (cmp.length === 2) {
    const [a, b] = cmp.slice().sort();
    const days = state.runStart ? [between(state.runStart, a)+1, between(state.runStart, b)+1] : [null, null];
    c.appendChild(el(`<div class="compare">
      <figure><img src="${photos[a]}" alt="Earlier photo"><figcaption>${days[0] ? 'Day ' + days[0] + ' · ' : ''}${shortD(a)}</figcaption></figure>
      <figure><img src="${photos[b]}" alt="Later photo"><figcaption>${days[1] ? 'Day ' + days[1] + ' · ' : ''}${shortD(b)}</figcaption></figure></div>`));
  }
  const f = el(`<div class="set"><div class="h">${cmp.length === 2 ? 'Tap a thumbnail to change the pair.' : 'Tap two thumbnails to compare them side by side.'}</div>
    <div class="btnrow"><button class="act sm" id="ad">${photos[t] ? "Replace today's photo" : "Add today's photo"}</button>
    ${cmp.length ? '<button class="act sm ghost" id="cc">Clear selection</button>' : ''}</div></div>`);
  f.querySelector('#ad').onclick = () => pickPhoto(t);
  const cc = f.querySelector('#cc'); if (cc) cc.onclick = () => { cmp = []; render(); };
  c.appendChild(f);
  return c;
}

function badgeCard() {
  const got = earned();
  const c = el(`<div class="card"><div class="head"><h2>Badges</h2>
    <span class="meta">${got.length} of ${BADGES.length}</span></div><div class="badges"></div></div>`);
  const g = c.querySelector('.badges');
